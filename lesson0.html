<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>0-dars: Alifbe / Alphabet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
    /* ===== HEADER (Lesson 1 style - INLINE) ===== */
    .dono-header {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 14px 0 rgba(0,0,0,0.08);
      border: 4px solid #fff;
      overflow: hidden;
      position: relative;
    }
    .dono-header .content {
      position: relative;
      z-index: 2;
      padding: 14px;
    }
    .dono-header .top-row {
      display: grid;
      grid-template-columns: 88px 1fr 88px;
      align-items: center;
      gap: 10px;
    }
    .dono-header .topIcon {
      width: 82px;
      height: 82px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 62px;
      line-height: 1;
      user-select: none;
      text-decoration: none;
    }
    .dono-header .topIcon:active { transform: translateY(2px) scale(0.98); }
    .dono-header .titleWrap {
      min-width: 0;
      text-align: center;
    }
    .dono-header .title {
      margin: 0;
      font-size: 34px;
      font-weight: 1000;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1f2937;
    }
    .dono-header .sub {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 1000;
      color: rgba(31,41,55,0.65);
    }
    .dono-header .progress-track {
      height: 18px;
      background: rgba(255,255,255,0.65);
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 4px 0;
      box-shadow: inset 0 2px 0 rgba(0,0,0,0.06);
      border: 2px solid rgba(255,255,255,0.7);
    }
    .dono-header .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #34d399);
      transition: width 0.45s ease;
    }
    .dono-header .mini {
      text-align: center;
      margin-top: 10px;
      font-size: 20px;
      font-weight: 1000;
      color: #111827;
    }
    .dono-header .langRow {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
    }
    .dono-header .langBtn {
      width: 118px;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 1000;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: rgba(255,255,255,0.70);
      color: #1e4ed8;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }
    .dono-header .langBtn.active {
      background: #2f6bff;
      color: #fff;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.10);
    }
    /* SKY LAYER */
    .dono-header .sky {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 214, 102, 0.78) 0%, rgba(255, 214, 102, 0.0) 58%),
        linear-gradient(180deg, #7DD3FC 0%, #A5F3FC 45%, #FFF6E8 100%);
    }
    .dono-header .sun {
      position: absolute;
      left: -30px;
      top: -35px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFF7C2 0%, #FFD400 45%, #FFB300 100%);
      box-shadow: 0 18px 35px rgba(255,179,0,0.35);
      animation: sunBob 4s ease-in-out infinite;
    }
    @keyframes sunBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(6px) rotate(1.5deg); }
    }
    .dono-header .sun::before {
      content: "";
      position: absolute;
      inset: -58px;
      border-radius: 50%;
      background: repeating-conic-gradient(from -10deg, rgba(255,214,0,0.0) 0deg 10deg, rgba(255,214,0,0.32) 10deg 14deg);
      opacity: 0.65;
      animation: raysSpin 18s linear infinite;
    }
    @keyframes raysSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .dono-header .cloud {
      position: absolute;
      width: 170px;
      height: 58px;
      background: rgba(255,255,255,0.90);
      border-radius: 999px;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.08));
    }
    .dono-header .cloud::before,
    .dono-header .cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.90);
      border-radius: 50%;
    }
    .dono-header .cloud::before {
      width: 74px; height: 74px;
      left: 18px; top: -30px;
    }
    .dono-header .cloud::after {
      width: 96px; height: 96px;
      left: 62px; top: -44px;
    }
    .dono-header .c1 { top: 22px; left: 120px; opacity: 0.95; animation: cloudMove1 70s linear infinite; }
    .dono-header .c2 { top: 78px; left:  20px; opacity: 0.85; transform: scale(0.9);  animation: cloudMove2 95s linear infinite; }
    .dono-header .c3 { top: 45px; left: 420px; opacity: 0.80; transform: scale(1.05); animation: cloudMove3 120s linear infinite; }
    @keyframes cloudMove1 { from { transform: translateX(-320px); } to { transform: translateX(1400px); } }
    @keyframes cloudMove2 { from { transform: translateX(1200px) scale(0.9); } to { transform: translateX(-340px) scale(0.9); } }
    @keyframes cloudMove3 { from { transform: translateX(-640px) scale(1.05); } to { transform: translateX(1000px) scale(1.05); } }
    .dono-header .sparkle {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.25);
      animation: twinkle 3.2s ease-in-out infinite;
    }
    .dono-header .s1 { top: 26px; right: 120px; animation-delay: 0.2s; }
    .dono-header .s2 { top: 60px; right:  70px; animation-delay: 1.1s; }
    .dono-header .s3 { top: 34px; right: 180px; animation-delay: 1.9s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50%     { transform: scale(1.15); opacity: 1; }
    }
    @media (max-width: 560px) {
      .dono-header { max-width: 520px; border-radius: 26px; }
      .dono-header .title { font-size: 30px; }
      .dono-header .topIcon { width: 74px; height: 74px; font-size: 58px; }
      .dono-header .top-row { grid-template-columns: 78px 1fr 78px; }
      .dono-header .langBtn { width: 108px; padding: 9px 0; font-size: 15px; }
    }

    :root{
      --bg:#E8F5E9;
      --panel:#FFFFFF;
      --ink:#1F2937;
      --muted:#6B7280;

      --blue:#2F6BFF;
      --blueDark:#1E4ED8;
      --primary:#2F6BFF;

      --accent:#FF4D8D;
      --accent2:#22C55E;

      --yellow:#FACC15;
      --gold:#F59E0B;

      --good:#22C55E;
      --bad:#EF4444;

      --shadow:0 16px 34px rgba(0,0,0,0.10);
      --shadowSoft:0 10px 22px rgba(0,0,0,0.10);
      --rBig:25px;
      --r:22px;
      --pad:16px;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Quicksand', sans-serif;
      background:var(--bg);
      color:var(--ink);
      padding:12px;
    }
    .app{max-width:520px;margin:0 auto;}

    .panel{
      margin-top:16px;background:#fff;border-radius:var(--rBig);
      box-shadow:var(--shadowSoft);padding:16px;display:none;
    }
    .panel.show{display:block;}
    .panelTitle{
      margin:0 0 10px;font-weight:1000;font-size:22px;color:#111827;
      display:flex;align-items:center;gap:10px;
    }

    .hint{ text-align:center;color:var(--muted);font-weight:900;margin:6px 0 0; }

    /* ====== CELEBRATION OVERLAY ====== */
    .celebrate-overlay{
      display:none;
      position:fixed; inset:0;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      align-items:center; justify-content:center;
      padding: 16px;
    }
    .celebrate-overlay.show{ display:flex; }
    .celebrate-card{
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 30px;
      padding: 22px;
      text-align:center;
      box-shadow: 0 14px 0 rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      border: 6px solid #fff;
    }
    .celebrate-emoji{ font-size: 60px; }
    .celebrate-title{ font-size: 24px; font-weight: 800; margin-top: 6px; }
    .celebrate-text{ color:#374151; font-weight: 700; margin-top: 8px; font-size: 15px; }
    .celebrate-btn{
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border-radius: 18px;
      border: none;
      background: var(--good);
      color: white;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 6px 0 #09725b;
    }
    .celebrate-btn:active{ transform: translateY(3px); box-shadow: 0 3px 0 #09725b; }
    .confetti{
      position:absolute; inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .dot{
      position:absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      opacity: 0.95;
      animation: fall 2.2s linear forwards;
    }
    @keyframes fall{
      0%{ transform: translateY(-20px) rotate(0deg); }
      100%{ transform: translateY(560px) rotate(360deg); opacity: 0.9; }
    }
    /* ====== ALIFBE (Buchstabenkarten) ====== */
    .alphaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
    @media(min-width:480px){.alphaGrid{grid-template-columns:repeat(4,1fr);}}
    .letterCard{position:relative;background:#fff;border:none;border-top:6px solid var(--lc,#EF4444);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,0.08);padding:18px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;touch-action:manipulation;transition:transform .12s ease;user-select:none;}
    .letterCard:active{transform:scale(.94);}
    .letterCard.pop{animation:lcPop .35s ease;}
    @keyframes lcPop{0%{transform:scale(1);}50%{transform:scale(1.12) rotate(-2deg);}100%{transform:scale(1);}}
    .lcUp{font-size:44px;font-weight:1000;color:var(--lc);line-height:1;}
    .lcLow{font-size:22px;font-weight:800;color:#6B7280;line-height:1.1;}
    .lcEmoji{font-size:34px;margin-top:8px;line-height:1.2;}
    .lcWord{font-size:15px;font-weight:1000;color:#374151;margin-top:2px;}
    .lcStar{position:absolute;top:6px;right:8px;font-size:18px;opacity:.25;filter:grayscale(1);}
    .letterCard.heard .lcStar{opacity:1;filter:none;}
    .letterCard.heard{background:#FFFBEB;}
  </style>
<base target="_blank">
</head>
<body>

<!-- CELEBRATION OVERLAY -->
<div class="celebrate-overlay" id="celebrateOverlay">
  <div class="celebrate-card">
    <div class="confetti" id="confetti"></div>
    <div class="celebrate-emoji" id="celebrateEmoji">🎓</div>
    <div class="celebrate-title" id="celebrateTitle">Barakalla!</div>
    <div class="celebrate-text" id="celebrateText">Siz butun alifbeni tingladingiz!</div>
    <button class="celebrate-btn" id="celebrateOkBtn" onclick="closeCelebrate()">OK ✅</button>
  </div>
</div>

<!-- ANIMATED HEADER (Lesson style with sun, clouds, sparkles) -->
<div id="lessonHeader"></div>

<div class="app">

  <!-- ALIFBE -->
  <div class="panel show" id="panel-alpha">
    <div class="panelTitle"><span id="panelTitleAlpha">🔤 Alifbe</span></div>
    <p class="hint" id="hintAlpha">Har bir harfni bos va tingla!</p>
    <div class="alphaGrid" id="alphaGrid"></div>
  </div>

</div>

<script>
(function(){
    const DEFAULTS = {
      mountId: "lessonHeader",
      title: "Dars",
      subtitle: "",
      total: 10,
      learned: 0,
      homeHref: "index.html",
      bookTargetId: "panel-learn",
      lang: "uz",
      onLangChange: null,
    };
    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
    function scrollToId(id){
      const el = document.getElementById(id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    }
    function buildHeaderHTML(opts){
      const learned = clamp(Number(opts.learned || 0), 0, opts.total);
      const pct = opts.total ? (learned / opts.total) * 100 : 0;
      return `
        <div class="dono-header" data-total="${opts.total}">
          <div class="sky">
            <div class="sun"></div>
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="sparkle s1"></div>
            <div class="sparkle s2"></div>
            <div class="sparkle s3"></div>
          </div>
          <div class="content">
            <div class="top-row">
              <button class="topIcon" id="hdrHomeBtn" aria-label="Home" type="button">&#127968;</button>
              <div class="titleWrap">
                <h1 class="title" id="hdrTitle">${opts.title}</h1>
                <div class="sub" id="hdrSub">${opts.subtitle || ""}</div>
              </div>
              <button class="topIcon" id="hdrBookBtn" aria-label="Book" type="button">&#128214;</button>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="hdrFill" style="width:${pct}%"></div>
            </div>
            <div class="mini" id="hdrMini">${learned} / ${opts.total}</div>
            <div class="langRow">
              <button class="langBtn ${opts.lang === "uz" ? "active" : ""}" id="hdrUZ" type="button">UZ</button>
              <button class="langBtn ${opts.lang === "en" ? "active" : ""}" id="hdrEN" type="button">EN</button>
            </div>
          </div>
        </div>
      `;
    }
    function attachHeaderEvents(root, opts){
      const homeBtn = root.querySelector("#hdrHomeBtn");
      const bookBtn = root.querySelector("#hdrBookBtn");
      const uzBtn = root.querySelector("#hdrUZ");
      const enBtn = root.querySelector("#hdrEN");
      if(homeBtn){
        homeBtn.addEventListener("click", () => {
          if(opts.homeHref) window.location.href = opts.homeHref;
        });
      }
      if(bookBtn){
        bookBtn.addEventListener("click", () => {
          if(opts.bookTargetId === "albumOverlay"){ toggleAlbum(); return; }
          if(opts.bookTargetId) scrollToId(opts.bookTargetId);
        });
      }
      const setLangUI = (lang) => {
        uzBtn?.classList.toggle("active", lang === "uz");
        enBtn?.classList.toggle("active", lang === "en");
      };
      uzBtn?.addEventListener("click", () => {
        setLangUI("uz");
        if(typeof opts.onLangChange === "function") opts.onLangChange("uz");
      });
      enBtn?.addEventListener("click", () => {
        setLangUI("en");
        if(typeof opts.onLangChange === "function") opts.onLangChange("en");
      });
    }
    window.renderLessonHeader = function(options){
      const opts = {...DEFAULTS, ...(options || {})};
      const mount = document.getElementById(opts.mountId);
      if(!mount){ console.warn("renderLessonHeader(): mount element not found:", opts.mountId); return; }
      mount.innerHTML = buildHeaderHTML(opts);
      attachHeaderEvents(mount, opts);
    };
    window.setHeaderProgress = function({ learned, total, learnedText } = {}){
      const header = document.querySelector(".dono-header");
      if(!header) return;
      const t = total ?? Number(header.getAttribute("data-total") || 10);
      const l = clamp(Number(learned ?? 0), 0, t);
      const pct = t ? (l / t) * 100 : 0;
      const mini = header.querySelector("#hdrMini");
      const fill = header.querySelector("#hdrFill");
      if(mini) mini.textContent = `${l} / ${t}`;
      if(fill) fill.style.width = pct + "%";
    };
  })();
</script>

  };

  const LETTERS_UZ = [{"u": "A", "l": "a", "w": "Anor", "e": "🍎", "c": "#EF4444"}, {"u": "B", "l": "b", "w": "Baliq", "e": "🐟", "c": "#10B981"}, {"u": "D", "l": "d", "w": "Darvoza", "e": "🚪", "c": "#F59E0B"}, {"u": "E", "l": "e", "w": "Eshek", "e": "🐴", "c": "#3B82F6"}, {"u": "F", "l": "f", "w": "Futbol", "e": "⚽", "c": "#8B5CF6"}, {"u": "G", "l": "g", "w": "Gilos", "e": "🍒", "c": "#EC4899"}, {"u": "H", "l": "h", "w": "Hovli", "e": "🏡", "c": "#EF4444"}, {"u": "I", "l": "i", "w": "It", "e": "🐕", "c": "#10B981"}, {"u": "J", "l": "j", "w": "Jo'ja", "e": "🐤", "c": "#F59E0B"}, {"u": "K", "l": "k", "w": "Kema", "e": "🚢", "c": "#3B82F6"}, {"u": "L", "l": "l", "w": "Lola", "e": "🌷", "c": "#8B5CF6"}, {"u": "M", "l": "m", "w": "Mashina", "e": "🚗", "c": "#EC4899"}, {"u": "N", "l": "n", "w": "Non", "e": "🍞", "c": "#EF4444"}, {"u": "O", "l": "o", "w": "Olma", "e": "🍏", "c": "#10B981"}, {"u": "P", "l": "p", "w": "Poyezd", "e": "🚂", "c": "#F59E0B"}, {"u": "Q", "l": "q", "w": "Qalam", "e": "✏️", "c": "#3B82F6"}, {"u": "R", "l": "r", "w": "Rasm", "e": "🖼️", "c": "#8B5CF6"}, {"u": "S", "l": "s", "w": "Samolyot", "e": "✈️", "c": "#EC4899"}, {"u": "T", "l": "t", "w": "Tuya", "e": "🐫", "c": "#EF4444"}, {"u": "U", "l": "u", "w": "Uy", "e": "🏠", "c": "#10B981"}, {"u": "V", "l": "v", "w": "Velosiped", "e": "🚲", "c": "#F59E0B"}, {"u": "X", "l": "x", "w": "Xat", "e": "✉️", "c": "#3B82F6"}, {"u": "Y", "l": "y", "w": "Yomg'ir", "e": "🌧️", "c": "#8B5CF6"}, {"u": "Z", "l": "z", "w": "Zanjir", "e": "⛓️", "c": "#EC4899"}, {"u": "Oʻ", "l": "oʻ", "w": "O't", "e": "🌿", "c": "#EF4444"}, {"u": "Gʻ", "l": "gʻ", "w": "G'oz", "e": "🦆", "c": "#10B981"}, {"u": "Sh", "l": "sh", "w": "Sher", "e": "🦁", "c": "#F59E0B"}, {"u": "Ch", "l": "ch", "w": "Chiroq", "e": "💡", "c": "#3B82F6"}, {"u": "Ng", "l": "ng", "w": "Tong", "e": "🌅", "c": "#8B5CF6"}];
  const LETTERS_EN = [{"u": "A", "l": "a", "w": "Apple", "e": "🍎", "c": "#EF4444"}, {"u": "B", "l": "b", "w": "Ball", "e": "⚽", "c": "#10B981"}, {"u": "C", "l": "c", "w": "Cat", "e": "🐱", "c": "#F59E0B"}, {"u": "D", "l": "d", "w": "Dog", "e": "🐕", "c": "#3B82F6"}, {"u": "E", "l": "e", "w": "Egg", "e": "🥚", "c": "#8B5CF6"}, {"u": "F", "l": "f", "w": "Fish", "e": "🐟", "c": "#EC4899"}, {"u": "G", "l": "g", "w": "Grapes", "e": "🍇", "c": "#EF4444"}, {"u": "H", "l": "h", "w": "House", "e": "🏠", "c": "#10B981"}, {"u": "I", "l": "i", "w": "Ice cream", "e": "🍦", "c": "#F59E0B"}, {"u": "J", "l": "j", "w": "Juice", "e": "🧃", "c": "#3B82F6"}, {"u": "K", "l": "k", "w": "Kite", "e": "🪁", "c": "#8B5CF6"}, {"u": "L", "l": "l", "w": "Lion", "e": "🦁", "c": "#EC4899"}, {"u": "M", "l": "m", "w": "Mouse", "e": "🐭", "c": "#EF4444"}, {"u": "N", "l": "n", "w": "Nose", "e": "👃", "c": "#10B981"}, {"u": "O", "l": "o", "w": "Orange", "e": "🍊", "c": "#F59E0B"}, {"u": "P", "l": "p", "w": "Pig", "e": "🐷", "c": "#3B82F6"}, {"u": "Q", "l": "q", "w": "Queen", "e": "👑", "c": "#8B5CF6"}, {"u": "R", "l": "r", "w": "Rabbit", "e": "🐰", "c": "#EC4899"}, {"u": "S", "l": "s", "w": "Sun", "e": "☀️", "c": "#EF4444"}, {"u": "T", "l": "t", "w": "Train", "e": "🚂", "c": "#10B981"}, {"u": "U", "l": "u", "w": "Umbrella", "e": "☂️", "c": "#F59E0B"}, {"u": "V", "l": "v", "w": "Violin", "e": "🎻", "c": "#3B82F6"}, {"u": "W", "l": "w", "w": "Watch", "e": "⌚", "c": "#8B5CF6"}, {"u": "X", "l": "x", "w": "Xylophone", "e": "🎶", "c": "#EC4899"}, {"u": "Y", "l": "y", "w": "Yo-yo", "e": "🪀", "c": "#EF4444"}, {"u": "Z", "l": "z", "w": "Zebra", "e": "🦓", "c": "#10B981"}];

  let state = { lang:"uz", heard:{}, celebrated:{} };

  function save(){ localStorage.setItem(LESSON_ID, JSON.stringify(state)); }
  function load(){
    const raw = localStorage.getItem(LESSON_ID);
    if(!raw) return;
    try{
      const s = JSON.parse(raw);
      state.lang = s.lang || "uz";
      state.heard = s.heard || {};
      state.celebrated = s.celebrated || {};
    }catch(e){}
  }

  const GLOBAL_LEARNED_KEY = "learned";
  function getGlobalLearnedSet(){
    try { return new Set(JSON.parse(localStorage.getItem(GLOBAL_LEARNED_KEY) || "[]")); }
    catch { return new Set(); }
  }
  function markGlobalLearned(wordKey){
    const learned = getGlobalLearnedSet();
    const gKey = "L0_" + wordKey;
    if(!learned.has(gKey)){
      learned.add(gKey);
      localStorage.setItem(GLOBAL_LEARNED_KEY, JSON.stringify([...learned]));
    }
  }

  function letters(){ return (state.lang === "uz") ? LETTERS_UZ : LETTERS_EN; }
  function heardKey(L){ return state.lang + "_" + L.u; }
  function heardCount(){ return letters().filter(L => state.heard[heardKey(L)]).length; }

  function T(key){
    return (UI[state.lang] && UI[state.lang][key]) ? UI[state.lang][key] : UI.uz[key];
  }

  let audioCtx = null;
  function beepSuccess(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = "triangle"; o.frequency.setValueAtTime(520, t);
      o.frequency.exponentialRampToValueAtTime(880, t + 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.start(t); o.stop(t + 0.18);
    }catch(e){}
  }

  function speakLetter(L){
    try{
      const u = new SpeechSynthesisUtterance(L.u + ". " + L.w + "!");
      u.lang = (state.lang === "uz") ? "uz-UZ" : "en-US";
      u.rate = 0.9; u.pitch = 1.05;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function renderLetters(){
    const grid = document.getElementById("alphaGrid");
    grid.innerHTML = "";
    letters().forEach((L, idx) => {
      const b = document.createElement("button");
      b.className = "letterCard" + (state.heard[heardKey(L)] ? " heard" : "");
      b.style.setProperty("--lc", L.c);
      b.innerHTML = '<span class="lcStar">⭐</span>' +
        '<span class="lcUp">' + L.u + '</span>' +
        '<span class="lcLow">' + L.l + '</span>' +
        '<span class="lcEmoji">' + L.e + '</span>' +
        '<span class="lcWord">' + L.w + '</span>';
      b.addEventListener("click", () => tapLetter(idx, b));
      grid.appendChild(b);
    });
  }

  function tapLetter(idx, card){
    const L = letters()[idx];
    if(!L) return;
    speakLetter(L);
    beepSuccess();
    card.classList.add("heard");
    card.classList.remove("pop");
    void card.offsetWidth;
    card.classList.add("pop");
    const k = heardKey(L);
    if(!state.heard[k]){
      state.heard[k] = true;
      markGlobalLearned(k);
      save();
      updateProgress();
      checkComplete();
    }
  }

  function checkComplete(){
    const all = letters().every(L => state.heard[heardKey(L)]);
    if(all && !state.celebrated[state.lang]){
      state.celebrated[state.lang] = true;
      save();
      celebrate();
    }
  }

  // ==========================================
  // CELEBRATION OVERLAY
  // ==========================================
  function celebrate(){
    document.getElementById("celebrateEmoji").innerText = T("winEmoji");
    document.getElementById("celebrateTitle").innerText = T("winTitle");
    document.getElementById("celebrateText").innerText = T("winText");
    const conf = document.getElementById("confetti");
    conf.innerHTML = "";
    const colors = ["#F59E0B","#EF4444","#10B981","#3B82F6","#A855F7","#F97316"];
    for(let i = 0; i < 75; i++){
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = (Math.random()*100) + "%";
      d.style.top  = (-30 - Math.random()*220) + "px";
      d.style.background = colors[Math.floor(Math.random()*colors.length)];
      d.style.animationDelay = (Math.random()*0.25) + "s";
      d.style.animationDuration = (1.6 + Math.random()*1.1) + "s";
      conf.appendChild(d);
    }
    document.getElementById("celebrateOverlay").classList.add("show");
    beepSuccess();
  }

  function closeCelebrate(){
    document.getElementById("celebrateOverlay").classList.remove("show");
  }

  function updateAllTexts(){
    const hTitle = document.getElementById("hdrTitle");
    if(hTitle) hTitle.innerText = T("title");
    const hSub = document.getElementById("hdrSub");
    if(hSub) hSub.innerText = T("subtitle") || "";
    document.getElementById("panelTitleAlpha").innerText = T("panelAlpha");
    document.getElementById("hintAlpha").innerText = T("hintAlpha");
    document.getElementById("celebrateOkBtn").innerText = T("okBtn");
    updateProgress();
  }

  function setLang(l){
    state.lang = l;
    const uzBtn = document.getElementById('hdrUZ');
    const enBtn = document.getElementById('hdrEN');
    if(uzBtn) uzBtn.classList.toggle('active', l === 'uz');
    if(enBtn) enBtn.classList.toggle('active', l === 'en');
    save();
    updateAllTexts();
    renderLetters();
  }

  function updateProgress(){
    if(typeof setHeaderProgress === 'function'){
      setHeaderProgress({ learned: heardCount(), total: letters().length });
    }
  }

  function initHeader(){
    if(typeof renderLessonHeader !== 'function'){
      console.warn('header builder missing');
      return;
    }
    renderLessonHeader({
      mountId: "lessonHeader",
      title: UI[state.lang].title,
      subtitle: UI[state.lang].subtitle || "",
      total: letters().length,
      learned: heardCount(),
      homeHref: "index.html",
      lang: state.lang,
      onLangChange: (lang) => setLang(lang),
      bookTargetId: "panel-alpha"
    });
  }

  (function init(){
    load();
    initHeader();
    updateAllTexts();
    renderLetters();
  })();

</script>
</body>
</html>
