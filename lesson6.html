<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6-dars: Sabzavot</title>
  <link rel="stylesheet" href="components/header.css">
  <script src="components/header.js" defer></script>
  <style>
    :root{--bg:#F3E5F5;--panel:#FFFFFF;--ink:#1F2937;--muted:#6B7280;--blue:#2F6BFF;--blueDark:#1E4ED8;--accent:#FF4D8D;--accent2:#22C55E;--yellow:#FACC15;--gold:#F59E0B;--good:#22C55E;--bad:#EF4444;--shadow:0 16px 34px rgba(0,0,0,0.10);--shadowSoft:0 10px 22px rgba(0,0,0,0.10);--rBig:25px;--r:22px;--pad:16px;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:12px;}
    .app{max-width:520px;margin:0 auto;}
    .top{background:var(--panel);border-radius:var(--rBig);box-shadow:var(--shadow);padding:var(--pad);overflow:hidden;position:relative;}
    .titleRow{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center;}
    .iconBox{width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;user-select:none;font-size:48px;padding:0;}
    .iconBox:active{transform:scale(0.97);}
    .titleWrap{text-align:center;min-width:0;}
    .title{margin:0;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sub{margin-top:6px;color:var(--muted);font-weight:900;font-size:14px;}
    .track{margin:14px 4px 0;height:18px;background:#E5E7EB;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,0.06);}
    .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent2),#34D399);transition:width .35s ease;}
    .progMini{text-align:center;margin-top:10px;font-weight:900;font-size:20px;color:#111827;}
    .langRow{display:flex;justify-content:center;gap:18px;margin-top:12px;}
    .langBtn{width:140px;padding:12px 0;border:none;cursor:pointer;border-radius:999px;font-weight:1000;font-size:16px;box-shadow:var(--shadowSoft);background:#E5E7EB;color:var(--blueDark);}
    .langBtn.active{background:var(--blue);color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,0.18),var(--shadowSoft);}
    .menuWrap{margin-top:14px;background:#EDE9FE;border-radius:var(--rBig);padding:12px;box-shadow:var(--shadowSoft);}
    .menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    .menuBtn{height:70px;border-radius:18px;border:none;cursor:pointer;font-weight:1000;font-size:20px;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:var(--shadowSoft);background:#fff;color:var(--blue);user-select:none;}
    .menuBtn.primary{background:var(--blue);color:#fff;box-shadow:inset 0 -10px 0 rgba(0,0,0,0.18),var(--shadowSoft);}
    .menuBtn:active{transform:scale(0.98);}
    .menuEmoji{font-size:30px}
    .panel{margin-top:16px;background:#fff;border-radius:var(--rBig);box-shadow:var(--shadowSoft);padding:16px;display:none;}
    .panel.show{display:block;}
    .panelTitle{margin:0 0 10px;font-weight:1000;font-size:22px;color:#111827;display:flex;align-items:center;gap:10px;}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
    @media(max-width:560px){.grid{grid-template-columns:1fr;}.title{font-size:20px;}.menuBtn{font-size:18px;height:64px;}.langBtn{width:120px;}.iconBox{font-size:44px;}}
    @media screen and (max-width:375px){body{padding:8px;}.menuBtn{font-size:16px;height:58px;}.menuEmoji{font-size:24px;}.title{font-size:18px;}.sub{font-size:13px;}.iconBox{font-size:40px;width:56px;height:56px;}.vegImg{width:60px;height:60px;}.word{font-size:20px;}.langBtn{width:110px;font-size:14px;padding:10px 0;}}
    @media screen and (min-width:414px){.menuBtn{font-size:18px;padding:16px 12px;height:74px;}.vegImg{width:74px;height:74px;}.word{font-size:24px;}}
    .card{background:#fff;border-radius:var(--rBig);box-shadow:var(--shadowSoft);padding:16px;position:relative;min-height:140px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .vegImg{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));pointer-events:none;}
    .word{font-size:22px;font-weight:1000;margin-top:12px;}
    .stars{margin-top:10px;font-size:18px;font-weight:1000;letter-spacing:2px;color:var(--gold);min-height:22px;}
    .speaker{position:absolute;right:14px;top:14px;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:var(--yellow);box-shadow:inset 0 -6px 0 rgba(0,0,0,0.14),var(--shadowSoft);display:flex;align-items:center;justify-content:center;font-size:24px;}
    .speaker:active{transform:scale(0.95);}
    .hint{text-align:center;color:var(--muted);font-weight:900;margin:6px 0 0;}
    /* ===== MEMORY GAME ===== */
    .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .memory-card{height:90px;background:var(--blue);border-radius:18px;display:flex;justify-content:center;align-items:center;font-size:32px;color:white;cursor:pointer;box-shadow:0 6px 0 #0047b3;user-select:none;padding:8px;text-align:center;transition:transform .2s;}
    .memory-card.flipped{background:white;color:#2d3436;box-shadow:0 6px 0 #b8c2cc;transform:rotateY(0deg);}
    .memory-card.flipped img{width:52px;height:52px;object-fit:contain;}
    .memory-card.matched{visibility:hidden;}
    .memory-card img{width:48px;height:48px;object-fit:contain;pointer-events:none;}
    #memStats{margin-bottom:10px;font-weight:800;font-size:14px;text-align:center;}
    /* ===== SALAD GAME ===== */
    .salad-bowl{width:140px;height:100px;background:linear-gradient(180deg,#E8F5E9 0%,#C8E6C9 100%);border-radius:0 0 70px 70px;border:4px solid #81C784;margin:16px auto;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 8px 20px rgba(0,0,0,0.12);}
    .salad-bowl.filled{background:linear-gradient(180deg,#FFF9C4 0%,#FFE082 100%);border-color:var(--gold);}
    .recipe-box{background:#F3E5F5;border-radius:18px;padding:14px;text-align:center;font-weight:1000;font-size:18px;color:#4A148C;margin-bottom:14px;box-shadow:var(--shadowSoft);}
    .picked-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:52px;}
    .picked-item{width:52px;height:52px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,0.1);animation:popIn .25s ease-out;}
    .picked-item img{width:40px;height:40px;object-fit:contain;}
    @keyframes popIn{0%{transform:scale(0);}80%{transform:scale(1.15);}100%{transform:scale(1);}}
    /* ===== CELEBRATION ===== */
    .celebrate-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2000;align-items:center;justify-content:center;padding:16px;}
    .celebrate-overlay.show{display:flex;}
    .celebrate-card{width:100%;max-width:520px;background:white;border-radius:30px;padding:22px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,0.12);position:relative;overflow:hidden;border:6px solid #fff;}
    .celebrate-emoji{font-size:60px;}
    .celebrate-title{font-size:24px;font-weight:800;margin-top:6px;}
    .celebrate-text{color:#374151;font-weight:700;margin-top:8px;font-size:15px;}
    .celebrate-btn{margin-top:14px;width:100%;padding:12px;border-radius:18px;border:none;background:var(--good);color:white;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 6px 0 #09725b;}
    .celebrate-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #09725b;}
    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
    .dot{position:absolute;width:10px;height:10px;border-radius:50%;opacity:0.95;animation:fall 2.2s linear forwards;}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);}100%{transform:translateY(560px) rotate(360deg);opacity:0.9;}}
    .choiceRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;}
    .choiceBtn{padding:14px 18px;border:2px solid #E5E7EB;background:#fff;border-radius:20px;cursor:pointer;font-weight:1000;font-size:16px;box-shadow:0 8px 18px rgba(0,0,0,0.06);min-width:88px;text-align:center;}
    .choiceBtn.good{background:var(--good);color:#fff;border-color:var(--good);}
    .choiceBtn.bad{background:var(--bad);color:#fff;border-color:var(--bad);}
    .btnRow{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
    .btn{border:none;border-radius:18px;padding:14px 18px;font-weight:1000;cursor:pointer;box-shadow:var(--shadowSoft);min-width:190px;font-size:18px;}
    .btn.primary{background:var(--blue);color:#fff;box-shadow:inset 0 -10px 0 rgba(0,0,0,0.18),var(--shadowSoft);}
    .btn.soft{background:#fff;color:var(--blueDark);border:2px solid #E5E7EB;}
    .badge{font-size:14px;font-weight:1000;padding:6px 12px;border-radius:999px;background:#EEF2FF;color:var(--blueDark);}
    .badge.done{background:#ECFDF5;color:var(--good);}
    .vegPreview{width:120px;height:120px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
    .vegPreview img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.15));}
  </style>
<base target="_blank">
</head>
<body>
<div class="celebrate-overlay" id="celebrateOverlay">
  <div class="celebrate-card">
    <div class="confetti" id="confetti"></div>
    <div class="celebrate-emoji" id="celebrateEmoji">&#127881;</div>
    <div class="celebrate-title" id="celebrateTitle">Barakalla!</div>
    <div class="celebrate-text" id="celebrateText">Zo'r!</div>
    <button class="celebrate-btn" onclick="closeCelebrate()">OK &#9989;</button>
  </div>
</div>

<div class="app">
  <div class="top">
    <div class="titleRow">
      <button class="iconBox" title="Bosh sahifa" onclick="goHome()">&#127968;</button>
      <div class="titleWrap">
        <h1 class="title" id="titleText">4-dars: Sabzavot</h1>
        <div class="sub" id="progLabel">0 / 10 o'rganildi</div>
      </div>
      <button class="iconBox" title="Dars kitob" onclick="openSection('learn')">&#128214;</button>
    </div>
    <div class="track"><div class="fill" id="progFill"></div></div>
    <div class="progMini" id="progMini">0 / 10</div>
    <div class="langRow">
      <button id="btn-uz" class="langBtn active" onclick="setLang('uz')">UZ</button>
      <button id="btn-en" class="langBtn" onclick="setLang('en')">EN</button>
    </div>
    <div class="menuWrap">
      <div class="menu">
        <button class="menuBtn primary" onclick="openSection('learn')"><span class="menuEmoji">&#128216;</span><span id="menuLearn">O'rganish</span></button>
        <button class="menuBtn" onclick="openSection('memory')"><span class="menuEmoji">&#129504;</span><span id="menuMemory">Xotira</span></button>
        <button class="menuBtn" onclick="openSection('salad')"><span class="menuEmoji">&#129379;</span><span id="menuSalad">Salat</span></button>
        <button class="menuBtn" onclick="openSection('name')"><span class="menuEmoji">&#128292;</span><span id="menuName">Nomini tanla</span></button>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-learn">
    <div class="panelTitle" id="panelTitleLearn">&#128216; O'rganish</div>
    <div class="grid" id="vocabGrid"></div>
  </div>

  <div class="panel" id="panel-memory">
    <div class="panelTitle"><span id="panelTitleMemory">&#129504; Xotira</span> <span class="badge" id="gMemStatus">&#10067;</span></div>
    <p class="hint" id="hintMemory">Juftlarni toping!</p>
    <div id="memStats"><span id="movesLabel">Urinishlar</span>: <span id="moves">0</span></div>
    <div class="memory-grid" id="memoryGrid"></div>
    <div class="btnRow">
      <button class="btn primary" onclick="initMemory()" id="btnRefreshMem">&#128260; Yangilash</button>
      <button class="btn soft" onclick="closePanels()" id="btnCloseMem">&#10006; Yopish</button>
    </div>
  </div>

  <div class="panel" id="panel-salad">
    <div class="panelTitle"><span id="panelTitleSalad">&#129379; Salat</span> <span class="badge" id="gSaladStatus">&#10067;</span></div>
    <p class="hint" id="hintSalad">To'g'ri sabzavotlarni tanlang</p>
    <div class="recipe-box" id="recipeBox">Salat: Pomidor + Bodring + Piyoz</div>
    <div class="salad-bowl" id="saladBowl">&#129379;</div>
    <div class="picked-row" id="pickedRow"></div>
    <div class="choiceRow" id="saladChoices"></div>
    <div id="saladScore" style="text-align:center;margin-top:10px;font-weight:900;font-size:18px;color:var(--muted);">&#11088; 0 / 5</div>
    <div class="btnRow">
      <button class="btn primary" onclick="startSaladGame()" id="btnSaladStart">&#9654; Boshlash</button>
      <button class="btn soft" onclick="closePanels()" id="btnCloseSalad">&#10006; Yopish</button>
    </div>
  </div>

  <div class="panel" id="panel-name">
    <div class="panelTitle"><span id="panelTitleName">&#128292; Nomini tanla</span> <span class="badge" id="g4Status">&#10067;</span></div>
    <p class="hint" id="nameTask">To'g'ri nomni tanlang</p>
    <div class="vegPreview" id="namePreview"></div>
    <div class="choiceRow" id="nameGrid"></div>
    <div id="nameProgress" style="text-align:center;margin-top:10px;font-weight:900;font-size:16px;color:var(--muted);">0 / 10</div>
    <div class="btnRow">
      <button class="btn primary" onclick="startNameGame()" id="btnStart2">&#9654; Boshlash</button>
      <button class="btn soft" onclick="closePanels()" id="btnClose3">&#10006; Yopish</button>
    </div>
  </div>
</div>

  {name:{uz:"Shalgom salat",en:"Turnip salad"}, needed:["shalgom","bodring","qalampir"]},
];

let state = { lang:"uz", stars:{}, learned:{}, games:{gMem:false,gSalad:false,g4:false}, learnCelebrated:false };

function save(){ localStorage.setItem(LESSON_ID, JSON.stringify(state)); }
function load(){
  const raw = localStorage.getItem(LESSON_ID);
  if(!raw) return;
  try{
    const s = JSON.parse(raw);
    state.lang = s.lang || "uz";
    state.stars = s.stars || {};
    state.learned = s.learned || {};
    state.games = s.games || {gMem:false,gSalad:false,g4:false};
    state.learnCelebrated = s.learnCelebrated || false;
  }catch(e){}
}

function goHome(){ window.location.href="index.html"; }
function closePanels(){ document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show")); window.scrollTo({top:0,behavior:"smooth"}); }

function openSection(name){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
  const panel = document.getElementById("panel-"+name);
  if(panel) panel.classList.add("show");
  if(name==="memory") initMemory();
  if(name==="salad") startSaladGame();
  if(name==="name") startNameGame();
  panel?.scrollIntoView({behavior:"smooth",block:"start"});
}

function T(key){ return (UI[state.lang]&&UI[state.lang][key])?UI[state.lang][key]:UI.uz[key]; }

function updateAllTexts(){
  const learnedCount = Object.values(state.learned).filter(Boolean).length;
  document.getElementById("titleText").innerText = T("title");
  document.getElementById("progLabel").innerText = learnedCount + " / 10 " + T("learned");
  document.getElementById("progMini").innerText = learnedCount + " / 10";
  document.getElementById("menuLearn").innerText = T("menuLearn");
  document.getElementById("menuMemory").innerText = T("menuMemory");
  document.getElementById("menuSalad").innerText = T("menuSalad");
  document.getElementById("menuName").innerText = T("menuName");
  document.getElementById("panelTitleLearn").innerText = T("panelLearn");
  document.getElementById("panelTitleMemory").innerText = T("panelMemory");
  document.getElementById("panelTitleSalad").innerText = T("panelSalad");
  document.getElementById("panelTitleName").innerText = T("panelName");
  document.getElementById("hintMemory").innerText = T("hintMemory");
  document.getElementById("hintSalad").innerText = T("hintSalad");
  document.getElementById("nameTask").innerText = T("hintName");
  document.getElementById("movesLabel").innerText = T("movesLabel");
  document.getElementById("btnRefreshMem").innerText = T("btnRefresh");
  document.getElementById("btnSaladStart").innerText = T("btnStart");
  document.getElementById("btnStart2").innerText = T("btnStart");
  document.getElementById("btnCloseMem").innerText = T("btnClose");
  document.getElementById("btnCloseSalad").innerText = T("btnClose");
  document.getElementById("btnClose3").innerText = T("btnClose");
  updateBadges();
}

function setLang(l){
  state.lang=l;
  document.getElementById("btn-uz").classList.toggle("active",l==="uz");
  document.getElementById("btn-en").classList.toggle("active",l==="en");
  save();
  updateAllTexts();
  renderVocab();
  if(document.getElementById("panel-memory").classList.contains("show")) initMemory();
  if(document.getElementById("panel-salad").classList.contains("show")) startSaladGame();
  if(document.getElementById("panel-name").classList.contains("show")) startNameGame();
}

function starsText(n){ n=Math.max(0,Math.min(3,n||0)); return "\u2605".repeat(n)+"\u2606".repeat(3-n); }

function updateProgress(){
  const learnedCount = Object.values(state.learned).filter(Boolean).length;
  document.getElementById("progLabel").innerText = learnedCount + " / 10 " + T("learned");
  document.getElementById("progMini").innerText = learnedCount + " / 10";
  document.getElementById("progFill").style.width = (learnedCount*10)+"%";
}

function updateBadges(){
  const setBadge = (id,done)=>{ const el=document.getElementById(id); if(!el) return; el.classList.toggle("done",!!done); el.innerText = done?T("badgeDone"):T("badgeUnknown"); };
  setBadge("gMemStatus",state.games.gMem);
  setBadge("gSaladStatus",state.games.gSalad);
  setBadge("g4Status",state.games.g4);
}

let audioCtx=null;
function beepSuccess(){
  try{ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type="triangle"; o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(880,t+0.12); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.start(t); o.stop(t+0.18);
  }catch(e){}
}
function beepFail(){
  try{ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type="sawtooth"; o.frequency.setValueAtTime(220,t);
    o.frequency.exponentialRampToValueAtTime(140,t+0.14); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.start(t); o.stop(t+0.18);
  }catch(e){}
}

function speakWord(key){
  const it=items.find(x=>x.k===key); if(!it) return;
  const text = (state.lang==="uz")?it.uz:it.en;
  try{ const u=new SpeechSynthesisUtterance(text); u.lang=(state.lang==="uz")?"uz-UZ":"en-US"; u.rate=0.95; u.pitch=1.05; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }catch(e){}
  state.learned[key]=true; state.stars[key]=Math.min(3,(state.stars[key]||0)+1); beepSuccess(); save(); renderVocab(); updateProgress();
  const learnedCount = Object.values(state.learned).filter(Boolean).length;
  if(learnedCount===10&&!state.learnCelebrated){ state.learnCelebrated=true; save(); celebrate("learnWinTitle","learnWinText","learnWinEmoji"); }
}

function renderVocab(){
  const grid=document.getElementById("vocabGrid");
  grid.innerHTML = items.map(it=>{
    const word=(state.lang==="uz")?it.uz:it.en;
    const st=starsText(state.stars[it.k]||0);
    return '<div class="card"><img class="vegImg" src="'+it.img+'" alt="'+word+'"><div class="word">'+word+'</div><button class="speaker" onclick="speakWord(\''+it.k+'\')" aria-label="speak">\u{1F50A}</button><div class="stars">'+st+'</div></div>';
  }).join("");
}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ===== CELEBRATION =====
function celebrate(titleKey,textKey,emojiKey){
  document.getElementById("celebrateEmoji").innerText=T(emojiKey);
  document.getElementById("celebrateTitle").innerText=T(titleKey);
  document.getElementById("celebrateText").innerText=T(textKey);
  const conf=document.getElementById("confetti"); conf.innerHTML="";
  const colors=["#F59E0B","#EF4444","#10B981","#3B82F6","#A855F7","#F97316"];
  for(let i=0;i<75;i++){ const d=document.createElement("div"); d.className="dot"; d.style.left=(Math.random()*100)+"%"; d.style.top=(-30-Math.random()*220)+"px"; d.style.background=colors[Math.floor(Math.random()*colors.length)]; d.style.animationDelay=(Math.random()*0.25)+"s"; d.style.animationDuration=(1.6+Math.random()*1.1)+"s"; conf.appendChild(d); }
  document.getElementById("celebrateOverlay").classList.add("show"); beepSuccess();
}
function closeCelebrate(){ document.getElementById("celebrateOverlay").classList.remove("show"); }

// ===== MEMORY GAME =====
let memFlipped=[], memMoves=0, memMatches=0;
function initMemory(){
  const grid=document.getElementById("memoryGrid");
  grid.innerHTML="";
  memFlipped=[]; memMoves=0; memMatches=0;
  document.getElementById("moves").innerText="0";
  let cards=[];
  const pool=shuffle(items).slice(0,5);
  pool.forEach(it=>{
    cards.push({id:it.k,show:'<img src="'+it.img+'" alt="'+it.uz+'">',type:"img"});
    cards.push({id:it.k,show:(state.lang==="uz")?it.uz:it.en,type:"text"});
  });
  cards=shuffle(cards);
  cards.forEach((c,idx)=>{
    const div=document.createElement("div");
    div.className="memory-card";
    div.innerText="?";
    div.dataset.id=c.id;
    div.dataset.show=c.show;
    div.dataset.type=c.type;
    div.dataset.idx=idx;
    div.onclick=()=>{
      if(memFlipped.length<2&&!div.classList.contains("flipped")&&!div.classList.contains("matched")){
        div.classList.add("flipped");
        div.innerHTML=c.show;
        memFlipped.push({div,id:c.id});
        if(memFlipped.length===2){
          memMoves++;
          document.getElementById("moves").innerText=memMoves;
          setTimeout(()=>{
            if(memFlipped[0].id===memFlipped[1].id){
              memFlipped.forEach(f=>{f.div.classList.add("matched");f.div.style.visibility="hidden";});
              memMatches++; beepSuccess();
              if(memMatches===5){
                state.games.gMem=true; save(); updateBadges();
                celebrate("memWinTitle","memWinText","memWinEmoji");
              }
            }else{
              beepFail();
              memFlipped.forEach(f=>{f.div.classList.remove("flipped");f.div.innerText="?";});
            }
            memFlipped=[];
          },700);
        }
      }
    };
    grid.appendChild(div);
  });
}

// ===== SALAD GAME =====
let saladIdx=0, saladScore=0, saladOrder=[];
function updateSaladScore(){ document.getElementById("saladScore").innerText=T("saladScoreLabel")+" "+saladScore+T("saladOf"); }
function finishSaladGame(){ state.games.gSalad=true; save(); updateBadges(); celebrate("saladWinTitle","saladWinText","saladWinEmoji"); }

function startSaladGame(){
  saladOrder=shuffle([0,1,2,3,4]);
  saladIdx=0; saladScore=0;
  updateSaladScore();
  document.getElementById("pickedRow").innerHTML="";
  document.getElementById("saladBowl").classList.remove("filled");
  loadSaladRecipe();
}

function loadSaladRecipe(){
  if(saladIdx>=saladOrder.length){ finishSaladGame(); return; }
  const rec=recipes[saladOrder[saladIdx]];
  const recName=(state.lang==="uz")?rec.name.uz:rec.name.en;
  const neededNames=rec.needed.map(k=>{
    const it=items.find(x=>x.k===k);
    return (state.lang==="uz")?it.uz:it.en;
  }).join(" + ");
  document.getElementById("recipeBox").innerText=T("recipeLabel")+recName+"\n("+neededNames+")";
  document.getElementById("pickedRow").innerHTML="";
  document.getElementById("saladBowl").classList.remove("filled");
  renderSaladChoices(rec.needed);
}

let saladPicked=[];
function renderSaladChoices(needed){
  saladPicked=[];
  const box=document.getElementById("saladChoices");
  box.innerHTML="";
  const opts=new Set(needed);
  while(opts.size<6){ opts.add(items[Math.floor(Math.random()*items.length)].k); }
  shuffle([...opts]).forEach(optKey=>{
    const optItem=items.find(x=>x.k===optKey);
    const btn=document.createElement("button");
    btn.className="choiceBtn";
    btn.innerHTML='<img src="'+optItem.img+'" style="width:40px;height:40px;object-fit:contain;display:block;margin:0 auto;">';
    btn.onclick=()=>{
      if(saladPicked.length>=3)return;
      saladPicked.push(optKey);
      const picked=document.createElement("div");
      picked.className="picked-item";
      picked.innerHTML='<img src="'+optItem.img+'" alt="'+optItem.uz+'">';
      document.getElementById("pickedRow").appendChild(picked);
      if(saladPicked.length===3){
        const rec=recipes[saladOrder[saladIdx]];
        const isCorrect=rec.needed.every(k=>saladPicked.includes(k));
        if(isCorrect){
          beepSuccess();
          document.getElementById("saladBowl").classList.add("filled");
          document.getElementById("saladBowl").innerText="\u{1F957}";
          saladScore++; updateSaladScore();
          saladIdx++;
          setTimeout(()=>{
            if(saladIdx>=saladOrder.length) finishSaladGame();
            else loadSaladRecipe();
          },800);
        }else{
          beepFail();
          document.getElementById("saladBowl").innerText="\u274C";
          setTimeout(()=>{
            saladPicked=[];
            document.getElementById("pickedRow").innerHTML="";
            document.getElementById("saladBowl").innerText="\u{1F957}";
            document.getElementById("saladBowl").classList.remove("filled");
          },600);
        }
      }
    };
    box.appendChild(btn);
  });
}

// ===== PICK THE NAME =====
let nameOrder=[], nameIdx=0;
function updateNameProgress(){ document.getElementById("nameProgress").innerText=nameIdx+T("nameProgress"); }
function finishNameGame(){ state.games.g4=true; save(); updateBadges(); celebrate("nameWinTitle","nameWinText","nameWinEmoji"); }

function startNameGame(){
  const grid=document.getElementById("nameGrid"), task=document.getElementById("nameTask"), preview=document.getElementById("namePreview");
  if(!grid||!task||!preview)return;
  if(nameIdx===0) nameOrder=shuffle(items.map(x=>x.k));
  if(nameIdx>=nameOrder.length){ nameIdx=0; nameOrder=shuffle(items.map(x=>x.k)); }
  updateNameProgress(); grid.innerHTML=""; task.innerText=T("hintName");
  const target=items.find(x=>x.k===nameOrder[nameIdx]);
  preview.innerHTML='<img src="'+target.img+'" alt="'+target.uz+'">';
  const opts=new Set([target.k]); while(opts.size<4){ opts.add(items[Math.floor(Math.random()*items.length)].k); }
  shuffle([...opts]).forEach(optKey=>{
    const optItem=items.find(x=>x.k===optKey); const btn=document.createElement("button"); btn.className="choiceBtn"; btn.innerText=(state.lang==="uz")?optItem.uz:optItem.en;
    btn.onclick=()=>{
      if(optKey===target.k){ btn.classList.add("good"); beepSuccess(); nameIdx++; updateNameProgress(); if(nameIdx>=nameOrder.length){ grid.innerHTML=""; preview.innerHTML="\u{1F3C6}"; finishNameGame(); }else{ setTimeout(()=>{if(document.getElementById("panel-name").classList.contains("show"))startNameGame();},450); }
      }else{ btn.classList.add("bad"); beepFail(); setTimeout(()=>btn.classList.remove("bad"),300); }
    }; grid.appendChild(btn);
  });
}

(function init(){
  load();
  document.getElementById("btn-uz").classList.toggle("active",state.lang==="uz");
  document.getElementById("btn-en").classList.toggle("active",state.lang==="en");
  updateAllTexts(); renderVocab(); updateProgress();
})();
</script>
