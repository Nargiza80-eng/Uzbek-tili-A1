<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>3-dars: Hayvonlar</title> 
  <link rel="stylesheet" href="components/header.css"> 
  <style>
    :root{
      --bg:#eaf6ff;
      --bg2:#fff2cc;
      --primary:#0066ff;
      --success:#00c853;
      --danger:#ff3333;
      --sun:#ffcc00;
      --shadowSoft:#cfe3ff;
      --shadowBtn:#b8c2cc;
      --radius:25px;
    }

    *{box-sizing:border-box; touch-action:manipulation; font-style:normal; margin:0; padding:0;}
    body{
      margin:0;
      font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%, #fff 100%);
      color:#2d3436;
      padding:12px;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    .app{
      width:100%;
      max-width:520px;
      margin:0 auto;
      overflow-x:hidden;
    }

    /* Tab Navigation */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .tab-btn {
      background: #fff;
      border: 3px solid #fff;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--shadowSoft);
      transition: all 0.1s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 0 #0044aa;
    }
    .tab-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 var(--shadowSoft);
    }
    .tab-btn.active:active {
      box-shadow: 0 3px 0 #0044aa;
    }

    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    /* Vokabel-Grid */
    .learn-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }
    .learn-card{
      background:#fff;
      border-radius:var(--radius);
      padding:20px;
      display:flex;
      align-items:center;
      gap:16px;
      box-shadow:0 8px 0 var(--shadowSoft);
      border:3px solid #fff;
    }
    .learn-emoji{
      font-size:52px;
      width:70px;
      text-align:center;
      flex-shrink:0;
    }
    .learn-info{
      text-align:left;
      flex:1;
      min-width:0;
    }
    .learn-main{
      font-weight:900;
      font-size:24px;
      color:#2d3436;
      word-break:break-word;
    }
    .learn-sub{
      color:#636e72;
      font-size:16px;
      margin-top:2px;
      word-break:break-word;
    }
    .learn-pr{
      color:#888;
      font-size:13px;
      margin-top:2px;
      font-weight:700;
    }
    .stars{
      margin-top:6px;
      font-weight:900;
      color:#f39c12;
      font-size:18px;
    }
    .btn-audio{
      background:var(--sun);
      border:none;
      width:56px;
      height:56px;
      border-radius:50%;
      font-size:24px;
      cursor:pointer;
      box-shadow:0 6px 0 #cc7a00;
      flex-shrink:0;
    }
    .btn-audio:active{
      transform:translateY(3px);
      box-shadow:0 3px 0 #cc7a00;
    }

    /* Quiz-Stile */
    .quiz-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 0 var(--shadowSoft);
      border: 3px solid #fff;
    }
    .quiz-question {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .quiz-opt-btn {
      background: #f0f7ff;
      border: 3px solid var(--shadowSoft);
      border-radius: var(--radius);
      padding: 20px 10px;
      font-size: 40px; /* Grosser Emoji-Fokus für Kinder */
      cursor: pointer;
      box-shadow: 0 6px 0 var(--shadowSoft);
    }
    .quiz-opt-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 var(--shadowSoft);
    }
    .quiz-opt-btn.correct {
      background: var(--success) !important;
      border-color: var(--success);
      color: white;
    }
    .quiz-opt-btn.wrong {
      background: var(--danger) !important;
      border-color: var(--danger);
      color: white;
    }
    .quiz-audio-repeat {
      background: var(--sun);
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 6px 0 #cc7a00;
      margin-bottom: 12px;
    }
    .quiz-audio-repeat:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #cc7a00;
    }

    @media(max-width:375px){
      .learn-emoji{font-size:44px; width:60px;}
      .learn-main{font-size:20px;}
      .learn-sub{font-size:14px;}
      .btn-audio{width:48px; height:48px; font-size:20px;}
      .quiz-opt-btn { font-size: 32px; padding: 15px 5px; }
    }
  </style>
<base target="_blank">
</head>

<body>

  <div id="lessonHeader"></div>
  
  <div class="app">
    <!-- Tab Umschalter -->
    <div class="tabs">
      <button class="tab-btn active" id="tabLearn" onclick="switchView('learn')">📖 O'rganish / Learn</button>
      <button class="tab-btn" id="tabQuiz" onclick="switchView('quiz')">🎯 O'yin / Game</button>
    </div>

    <!-- Sektion 1: Vokabeltrainer -->
    <div id="sectionLearn" class="view-section active">
      <div class="learn-grid" id="vocabGrid"></div>
    </div>

    <!-- Sektion 2: Quiz Spiel -->
    <div id="sectionQuiz" class="view-section">
      <div class="quiz-card">
        <div class="quiz-question" id="quizQuestion">Eshiting va toping!</div>
        <button class="quiz-audio-repeat" onclick="playQuizAudio()">🔊 Qayta eshitish</button>
        <div class="quiz-options" id="quizOptions"></div>
      </div>
    </div>
  </div>

<script src="components/header.js" defer></script>
<script>
  const LESSON_ID = "lesson3_hayvonlar_v1";

  const data = [
    {key:"cat",    emoji:"🐱", uz:"Mushuk", en:"Cat",    pr:"mu-SHUK"},
    {key:"dog",    emoji:"🐶", uz:"It",     en:"Dog",    pr:"it"},
    {key:"bird",   emoji:"🐦", uz:"Qush",   en:"Bird",   pr:"qush"},
    {key:"fish",   emoji:"🐟", uz:"Baliq",  en:"Fish",   pr:"ba-LIQ"},
    {key:"horse",  emoji:"🐴", uz:"Ot",     en:"Horse",  pr:"ot"},
    {key:"cow",    emoji:"🐮", uz:"Sigir",  en:"Cow",    pr:"si-GIR"},
    {key:"rabbit", emoji:"🐰", uz:"Quyon",  en:"Rabbit", pr:"qu-YON"},
    {key:"lion",   emoji:"🦁", uz:"Sher",   en:"Lion",   pr:"sher"},
  ];

  const UI = {
    uz: { title: "3-dars: Hayvonlar", quizQuestion: "Rasmini toping:" },
    en: { title: "Lesson 3: Animals", quizQuestion: "Find the animal:" }
  };

  let state = {
    lang: "uz",
    stars: {},
    learned: {}
  };

  let currentQuizItem = null;

  function save(){ localStorage.setItem(LESSON_ID, JSON.stringify(state)); }
  function load(){
    const raw = localStorage.getItem(LESSON_ID);
    if(!raw) return;
    try{
      const s = JSON.parse(raw);
      state.lang = s.lang || "uz";
      state.stars = s.stars || {};
      state.learned = s.learned || {};
    }catch(e){}
  }

  function learnedCount(){
    return Object.values(state.learned).filter(Boolean).length;
  }

  function getWord(item) {
    return state.lang === "uz" ? item.uz : item.en;
  }

  function getSubWord(item) {
    return state.lang === "uz" ? item.en : item.uz;
  }

  function audioPath(key){
    return state.lang === "en" ? "en/" + key + ".mp3" : "a/" + key + ".mp3";
  }

  function initHeader(){
    const title = state.lang === "uz" ? UI.uz.title : UI.en.title;
    if (typeof renderLessonHeader === "function") {
      renderLessonHeader({
        mountId: "lessonHeader",
        title: title,
        total: data.length,
        learned: learnedCount(),
        lang: state.lang,
        homeHref: "index.html",
        bookTargetId: null,
        onLangChange: (l) => setLang(l)
      });
    }
  }

  function refreshHeader(){
    if (typeof setHeaderProgress === "function") {
      setHeaderProgress({ learned: learnedCount(), total: data.length });
    }
  }

  function setLang(l){
    state.lang = l;
    save();
    initHeader();
    renderVocab();
    if(document.getElementById("sectionQuiz").classList.contains("active")) {
      initQuiz();
    }
  }

  function starsText(n){
    n = Math.max(0, Math.min(3, n||0));
    return "★".repeat(n) + "☆".repeat(3-n);
  }

  let currentAudio = null;
  function stopAudio(){
    try{
      if(currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; }
    }catch(e){}
    currentAudio = null;
  }

  function playAudio(key){
    stopAudio();
    const a = new Audio(audioPath(key));
    currentAudio = a;
    a.play().catch(()=>{});
    return a;
  }

  function speakWord(key){
    const item = data.find(x=>x.key===key);
    if(!item) return;

    playAudio(key);

    state.learned[key] = true;
    state.stars[key] = Math.min(3, (state.stars[key]||0) + 1);
    save();

    renderVocab();
    refreshHeader();
  }

  function renderVocab(){
    const grid = document.getElementById("vocabGrid");
    grid.innerHTML = data.map(item => {
      const main = getWord(item);
      const sub = getSubWord(item);
      const st = starsText(state.stars[item.key]||0);

      return `
        <div class="learn-card">
          <div class="learn-emoji">${item.emoji}</div>
          <div class="learn-info">
            <div class="learn-main">${main}</div>
            <div class="learn-sub">${sub}</div>
            <div class="learn-pr">${item.pr}</div>
            <div class="stars">${st}</div>
          </div>
          <button class="btn-audio" onclick="speakWord('${item.key}')">🔊</button>
        </div>
      `;
    }).join("");
  }

  /* View Switcher Logic */
  function switchView(view) {
    stopAudio();
    document.getElementById("tabLearn").classList.toggle("active", view === "learn");
