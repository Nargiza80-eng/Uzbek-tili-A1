<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>3-dars: Hayvonlar</title>

<style>
  /* ===== HEADER (animiert - INLINE) ===== */
  .dono-header {
    width: 100%;
    max-width: 520px;
    margin: 0 auto 12px;
    border-radius: 28px;
    background: #ffffff;
    box-shadow: 0 14px 0 rgba(0,0,0,0.08);
    border: 4px solid #fff;
    overflow: hidden;
    position: relative;
  }
  .dono-header .content {
    position: relative;
    z-index: 2;
    padding: 14px;
  }
  .dono-header .top-row {
    display: grid;
    grid-template-columns: 88px 1fr 88px;
    align-items: center;
    gap: 10px;
  }
  .dono-header .topIcon {
    width: 82px;
    height: 82px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 62px;
    line-height: 1;
    user-select: none;
    text-decoration: none;
  }
  .dono-header .topIcon:active { transform: translateY(2px) scale(0.98); }
  .dono-header .titleWrap {
    min-width: 0;
    text-align: center;
  }
  .dono-header .title {
    margin: 0;
    font-size: 34px;
    font-weight: 1000;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #1f2937;
  }
  .dono-header .sub {
    margin-top: 6px;
    font-size: 18px;
    font-weight: 1000;
    color: rgba(31,41,55,0.65);
  }
  .dono-header .progress-track {
    height: 18px;
    background: rgba(255,255,255,0.65);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 4px 0;
    box-shadow: inset 0 2px 0 rgba(0,0,0,0.06);
    border: 2px solid rgba(255,255,255,0.7);
  }
  .dono-header .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #22c55e, #34d399);
    transition: width 0.45s ease;
  }
  .dono-header .mini {
    text-align: center;
    margin-top: 10px;
    font-size: 20px;
    font-weight: 1000;
    color: #111827;
  }
  .dono-header .langRow {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
  }
  .dono-header .langBtn {
    width: 118px;
    padding: 10px 0;
    font-size: 16px;
    font-weight: 1000;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: rgba(255,255,255,0.70);
    color: #1e4ed8;
    box-shadow: 0 10px 20px rgba(0,0,0,0.10);
  }
  .dono-header .langBtn.active {
    background: #2f6bff;
    color: #fff;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.10);
  }
  .dono-header .sky {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 12%, rgba(255, 214, 102, 0.78) 0%, rgba(255, 214, 102, 0.0) 58%),
      linear-gradient(180deg, #7DD3FC 0%, #A5F3FC 45%, #FFF6E8 100%);
  }
  .dono-header .sun {
    position: absolute;
    left: -30px;
    top: -35px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FFF7C2 0%, #FFD400 45%, #FFB300 100%);
    box-shadow: 0 18px 35px rgba(255,179,0,0.35);
    animation: sunBob 4s ease-in-out infinite;
  }
  @keyframes sunBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(6px) rotate(1.5deg); }
  }
  .dono-header .sun::before {
    content: "";
    position: absolute;
    inset: -58px;
    border-radius: 50%;
    background: repeating-conic-gradient(from -10deg, rgba(255,214,0,0.0) 0deg 10deg, rgba(255,214,0,0.32) 10deg 14deg);
    opacity: 0.65;
    animation: raysSpin 18s linear infinite;
  }
  @keyframes raysSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .dono-header .cloud {
    position: absolute;
    width: 170px;
    height: 58px;
    background: rgba(255,255,255,0.90);
    border-radius: 999px;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.08));
  }
  .dono-header .cloud::before,
  .dono-header .cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.90);
    border-radius: 50%;
  }
  .dono-header .cloud::before {
    width: 74px; height: 74px;
    left: 18px; top: -30px;
  }
  .dono-header .cloud::after {
    width: 96px; height: 96px;
    left: 62px; top: -44px;
  }
  .dono-header .c1 { top: 22px; left: 120px; opacity: 0.95; animation: cloudMove1 70s linear infinite; }
  .dono-header .c2 { top: 78px; left:  20px; opacity: 0.85; transform: scale(0.9);  animation: cloudMove2 95s linear infinite; }
  .dono-header .c3 { top: 45px; left: 420px; opacity: 0.80; transform: scale(1.05); animation: cloudMove3 120s linear infinite; }
  @keyframes cloudMove1 { from { transform: translateX(-320px); } to { transform: translateX(1400px); } }
  @keyframes cloudMove2 { from { transform: translateX(1200px) scale(0.9); } to { transform: translateX(-340px) scale(0.9); } }
  @keyframes cloudMove3 { from { transform: translateX(-640px) scale(1.05); } to { transform: translateX(1000px) scale(1.05); } }
  .dono-header .sparkle {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.25);
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .dono-header .s1 { top: 26px; right: 120px; animation-delay: 0.2s; }
  .dono-header .s2 { top: 60px; right:  70px; animation-delay: 1.1s; }
  .dono-header .s3 { top: 34px; right: 180px; animation-delay: 1.9s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(0.85); opacity: 0.6; }
    50%     { transform: scale(1.15); opacity: 1; }
  }
  @media (max-width: 560px) {
    .dono-header { max-width: 520px; border-radius: 26px; }
    .dono-header .title { font-size: 30px; }
    .dono-header .topIcon { width: 74px; height: 74px; font-size: 58px; }
    .dono-header .top-row { grid-template-columns: 78px 1fr 78px; }
    .dono-header .langBtn { width: 108px; padding: 9px 0; font-size: 15px; }
  }

  :root {
    --bg: #eaf6ff;
    --primary: #0066ff;
    --success: #00c853;
    --error: #ff2d55;
    --sun: #ffcc00;
    --radius: 25px;
    --bg2: #fff2cc;
    --shadowSoft: #cfe3ff;
    --shadowBtn: #b8c2cc;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Nunito', 'Quicksand', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%, #ffffff 100%);
    color: #2d3436;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  * {
    font-style: normal !important;
    box-sizing: border-box;
    touch-action: manipulation;
  }

  h1, h2, h3, h4, h5, h6 {
    font-weight: 800;
    margin: 0;
  }

  .app {
    width: 100%;
    max-width: 520px;
    overflow-x: hidden;
  }

  .mode-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 520px;
    flex-wrap: wrap;
  }
  .mode-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 18px;
    border: none;
    background: white;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--shadowBtn);
    font-size: clamp(13px, 4vw, 18px);
    min-width: 140px;
    white-space: normal;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 60px;
  }
  .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 0 #0047b3; }

  .mode-ico{ font-size: 28px; line-height: 1; }

  #learnSection, #quizSection, #memorySection, #saladSection, #bubbleSection {
    display: none; width: 100%; max-width: 520px; text-align: center;
  }
  #learnSection { display: grid; }

  .learn-grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; max-width: 520px; }
  .learn-card {
    background: white; border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 8px 0 var(--shadowSoft); border: 3px solid white;
  }
  .learn-emoji { font-size: 52px; width: 70px; text-align:center; flex-shrink:0; }
  .learn-info { text-align: left; flex: 1; }
  .learn-main { font-weight:800; font-size:22px; }
  .learn-sub { color:#636e72; font-size:14px; margin-top:2px; }
  .learn-pr { color:#888; font-size:13px; margin-top:2px; font-weight:700; }
  .stars { margin-top: 6px; font-weight: 800; color: #f39c12; font-size: 18px; }

  .btn-audio {
    background: var(--sun); border: none; width: 56px; height: 56px;
    border-radius: 50%; font-size: 24px; cursor: pointer;
    box-shadow: 0 6px 0 #cc7a00; flex-shrink:0;
  }
  .btn-audio:active { transform: translateY(3px); box-shadow: 0 3px 0 #cc7a00; }

  .quiz-card { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 10px 0 var(--shadowSoft); }
  .quiz-emoji { font-size: 80px; margin-top: 0; }
  .option-btn {
    width: 100%; padding: 14px; margin: 8px 0; border-radius: 20px;
    border: 3px solid #f1f2f6; background: white; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 5px 0 #f1f2f6;
  }
  .option-btn:active { transform: translateY(2px); box-shadow: none; }

  .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .memory-card {
    height: 90px; background: var(--primary); border-radius: 18px;
    display: flex; justify-content: center; align-items: center;
    font-size: 26px; color: white; cursor: pointer;
    box-shadow: 0 6px 0 #0047b3;
    user-select:none; padding:8px; text-align:center;
  }
  .memory-card.flipped { background: white; color: #2d3436; box-shadow: 0 6px 0 var(--shadowBtn); }
  .memory-card.matched { visibility: hidden; }

  .salad-card {
    background: white; border-radius: var(--radius); padding: 20px;
    box-shadow: 0 8px 0 var(--shadowSoft); text-align: center;
  }
  .salad-target {
    font-size: 32px; font-weight: 800; min-height: 50px; margin: 10px 0;
    letter-spacing: 4px; color: var(--primary);
  }
  .salad-letters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; }
  .salad-letter {
    width: 50px; height: 50px; background: var(--sun); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; cursor: pointer;
    box-shadow: 0 5px 0 #cc7a00; user-select: none;
  }
  .salad-letter:active { transform: translateY(3px); box-shadow: 0 2px 0 #cc7a00; }
  .salad-letter.used { opacity: 0.3; pointer-events: none; }

  .bubble-area {
    position: relative; width: 100%; height: 400px;
    background: linear-gradient(180deg, #a8d8f0 0%, #d4f0ff 100%);
    border-radius: var(--radius); overflow: hidden; border: 3px solid white;
  }
  .bubble {
    position: absolute; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: white; user-select: none;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1);
  }
  .bubble.pop { animation: popAnim 0.3s ease forwards; }
  @keyframes popAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(0); opacity: 0; }
  }
  .bubble-game-over {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.9); font-size: 24px; font-weight: 800;
  }

  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.active { display: flex; }
  .overlay-box {
    background: white; border-radius: 30px; padding: 24px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 20px 0 rgba(0,0,0,0.15);
  }
  .overlay-box h2 { font-size: 26px; margin-bottom: 12px; }
  .overlay-box p { font-size: 18px; margin: 8px 0; }
  .overlay-close {
    margin-top: 16px; padding: 12px 32px; border-radius: 16px;
    border: none; background: var(--primary); color: white;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 0 #0047b3;
  }
  .overlay-close:active { transform: translateY(3px); box-shadow: 0 3px 0 #0047b3; }

  .album-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
  .album-card {
    background: white; border-radius: 20px; padding: 14px;
    text-align: center; box-shadow: 0 6px 0 var(--shadowSoft);
  }
  .album-card .a-emoji { font-size: 48px; }
  .album-card .a-name { font-weight: 800; font-size: 16px; margin-top: 6px; }

  .action-btn {
    width: 100%; padding: 14px; margin-top: 14px; border-radius: 18px;
    border: none; background: var(--success); color: white;
    font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 6px 0 #009624;
  }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #009624; }

  .section-title { font-size: 22px; font-weight: 800; margin: 16px 0 10px; }

  .result-box { font-size: 18px; font-weight: 700; margin: 12px 0; min-height: 28px; }
  .result-box.correct { color: var(--success); }
  .result-box.wrong { color: var(--error); }

  @media (max-width: 560px) {
    body { padding: 10px; }
    .mode-btn { min-width: 100px; font-size: 13px; padding: 10px 6px; }
    .mode-ico { font-size: 24px; }
    .quiz-emoji { font-size: 64px; }
    .learn-emoji { font-size: 44px; width: 60px; }
    .learn-main { font-size: 20px; }
    .memory-grid { gap: 8px; }
    .memory-card { height: 80px; font-size: 22px; }
    .bubble-area { height: 320px; }
  }
</style>

    </div>

<script>
(function(){
  const DEFAULTS = {
    mountId: "lessonHeader",
    title: "Dars",
    total: 8,
    learned: 0,
    homeHref: "index.html",
    bookTargetId: "albumOverlay",
    lang: "uz",
    onLangChange: null,
  };
  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function scrollToId(id){
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
  }
  function buildHeaderHTML(opts){
    const learned = clamp(Number(opts.learned || 0), 0, opts.total);
    const pct = opts.total ? (learned / opts.total) * 100 : 0;
    return `
      <div class="dono-header" data-total="${opts.total}">
        <div class="sky">
          <div class="sun"></div>
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="cloud c3"></div>
          <div class="sparkle s1"></div>
          <div class="sparkle s2"></div>
          <div class="sparkle s3"></div>
        </div>
        <div class="content">
          <div class="top-row">
            <button class="topIcon" id="hdrHomeBtn" aria-label="Home" type="button">&#127968;</button>
            <div class="titleWrap">
              <h1 class="title" id="hdrTitle">${opts.title}</h1>
              <div class="sub" id="hdrSub">${opts.subtitle || "3-dars"}</div>
            </div>
            <button class="topIcon" id="hdrBookBtn" aria-label="Book" type="button">&#128214;</button>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="hdrFill" style="width:${pct}%"></div>
          </div>
          <div class="mini" id="hdrMini">${learned} / ${opts.total}</div>
          <div class="langRow">
            <button class="langBtn ${opts.lang === "uz" ? "active" : ""}" id="hdrUZ" type="button">UZ</button>
            <button class="langBtn ${opts.lang === "en" ? "active" : ""}" id="hdrEN" type="button">EN</button>
          </div>
        </div>
      </div>
    `;
  }
  function attachHeaderEvents(root, opts){
    const homeBtn = root.querySelector("#hdrHomeBtn");
    const bookBtn = root.querySelector("#hdrBookBtn");
    const uzBtn = root.querySelector("#hdrUZ");
    const enBtn = root.querySelector("#hdrEN");
    if(homeBtn){
      homeBtn.addEventListener("click", () => {
        if(opts.homeHref) window.location.href = opts.homeHref;
      });
    }
    if(bookBtn){
      bookBtn.addEventListener("click", () => {
        if(opts.bookTargetId) scrollToId(opts.bookTargetId);
      });
    }
    const setLangUI = (lang) => {
      uzBtn?.classList.toggle("active", lang === "uz");
      enBtn?.classList.toggle("active", lang === "en");
    };
    uzBtn?.addEventListener("click", () => {
      setLangUI("uz");
      if(typeof opts.onLangChange === "function") opts.onLangChange("uz");
    });
    enBtn?.addEventListener("click", () => {
      setLangUI("en");
      if(typeof opts.onLangChange === "function") opts.onLangChange("en");
    });
  }
  window.renderLessonHeader = function(options){
    const opts = {...DEFAULTS, ...(options || {})};
    const mount = document.getElementById(opts.mountId);
    if(!mount){ console.warn("renderLessonHeader(): mount element not found:", opts.mountId); return; }
    mount.innerHTML = buildHeaderHTML(opts);
    attachHeaderEvents(mount, opts);
  };
  window.setHeaderProgress = function({ learned, total } = {}){
    const header = document.querySelector(".dono-header");
    if(!header) return;
    const t = total ?? Number(header.getAttribute("data-total") || 8);
    const l = clamp(Number(learned ?? 0), 0, t);
    const pct = t ? (l / t) * 100 : 0;
    const mini = header.querySelector("#hdrMini");
    const fill = header.querySelector("#hdrFill");
    if(mini) mini.textContent = `${l} / ${t}`;
    if(fill) fill.style.width = pct + "%";
  };
})();
</script>

<script>
  // ================= DATA =================
  const data = [
    { key: "cat",    emoji: "&#128008;", uz: "Mushuk", en: "cat",    pr: "/k\u00e6t/" },
    { key: "dog",    emoji: "&#128021;", uz: "It",     en: "dog",    pr: "/d\u0254\u02d0g/" },
    { key: "bird",   emoji: "&#128038;", uz: "Qush",   en: "bird",   pr: "/b\u025c\u02d0rd/" },
    { key: "fish",   emoji: "&#128031;", uz: "Baliq",  en: "fish",   pr: "/f\u026a\u0283/" },
    { key: "horse",  emoji: "&#128014;", uz: "Ot",     en: "horse",  pr: "/h\u0254\u02d0rs/" },
    { key: "cow",    emoji: "&#128046;", uz: "Sigir",  en: "cow",    pr: "/ka\u028a/" },
    { key: "rabbit", emoji: "&#128007;", uz: "Quyon",  en: "rabbit", pr: "/\u02c8r\u00e6b\u026at/" },
    { key: "lion",   emoji: "&#129409;", uz: "Sher",   en: "lion",   pr: "/\u02c8la\u026a\u0259n/" },
  ];

  // Audio maps for audiolesson3/ folder structure
  const EN_AUDIO_MAP = {
    "cat": "cat", "dog": "dog", "bird": "bird", "fish": "fish",
    "horse": "horse", "cow": "cow", "rabbit": "rabbit", "lion": "lion"
  };
  const UZ_AUDIO_MAP = {
    "Mushuk": "mushuk", "It": "it", "Qush": "qush", "Baliq": "baliq",
    "Ot": "ot", "Sigir": "sigir", "Quyon": "quyon", "Sher": "sher"
  };

  function audioPath(key){
    const item = data.find(x => x.key === key);
    if(!item) return "";
    const map = (currentLang === "en") ? EN_AUDIO_MAP : UZ_AUDIO_MAP;
    const word = (currentLang === "en") ? item.en : item.uz;
    const folder = (currentLang === "en") ? "en" : "uz";
    const fileName = map[word] || word.toLowerCase();
    return `audiolesson3/${folder}/${fileName}.mp3`;
  }

  // ================= STATE =================
  let currentLang = localStorage.getItem('lang') || 'uz';
  let mode = 'learn';
  let quizIndex = 0, quizScore = 0, quizWrong = 0;
  let memCards = [], memFlipped = [], memMatched = 0, memLocked = false;
  let saladIndex = 0, saladCurrent = "";
  let bubbleActive = false, bubbleScore = 0, bubbleTotal = 0, bubbleTimer = null;

  // Track learned words (per session)
  const learnedSet = new Set(JSON.parse(localStorage.getItem('l3_learned') || '[]'));
  function saveLearned() { localStorage.setItem('l3_learned', JSON.stringify([...learnedSet])); }
  function quizDoneCount() { return learnedSet.size; }

  // ================= UI TEXT =================
  const UI = {
    uz: {
      title: "Hayvonlar",
      learn: "O'rganish", quiz: "Test", memory: "Xotira", salad: "So'z tuzing", bubble: "Pufak",
      quizQ: "Bu qaysi hayvon?", quizNext: "Keyingi", quizCorrect: "To'g'ri!",
      quizWrong: "Noto'g'ri! To'g'ri javob:", memTitle: "Xotira o'yini",
      memRestart: "Qayta boshlash", memWin: "Ajoyib! Siz yutdingiz!",
      saladTitle: "So'z tuzing", saladNext: "Keyingi",
      saladCorrect: "Ajoyib!", saladWrong: "Qayta urinib ko'ring!",
      bubbleTitle: "Pufakni bos!", bubbleStart: "Boshlash",
      bubbleOver: "O'yin tugadi!", bubbleScore: "Ball:",
      albumTitle: "Mening albomim", albumClose: "Yopish",
      learnTab: "O'rganish", quizTab: "Test", memTab: "Xotira",
      saladTab: "So'z tuzing", bubbleTab: "Pufak"
    },
    en: {
      title: "Animals",
      learn: "Learn", quiz: "Quiz", memory: "Memory", salad: "Letter Salad", bubble: "Bubbles",
      quizQ: "Which animal is this?", quizNext: "Next", quizCorrect: "Correct!",
      quizWrong: "Wrong! Correct answer:", memTitle: "Memory Game",
      memRestart: "Restart", memWin: "Great! You won!",
      saladTitle: "Letter Salad", saladNext: "Next",
      saladCorrect: "Great!", saladWrong: "Try again!",
      bubbleTitle: "Pop the Bubbles!", bubbleStart: "Start",
      bubbleOver: "Game Over!", bubbleScore: "Score:",
      albumTitle: "My Album", albumClose: "Close",
      learnTab: "Learn", quizTab: "Quiz", memTab: "Memory",
      saladTab: "Letter Salad", bubbleTab: "Bubbles"
    }
  };

  // ================= HELPERS =================
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function pick(arr, n){ const s=shuffle([...arr]); return s.slice(0,n); }
  function speak(key){ const path=audioPath(key); if(!path) return; const a=new Audio(path); a.play().catch(()=>{}); }

  // ================= HEADER =================
  function initHeader() {
    renderLessonHeader({
      mountId: "lessonHeader",
      title: currentLang === 'uz' ? 'Hayvonlar' : 'Animals',
      subtitle: currentLang === 'uz' ? '3-dars' : 'Lesson 3',
      total: data.length,
      learned: quizDoneCount(),
      homeHref: "index.html",
      lang: currentLang,
      onLangChange: (lang) => setLang(lang),
      bookTargetId: "albumOverlay"
    });
  }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    const T = UI[lang];
    document.getElementById('lblLearn').innerText = T.learnTab;
    document.getElementById('lblQuiz').innerText = T.quizTab;
    document.getElementById('lblMemory').innerText = T.memTab;
    document.getElementById('lblSalad').innerText = T.saladTab;
    document.getElementById('lblBubble').innerText = T.bubbleTab;
    document.getElementById('quizQuestion').innerText = T.quizQ;
    document.getElementById('quizNext').innerText = T.quizNext;
    document.getElementById('memTitle').innerText = T.memTitle;
    document.getElementById('memRestart').innerText = T.memRestart;
    document.getElementById('saladTitle').innerText = T.saladTitle;
    document.getElementById('saladNext').innerText = T.saladNext;
    document.getElementById('bubbleTitle').innerText = T.bubbleTitle;
    document.getElementById('bubbleStart').innerText = T.bubbleStart;
    document.getElementById('albumTitle').innerText = T.albumTitle;
    document.getElementById('albumClose').innerText = T.albumClose;

    const hdrTitle = document.getElementById('hdrTitle');
    if (hdrTitle) hdrTitle.innerText = currentLang === 'uz' ? 'Hayvonlar' : 'Animals';
    const hdrSub = document.getElementById('hdrSub');
    if (hdrSub) hdrSub.innerText = currentLang === 'uz' ? '3-dars' : 'Lesson 3';

    if(mode==='learn') renderLearn();
    if(mode==='quiz') renderQuiz();
    if(mode==='salad') renderSalad();
    if(mode==='bubble') renderBubble();
    // Memory cards keep current language display
    if(mode==='memory') renderMemory();
  }

  // ================= MODE SWITCH =================
  function switchMode(m){
    mode=m;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
    document.getElementById('learnSection').style.display = m==='learn'?'grid':'none';
    document.getElementById('quizSection').style.display = m==='quiz'?'block':'none';
    document.getElementById('memorySection').style.display = m==='memory'?'block':'none';
    document.getElementById('saladSection').style.display = m==='salad'?'block':'none';
    document.getElementById('bubbleSection').style.display = m==='bubble'?'block':'none';
    if(m==='learn') renderLearn();
    if(m==='quiz') renderQuiz();
    if(m==='memory') renderMemory();
    if(m==='salad') renderSalad();
    if(m==='bubble') renderBubble();
  }

  document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));

  // ================= LEARN =================
  function renderLearn(){
    const g=document.getElementById('learnGrid');
    g.innerHTML=data.map(d=>{
      const word=currentLang==='en'?d.en:d.uz;
      const sub=currentLang==='en'?d.uz:d.en;
      const learned=learnedSet.has(d.key);
      return `<div class="learn-card">
        <div class="learn-emoji">${d.emoji}</div>
        <div class="learn-info">
          <div class="learn-main">${word}</div>
          <div class="learn-sub">${sub}</div>
          <div class="learn-pr">${d.pr}</div>
          <div class="stars">${learned?'&#11088;&#11088;&#11088;':'&#9734;&#9734;&#9734;'}</div>
        </div>
        <button class="btn-audio" onclick="speak('${d.key}')">&#128264;</button>
      </div>`;
    }).join('');
  }

  // ================= QUIZ =================
  function renderQuiz(){
    const T=UI[currentLang];
    const item=data[quizIndex];
    const word=currentLang==='en'?item.en:item.uz;
    document.getElementById('quizEmoji').innerHTML=item.emoji;
    document.getElementById('quizQuestion').innerText=T.quizQ;
    const opts=shuffle([item,...pick(data.filter(x=>x.key!==item.key),3)]);
    document.getElementById('quizOptions').innerHTML=opts.map(o=>{
      const lbl=currentLang==='en'?o.en:o.uz;
      return `<button class="option-btn" data-key="${o.key}">${lbl}</button>`;
    }).join('');
    document.getElementById('quizResult').innerText='';
    document.getElementById('quizResult').className='result-box';
    document.getElementById('quizNext').style.display='none';
    document.querySelectorAll('#quizOptions .option-btn').forEach(b=>{
      b.addEventListener('click',()=>checkQuiz(b,item.key));
    });
  }
  function checkQuiz(btn,correctKey){
    const T=UI[currentLang];
    const k=btn.dataset.key;
    const res=document.getElementById('quizResult');
    if(k===correctKey){
      btn.style.borderColor='var(--success)';
      btn.style.background='#e8f5e9';
      res.innerText=T.quizCorrect;
      res.className='result-box correct';
      quizScore++;
      learnedSet.add(correctKey);
      saveLearned();
      setHeaderProgress({learned:quizDoneCount(),total:data.length});
      speak(correctKey);
    }else{
      btn.style.borderColor='var(--error)';
      btn.style.background='#ffebee';
      const correctItem=data.find(x=>x.key===correctKey);
      const correctWord=currentLang==='en'?correctItem.en:correctItem.uz;
      res.innerText=T.quizWrong+' '+correctWord;
      res.className='result-box wrong';
      quizWrong++;
    }
    document.querySelectorAll('#quizOptions .option-btn').forEach(b=>b.disabled=true);
    document.getElementById('quizNext').style.display='inline-block';
  }
  document.getElementById('quizNext').addEventListener('click',()=>{
    quizIndex=(quizIndex+1)%data.length;
    renderQuiz();
  });

  // ================= MEMORY =================
  function renderMemory(){
    const T=UI[currentLang];
    document.getElementById('memTitle').innerText=T.memTitle;
    const cards=[...data,...data];
    const shuffled=shuffle(cards.map((d,i)=>({...d,id:i})));
    memCards=shuffled;
    memFlipped=[]; memMatched=0; memLocked=false;
    const g=document.getElementById('memoryGrid');
    g.innerHTML=shuffled.map((c,i)=>`<div class="memory-card" data-i="${i}" data-key="${c.key}">?</div>`).join('');
    document.getElementById('memResult').innerText='';
    g.querySelectorAll('.memory-card').forEach(c=>c.addEventListener('click',()=>flipCard(c)));
  }
  function flipCard(card){
    if(memLocked||card.classList.contains('flipped')||card.classList.contains('matched')) return;
    const i=Number(card.dataset.i);
    const c=memCards[i];
    const word=currentLang==='en'?c.en:c.uz;
    card.innerHTML=`${c.emoji}<br><small>${word}</small>`;
    card.classList.add('flipped');
    memFlipped.push(card);
    if(memFlipped.length===2) checkMatch();
  }
  function checkMatch(){
    memLocked=true;
    const [a,b]=memFlipped;
    if(a.dataset.key===b.dataset.key){
      setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');memMatched++;memFlipped=[];memLocked=false;
        if(memMatched===data.length){
          document.getElementById('memResult').innerText=UI[currentLang].memWin;
          document.getElementById('memResult').className='result-box correct';
        }
      },500);
    }else{
      setTimeout(()=>{
        a.innerText='?';a.classList.remove('flipped');
        b.innerText='?';b.classList.remove('flipped');
        memFlipped=[];memLocked=false;
      },800);
    }
  }
  document.getElementById('memRestart').addEventListener('click',renderMemory);

  // ================= SALAD =================
  function renderSalad(){
    const T=UI[currentLang];
    document.getElementById('saladTitle').innerText=T.saladTitle;
    const item=data[saladIndex];
    const word=currentLang==='en'?item.en:item.uz;
    saladCurrent=word;
    document.getElementById('saladTarget').innerText='_'.repeat(word.length);
    const letters=shuffle(word.split(''));
    const extras=shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.split('')).slice(0,4);
    const pool=shuffle([...letters,...extras]);
    document.getElementById('saladLetters').innerHTML=pool.map((l,i)=>
      `<div class="salad-letter" data-l="${l}" data-i="${i}" onclick="clickSalad(this)">${l}</div>`
    ).join('');
    document.getElementById('saladResult').innerText='';
    document.getElementById('saladResult').className='result-box';
    document.getElementById('saladNext').style.display='none';
    saladBuild='';
  }
  let saladBuild='';
  function clickSalad(el){
    if(el.classList.contains('used')) return;
    const T=UI[currentLang];
    saladBuild+=el.dataset.l;
    el.classList.add('used');
    const target=document.getElementById('saladTarget');
    target.innerText=saladCurrent.split('').map((c,i)=>saladBuild[i]||'_').join('');
    if(saladBuild===saladCurrent){
      document.getElementById('saladResult').innerText=T.saladCorrect;
      document.getElementById('saladResult').className='result-box correct';
      document.getElementById('saladNext').style.display='inline-block';
      learnedSet.add(data[saladIndex].key);
      saveLearned();
      setHeaderProgress({learned:quizDoneCount(),total:data.length});
    }else if(saladBuild.length>=saladCurrent.length){
      document.getElementById('saladResult').innerText=T.saladWrong;
      document.getElementById('saladResult').className='result-box wrong';
      saladBuild='';
      document.querySelectorAll('.salad-letter').forEach(l=>l.classList.remove('used'));
      document.getElementById('saladTarget').innerText='_'.repeat(saladCurrent.length);
    }
  }
  document.getElementById('saladNext').addEventListener('click',()=>{
    saladIndex=(saladIndex+1)%data.length;
    renderSalad();
  });

  // ================= BUBBLE =================
  function renderBubble(){
    const T=UI[currentLang];
    document.getElementById('bubbleTitle').innerText=T.bubbleTitle;
    document.getElementById('bubbleStart').innerText=T.bubbleStart;
    document.getElementById('bubbleResult').innerText='';
  }
  function startBubble(){
    if(bubbleActive) return;
    bubbleActive=true; bubbleScore=0; bubbleTotal=0;
    const area=document.getElementById('bubbleArea');
    area.innerHTML='';
    document.getElementById('bubbleResult').innerText='';
    spawnBubble();
    bubbleTimer=setInterval(spawnBubble,1800);
    setTimeout(endBubble,30000);
  }
  function spawnBubble(){
    if(!bubbleActive) return;
    const area=document.getElementById('bubbleArea');
    const item=data[Math.floor(Math.random()*data.length)];
    const word=currentLang==='en'?item.en:item.uz;
    const size=Math.max(60,word.length*14+20);
    const b=document.createElement('div');
    b.className='bubble';
    b.innerText=word;
    b.style.width=size+'px';b.style.height=size+'px';
    b.style.left=Math.random()*(area.clientWidth-size)+'px';
    b.style.bottom='-'+size+'px';
    b.style.fontSize=Math.max(14,size/3)+'px';
    const hue=Math.floor(Math.random()*360);
    b.style.background=`hsl(${hue} 80% 55%)`;
    b.dataset.key=item.key;
    area.appendChild(b);
    let y=-size; let speed=1.2+Math.random()*1.5;
    const anim=setInterval(()=>{
      if(!bubbleActive){clearInterval(anim);return;}
      y+=speed;
      b.style.bottom=y+'px';
      if(y>area.clientHeight){clearInterval(anim);b.remove();}
    },20);
    b.addEventListener('click',()=>{
      if(b.classList.contains('pop')) return;
      b.classList.add('pop');
      bubbleScore++;
      bubbleTotal++;
      learnedSet.add(b.dataset.key);
      saveLearned();
      setHeaderProgress({learned:quizDoneCount(),total:data.length});
      clearInterval(anim);
      setTimeout(()=>b.remove(),300);
    });
  }
  function endBubble(){
    bubbleActive=false;
    clearInterval(bubbleTimer);
    const T=UI[currentLang];
    document.getElementById('bubbleResult').innerText=`${T.bubbleOver} ${T.bubbleScore} ${bubbleScore}`;
    document.getElementById('bubbleArea').innerHTML+=`<div class="bubble-game-over">
      <div>${T.bubbleOver}</div>
      <div style="font-size:42px;margin-top:8px;">${bubbleScore} ${T.bubbleScore}</div>
      <button class="overlay-close" onclick="startBubble()" style="margin-top:16px;">${T.bubbleStart}</button>
    </div>`;
  }
  document.getElementById('bubbleStart').addEventListener('click',startBubble);

  // ================= ALBUM =================
  function renderAlbum(){
    const T=UI[currentLang];
    document.getElementById('albumTitle').innerText=T.albumTitle;
    document.getElementById('albumClose').innerText=T.albumClose;
    document.getElementById('albumGrid').innerHTML=data.map(d=>{
      const word=currentLang==='en'?d.en:d.uz;
      const learned=learnedSet.has(d.key);
      return `<div class="album-card">
        <div class="a-emoji">${d.emoji}</div>
        <div class="a-name">${word}</div>
        <div style="font-size:14px;color:#888;margin-top:4px;">${learned?'&#11088;':'&#9734;'}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('albumClose').addEventListener('click',()=>{
    document.getElementById('albumOverlay').classList.remove('active');
  });
  document.getElementById('lessonHeader').addEventListener('click',(e)=>{
    if(e.target.closest('#hdrBookBtn')){
      renderAlbum();
      document.getElementById('albumOverlay').classList.add('active');
    }
  });

  // ================= INIT =================
  initHeader();
  setLang(currentLang);
  switchMode('learn');
</script>

</body>
</html>
