<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dono Bola - 1. Dars</title>

 <style>
  /* ===== INLINE HEADER CSS ===== */
  .dono-header {
    width: 100%; max-width: 520px; margin: 0 auto 12px;
    border-radius: 28px; background: #ffffff;
    box-shadow: 0 14px 0 rgba(0,0,0,0.08);
    border: 4px solid #fff; overflow: hidden; position: relative;
  }
  .dono-header .content { position: relative; z-index: 2; padding: 14px; }
  .dono-header .top-row {
    display: grid; grid-template-columns: 88px 1fr 88px;
    align-items: center; gap: 10px;
  }
  .dono-header .topIcon {
    width: 82px; height: 82px; border: none; background: transparent;
    cursor: pointer; border-radius: 22px; display: flex;
    align-items: center; justify-content: center; font-size: 62px;
    line-height: 1; user-select: none; text-decoration: none;
  }
  .dono-header .topIcon:active { transform: translateY(2px) scale(0.98); }
  .dono-header .titleWrap { min-width: 0; text-align: center; }
  .dono-header .title {
    margin: 0; font-size: 34px; font-weight: 1000;
    letter-spacing: 0.2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: #1f2937;
  }
  .dono-header .sub {
    margin-top: 6px; font-size: 18px; font-weight: 1000;
    color: rgba(31,41,55,0.65);
  }
  .dono-header .progress-track {
    height: 18px; background: rgba(255,255,255,0.65);
    border-radius: 999px; overflow: hidden; margin: 12px 4px 0;
    box-shadow: inset 0 2px 0 rgba(0,0,0,0.06);
    border: 2px solid rgba(255,255,255,0.7);
  }
  .dono-header .progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #22c55e, #34d399);
    transition: width 0.45s ease;
  }
  .dono-header .mini {
    text-align: center; margin-top: 10px;
    font-size: 20px; font-weight: 1000; color: #111827;
  }
  .dono-header .langRow {
    display: flex; justify-content: center; gap: 16px; margin-top: 12px;
  }
  .dono-header .langBtn {
    width: 118px; padding: 10px 0; font-size: 16px; font-weight: 1000;
    border: none; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.70); color: #1e4ed8;
    box-shadow: 0 10px 20px rgba(0,0,0,0.10);
  }
  .dono-header .langBtn.active {
    background: #2f6bff; color: #fff;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.10);
  }
  .dono-header .sky {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(circle at 18% 12%, rgba(255, 214, 102, 0.78) 0%, rgba(255, 214, 102, 0.0) 58%),
      linear-gradient(180deg, #7DD3FC 0%, #A5F3FC 45%, #FFF6E8 100%);
  }
  .dono-header .sun {
    position: absolute; left: -30px; top: -35px;
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FFF7C2 0%, #FFD400 45%, #FFB300 100%);
    box-shadow: 0 18px 35px rgba(255,179,0,0.35);
    animation: sunBob 4s ease-in-out infinite;
  }
  @keyframes sunBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(6px) rotate(1.5deg); }
  }
  .dono-header .sun::before {
    content: ""; position: absolute; inset: -58px; border-radius: 50%;
    background: repeating-conic-gradient(from -10deg, rgba(255,214,0,0.0) 0deg 10deg, rgba(255,214,0,0.32) 10deg 14deg);
    opacity: 0.65; animation: raysSpin 18s linear infinite;
  }
  @keyframes raysSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .dono-header .cloud {
    position: absolute; width: 170px; height: 58px;
    background: rgba(255,255,255,0.90); border-radius: 999px;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.08));
  }
  .dono-header .cloud::before, .dono-header .cloud::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.90); border-radius: 50%;
  }
  .dono-header .cloud::before { width: 74px; height: 74px; left: 18px; top: -30px; }
  .dono-header .cloud::after { width: 96px; height: 96px; left: 62px; top: -44px; }
  .dono-header .c1 { top: 22px; left: 120px; opacity: 0.95; animation: cloudMove1 70s linear infinite; }
  .dono-header .c2 { top: 78px; left:  20px; opacity: 0.85; transform: scale(0.9); animation: cloudMove2 95s linear infinite; }
  .dono-header .c3 { top: 45px; left: 420px; opacity: 0.80; transform: scale(1.05); animation: cloudMove3 120s linear infinite; }
  @keyframes cloudMove1 { from { transform: translateX(-320px); } to { transform: translateX(1000px); } }
  @keyframes cloudMove2 { from { transform: translateX(1200px) scale(0.9); } to { transform: translateX(-340px) scale(0.9); } }
  @keyframes cloudMove3 { from { transform: translateX(-640px) scale(1.05); } to { transform: translateX(1000px) scale(1.05); } }
  .dono-header .sparkle {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.9); box-shadow: 0 0 0 6px rgba(255,255,255,0.25);
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .dono-header .s1 { top: 26px; right: 120px; animation-delay: 0.2s; }
  .dono-header .s2 { top: 60px; right:  70px; animation-delay: 1.1s; }
  .dono-header .s3 { top: 34px; right: 180px; animation-delay: 1.9s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(0.85); opacity: 0.6; }
    50%     { transform: scale(1.15); opacity: 1; }
  }
  @media (max-width: 560px) {
    .dono-header { max-width: 520px; border-radius: 26px; }
    .dono-header .title { font-size: 20px; }  /* kleiner fuer Handy */
    .dono-header .sub { font-size: 16px; }
    .dono-header .topIcon { width: 74px; height: 74px; font-size: 58px; }
    .dono-header .top-row { grid-template-columns: 78px 1fr 78px; }
    .dono-header .langBtn { width: 108px; padding: 9px 0; font-size: 15px; }
  }

  /* ===== END HEADER CSS ===== */
  :root {
    /* kräftiger & kinderfreundlich */
    --bg: #eaf6ff;        /* fröhlicher Himmel */
    --primary: #0066ff;   /* kräftiges Blau */
    --success: #00c853;   /* kräftiges Grün */
    --error: #ff2d55;     /* kräftiges Rot/Pink */
    --sun: #ffcc00;       /* kräftiges Gelb */
    --radius: 25px;

    /* Zusatzfarben nur für Hintergründe/Schatten (ändert kein Layout) */
    --bg2: #fff2cc;       /* warmes Gelb oben */
    --shadowSoft: #cfe3ff;/* statt #dfe6e9 */
    --shadowBtn: #b8c2cc; /* statt #ccc */
  }

  body {
    margin: 0;
    /* GEÄNDERT: Keine kursive Schrift mehr */
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Nunito', 'Quicksand', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%, #ffffff 100%);
    color: #2d3436;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    min-height: 100vh;
    
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* NEU: Alle Schriften normal (nicht kursiv) */
  * {
    font-style: normal !important;
  }

  /* NEU: Überschriften extra fett für bessere Lesbarkeit */
  h1, h2, h3, h4, h5, h6 {
    font-weight: 800;
    margin: 0;
  }

  /* --- MODUS NAVIGATION --- */
  .mode-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 520px;
    flex-wrap: wrap;
  }
  .mode-btn {
    flex: 1;
    padding: 14px 10px;
    border-radius: 18px;
    border: none;
    background: white;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--shadowBtn);
    font-size: 15px;
    min-width: 140px;
    white-space: nowrap;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 0 #0047b3; }

  .mode-ico{ font-size: 28px; line-height: 1; }

  /* --- SECTIONS --- */
  #learnSection, #quizSection, #memorySection, #saladSection, #bubbleSection {
    display: none; width: 100%; max-width: 520px; text-align: center;
  }
  #learnSection { display: grid; }

  /* --- LERN-KARTEN --- */
  .learn-grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; max-width: 520px; }
  .learn-card {
    background: white; border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 8px 0 var(--shadowSoft); border: 3px solid white;
  }
  .learn-emoji { font-size: 52px; width: 70px; text-align:center; }
  .learn-info { text-align: left; flex: 1; }
  .learn-main { font-weight:800; font-size:22px; }
  .learn-sub { color:#636e72; font-size:14px; margin-top:2px; }
  .stars { margin-top: 6px; font-weight: 800; color: #f39c12; font-size: 18px; }

  .btn-audio {
    background: var(--sun); border: none; width: 56px; height: 56px;
    border-radius: 50%; font-size: 24px; cursor: pointer;
    box-shadow: 0 6px 0 #cc7a00;
  }
  .btn-audio:active { transform: translateY(3px); box-shadow: 0 3px 0 #cc7a00; }

  /* --- QUIZ --- */
  .quiz-card { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 10px 0 var(--shadowSoft); }
  .quiz-emoji { font-size: 80px; margin-top: 0; }
  .option-btn {
    width: 100%; padding: 14px; margin: 8px 0; border-radius: 20px;
    border: 3px solid #f1f2f6; background: white; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 5px 0 #f1f2f6;
  }
  .option-btn:active { transform: translateY(2px); box-shadow: none; }

  /* --- MEMORY --- */
  .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .memory-card {
    height: 90px; background: var(--primary); border-radius: 18px;
    display: flex; justify-content: center; align-items: center;
    font-size: 26px; color: white; cursor: pointer;
    box-shadow: 0 6px 0 #0047b3;
    user-select:none; padding:8px; text-align:center;
  }
  .memory-card.flipped { background: white; color: #2d3436; box-shadow: 0 6px 0 var(--shadowBtn); }
  .memory-card.matched { visibility: hidden; }

  /* --- ALBUM --- */
  .album-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 1000; justify-content: center; align-items: center;
  }
  .album-content { background: white; padding: 26px; border-radius: 30px; text-align: center; width: 85%; max-width: 420px; }
  .sticker-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 14px;
  }
  .sticker-slot {
    width: 60px; height: 60px; background: #eee; border-radius: 50%;
    display: inline-flex; justify-content: center; align-items: center;
    font-size: 30px; opacity: 0.2; filter: grayscale(1);
    border: 2px dashed #bbb;
  }
  .sticker-slot.unlocked { opacity: 1; filter: none; background: #fff9e6; border: 3px solid var(--sun); }

  /* --- BUCHSTABENSALAT (Letter Salad) --- */
  .salad-card {
    background: white; border-radius: 30px; padding: 20px;
    box-shadow: 0 10px 0 var(--shadowSoft);
  }
  .salad-emoji { font-size: 80px; margin-top: 0; }
  .salad-slots {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px; margin: 16px 0 10px;
  }
  .salad-slot {
    width: 42px; height: 52px; border-radius: 12px;
    background: #f8fafc; border: 3px dashed #cbd5e1;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: #1f2937;
  }
  .salad-slot.filled { border: 3px solid var(--success); background: #ecfdf5; }
  .salad-tiles {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; margin-top: 6px;
  }
  .salad-tile {
    width: 52px; height: 52px; border-radius: 14px; border: none;
    background: var(--primary); color: white;
    font-size: 24px; font-weight: 800; cursor: pointer;
    box-shadow: 0 5px 0 #0047b3; user-select: none;
    touch-action: manipulation;
  }
  .salad-tile:active { transform: translateY(3px); box-shadow: 0 2px 0 #0047b3; }
  .salad-tile.used { visibility: hidden; }
  .salad-tile.wrong { background: var(--error); animation: saladShake 0.4s; }
  @keyframes saladShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .banner{
    background:white; padding:12px; border-radius:30px;
    border:4px solid #3b82f6;
    font-size:22px; font-weight:800;
    margin-bottom:10px;
  }
  .small-note{ font-weight:700; color:#334155; font-size:14px; margin-top:6px; }

  /* --- BUBBLES --- */
  #bubbleArea{
    position: relative; width: 100%; height: 60vh;
    background: linear-gradient(#3b82f6, #0ea5ff);
    border-radius: 30px;
    border: 8px solid white; overflow: hidden; margin-top: 10px;
  }
  .bubble{
    position: absolute; width: 90px; height: 90px; background: rgba(255,255,255,0.55);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 44px; border: 3px solid white; animation: floatUp 4s linear forwards;
    cursor: pointer; user-select:none;
  }
  @keyframes floatUp { 0% { transform: translateY(65vh); } 100% { transform: translateY(-15vh); } }

  /* --- CELEBRATION OVERLAY --- */
  .celebrate-overlay{
    display:none;
    position:fixed; inset:0;
    background: rgba(0,0,0,0.75);
    z-index: 2000;
    align-items:center; justify-content:center;
    padding: 16px;
  }
  .celebrate-overlay.show{ display:flex; }
  .celebrate-card{
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 30px;
    padding: 22px;
    text-align:center;
    box-shadow: 0 14px 0 rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
    border: 6px solid #fff;
  }
  .celebrate-emoji{ font-size: 60px; }
  .celebrate-title{ font-size: 24px; font-weight: 800; margin-top: 6px; }
  .celebrate-text{ color:#374151; font-weight: 700; margin-top: 8px; font-size: 15px; }
  .celebrate-btn{
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border-radius: 18px;
    border: none;
    background: var(--success);
    color: white;
    font-weight: 800;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 6px 0 #09725b;
  }
  .celebrate-btn:active{ transform: translateY(3px); box-shadow: 0 3px 0 #09725b; }

  .confetti{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .dot{
    position:absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    opacity: 0.95;
    animation: fall 2.2s linear forwards;
  }
  @keyframes fall{
    0%{ transform: translateY(-20px) rotate(0deg); }
    100%{ transform: translateY(560px) rotate(360deg); opacity: 0.9; }
  }

  /* --- RESPONSIVE: EXTRA KLEINE HANDYS --- */
  @media screen and (max-width: 375px) {
    body { padding: 8px; }
    .mode-btn { font-size: 13px; min-width: 140px; padding: 12px 8px; }
    .mode-ico { font-size: 24px; }
    .learn-main { font-size: 20px; }
    .learn-sub { font-size: 13px; }
    .learn-emoji { font-size: 44px; width: 60px; }
    .quiz-emoji { font-size: 64px; }
    #qWordMain { font-size: 24px; }
    .memory-card { height: 80px; font-size: 22px; }
    .salad-tile { width: 46px; height: 46px; font-size: 20px; }
    .salad-slot { width: 36px; height: 46px; font-size: 20px; }
    .banner { font-size: 20px; padding: 10px; }
  }

  /* --- RESPONSIVE: GROSSE HANDYS --- */
  @media screen and (min-width: 414px) {
    .mode-btn { font-size: 16px; padding: 16px 12px; }
    .learn-emoji { font-size: 60px; }
    .learn-main { font-size: 24px; }
  }
</style>
</head>

<body>

  <!-- Sounds from your repo -->
  <audio id="cheerAudio" src="sounds/cheer.mp3" preload="auto"></audio>

  <!-- Celebration Overlay -->
  <div class="celebrate-overlay" id="celebrateOverlay">
    <div class="celebrate-card">
      <div class="confetti" id="confetti"></div>
      <div class="celebrate-emoji" id="celebrateEmoji">🎉</div>
      <div class="celebrate-title" id="celebrateTitle">Barakalla!</div>
      <div class="celebrate-text" id="celebrateText">Zo'r!</div>
      <button class="celebrate-btn" onclick="closeCelebrate()">OK ✅</button>
    </div>
  </div>

  <!-- NEU: Animierter Header (wie bei Sonlar) -->
  <!-- INLINE HEADER -->
  <div class="dono-header" data-total="5">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
    </div>
    <div class="content">
      <div class="top-row">
        <button class="topIcon" onclick="goHome()" aria-label="Home" type="button">🏠</button>
        <div class="titleWrap">
          <h1 class="title" id="hdrTitle">Salomlashuv</h1>
          <div class="sub" id="hdrSub">1-dars</div>
        </div>
        <button class="topIcon" onclick="toggleAlbum()" aria-label="Album" type="button">📖</button>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="hdrFill" style="width:0%"></div>
      </div>
      <div class="mini" id="hdrMini">0 / 5</div>
      <div class="langRow">
        <button class="langBtn active" id="hdrUZ" onclick="switchLang('uz')" type="button">UZ</button>
        <button class="langBtn" id="hdrEN" onclick="switchLang('en')" type="button">EN</button>
      </div>
    </div>
  </div>

  <!-- Album Overlay (wird vom Header-Buch-Button aufgerufen) -->
  <div id="albumOverlay" class="album-overlay" onclick="toggleAlbum()">
    <div class="album-content" onclick="event.stopPropagation()">
      <h3 id="albumTitle" style="margin-top:0;">Mening Stikerlarim</h3>
      <div class="sticker-grid">
        <div id="stk_1" class="sticker-slot">🐰</div>
        <div id="stk_2" class="sticker-slot">🐻</div>
        <div id="stk_3" class="sticker-slot">🦁</div>
        <div id="stk_4" class="sticker-slot">🐠</div>
      </div>
      <br>
      <button class="mode-btn" onclick="toggleAlbum()" id="closeAlbumBtn">Yopish</button>
    </div>
  </div>

  <div class="mode-nav">
    <button class="mode-btn active" id="btnLearn"  onclick="changeMode('learn')"><span class="mode-ico">📖</span><span id="tLearn">O'rganish</span></button>
    <button class="mode-btn"        id="btnQuiz"   onclick="changeMode('quiz')"><span class="mode-ico">🎯</span><span id="tQuiz">Test</span></button>
    <button class="mode-btn"        id="btnMemory" onclick="changeMode('memory')"><span class="mode-ico">🧠</span><span id="tMemory">O'yin</span></button>
    <button class="mode-btn"        id="btnSalad" onclick="changeMode('salad')"><span class="mode-ico">🥗</span><span id="tSalad">Harflar salati</span></button>
    <button class="mode-btn"        id="btnBubble" onclick="changeMode('bubble')"><span class="mode-ico">🫧</span><span id="tBubble">Pufakchalar</span></button>
  </div>

  <!-- Learn -->
  <div id="learnSection" class="learn-grid"></div>

  <!-- Quiz -->
  <div id="quizSection">
    <div class="quiz-card">
      <div id="qEmoji" class="quiz-emoji">👋</div>
      <h2 id="qWordMain" style="margin: 6px 0 8px; font-size: 28px;">Salom</h2>

      <button class="option-btn" style="background:var(--sun); border-color:#f39c12;" onclick="playCurrentQuizAudio()">
        🔊 <span id="listenBtnText"> → to'g'ri javobni tanlang!</span>
      </button>

      <div id="optionsBox"></div>
    </div>
  </div>

  <!-- Memory -->
  <div id="memorySection">
    <button class="option-btn" style="background:var(--sun); border-color:#f39c12; margin-bottom:10px;" onclick="speakTask(UI[currentLang].memoryHint)">
      🔊 <span id="memoryHintBtn">Juftliklarni top!</span>
    </button>
    <div id="memStats" style="margin-bottom:10px; font-weight:800; font-size:14px;">
      <span id="movesLabel">Urinishlar</span>: <span id="moves">0</span>
    </div>
    <div class="memory-grid" id="memoryGrid"></div>
  </div>

  <!-- Buchstabensalat -->
  <div id="saladSection">
    <div class="salad-card">
      <button class="option-btn" style="background:var(--sun); border-color:#f39c12; margin-bottom:10px;" onclick="speakTask(UI[currentLang].saladHint)">
        🔊 <span id="saladHint"> → harflarni to'g'ri tartibda yoz!</span>
      </button>
      <div id="saladEmoji" class="salad-emoji">🥗</div>

      <button class="option-btn" style="background:var(--sun); border-color:#f39c12;" onclick="playSaladAudio()">
        🔊 <span id="saladListenText">Eshitish</span>
      </button>

      <div class="salad-slots" id="saladSlots"></div>
      <div class="salad-tiles" id="saladTiles"></div>
    </div>
    <div class="small-note" id="saladScoreLine">⭐ 0 / 5</div>
  </div>

  <!-- Bubbles -->
  <div id="bubbleSection">
    <button class="option-btn" style="background:var(--sun); border-color:#f39c12; margin-bottom:10px;" onclick="speakTask(UI[currentLang].bubbleHint)">
      🔊 <span id="bubbleHint">To'g'ri emojini top! ⭐</span>
    </button>
    <div id="bubbleTask" class="banner">Top: ...</div>
    <div id="bubbleArea"></div>
    <div class="small-note" id="bubbleScoreLine">⭐ 0 / 5</div>
  </div>

<!-- NEU: Header JavaScript einbinden -->
<script>
  const data = [
    { key: "1",  emoji: "👋", uz: "Salom",        en: "Hello" },
    { key: "6",  emoji: "🙏", uz: "Rahmat",       en: "Thank you" },
    { key: "9",  emoji: "🌸", uz: "Iltimos",      en: "Please" },
    { key: "4",  emoji: "🙂", uz: "Yaxshimisiz?", en: "How are you?" },
    { key: "11", emoji: "🌙", uz: "Xayr",         en: "Bye" }
  ];

  const UI = {
    uz: {
      title: "Salomlashuv",
      subtitle: "1-dars",
      learn: "O'rganish",
      quiz: "Test",
      memory: "O'yin",
      salad: "Harflar salati",
      bubble: "Pufakchalar",
      listen: "Eshitish",
      quizHint: "→ to'g'ri javobni tanlang!",
      moves: "Urinishlar",
      album: "Mening Stikerlarim",
      close: "Yopish",
      saladHint: " → harflarni to'g'ri tartibda yoz!",
      bubbleHint: "To'g'ri emojini top! ⭐",
      memoryHint: "Juftliklarni top!",
      bubbleTask: "Top: ",
      doneQuizTitle: "Barakalla! 🐰",
      doneQuizText: "Test tugadi! Siz quyon stikerini oldingiz!",
      winMemoryTitle: "Zo'r! 🐻",
      winMemoryText: "Memory tugadi! Siz ayiq stikerini oldingiz!",
      winSaladTitle: "Ajoyib! 🦁",
      winSaladText: "Harflar salati tugadi! Siz sher stikerini oldingiz!",
      winBubbleTitle: "Super! 🐠",
      winBubbleText: "Pufakchalar tugadi! Siz baliq stikerini oldingiz!",
      allDoneTitle: "HAMMASI TUGADI! 🎉👏",
      allDoneText: "Siz 1-dars va hamma o'yinlarni tugatdingiz! YAY! 🎊"
    },
    en: {
      title: "Greetings",
      subtitle: "Lesson 1",
      learn: "Learn",
      quiz: "Quiz",
      memory: "Memory",
      salad: "Letter Salad",
      bubble: "Bubbles",
      listen: "Listen",
      quizHint: "→ Choose the correct answer!",
      moves: "Moves",
      album: "My Stickers",
      close: "Close",
      saladHint: "→ tap the letters in the right order!",
      bubbleHint: "Find the correct emoji! ⭐",
      memoryHint: "Find the pairs!",
      bubbleTask: "Tap: ",
      doneQuizTitle: "Well done! 🐰",
      doneQuizText: "Quiz complete! You earned the bunny sticker!",
      winMemoryTitle: "You won! 🐻",
      winMemoryText: "Memory complete! You earned the bear sticker!",
      winSaladTitle: "Great! 🦁",
      winSaladText: "Letter Salad complete! You earned the lion sticker!",
      winBubbleTitle: "Amazing! 🐠",
      winBubbleText: "Bubbles complete! You earned the fish sticker!",
      allDoneTitle: "ALL DONE! 🎉👏",
      allDoneText: "You finished Lesson 1 and all games! YAY! 🎊"
    }
  };

  let currentLang = "uz";

  const GLOBAL_LEARNED_KEY = "learned";
  function getGlobalLearnedSet(){
    try { return new Set(JSON.parse(localStorage.getItem(GLOBAL_LEARNED_KEY) || "[]")); }
    catch { return new Set(); }
  }
  function markGlobalLearned(wordKey){
    const learned = getGlobalLearnedSet();
    const gKey = "L1_" + wordKey;
    if(!learned.has(gKey)){
      learned.add(gKey);
      localStorage.setItem(GLOBAL_LEARNED_KEY, JSON.stringify([...learned]));
    }
  }
  function syncGlobalLearnedFromStars(){
    const st = loadStars();
    for(const item of data){
      if((st[item.key] || 0) > 0) markGlobalLearned(item.key);
    }
  }

  function unlockNextLessonFlag(){
    localStorage.setItem("lesson2_unlocked", "true");
  }

  const STARS_KEY = "lesson1_stars_v3";
  const QUIZ_DONE_KEY = "lesson1_quiz_done_v3";
  const STICKERS_KEY = "stickers";
  const DONE_MEMORY_KEY = "lesson1_done_memory_v1";
  const DONE_SALAD_KEY  = "lesson1_done_salad_v1";
  const DONE_BUBBLE_KEY = "lesson1_done_bubble_v1";
  const DONE_ALL_KEY    = "lesson1_done_all_v1";

  function playSound(file){
    const a = new Audio("sounds/" + file);
    a.play().catch(()=>{});
  }
  function sfxWin(){ playSound("success.mp3"); }
  function sfxFail(){ playSound("fail.mp3"); }
  function sfxPop(){ playSound("pop.mp3"); }
  function playCheerYay(){
    const a = document.getElementById("cheerAudio");
    if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
    else { playSound("cheer.mp3"); }
  }

  function speakTask(text){
    try{
      if(!text) return;
      const clean = String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu, '').trim();
      if(!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = (currentLang === "en") ? "en-US" : "uz-UZ";
      u.rate = 0.9; u.pitch = 1.05;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }


  function loadStars(){ try { return JSON.parse(localStorage.getItem(STARS_KEY) || "{}"); } catch { return {}; } }
  function saveStars(st){ localStorage.setItem(STARS_KEY, JSON.stringify(st)); }
  function starText(n){ n=Math.max(0,Math.min(3,n)); return "★".repeat(n)+"☆".repeat(3-n); }

  function loadQuizDone(){ try { return JSON.parse(localStorage.getItem(QUIZ_DONE_KEY) || "[]"); } catch { return []; } }
  function saveQuizDone(arr){ localStorage.setItem(QUIZ_DONE_KEY, JSON.stringify(arr)); }
  function quizDoneCount(){ return loadQuizDone().length; }

  function updateProgress(){
    const done = quizDoneCount();
    if (typeof setHeaderProgress === 'function') {
      setHeaderProgress({ learned: done, total: data.length });
    }
    updateHeaderText();
  }

  function celebrate(title, text, emoji="🎉"){
    document.getElementById("celebrateEmoji").innerText = emoji;
    document.getElementById("celebrateTitle").innerText = title;
    document.getElementById("celebrateText").innerText = text;

    const conf = document.getElementById("confetti");
    conf.innerHTML = "";
    const colors = ["#F59E0B","#EF4444","#10B981","#3B82F6","#A855F7","#F97316"];
    for(let i=0;i<75;i++){
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = (Math.random()*100) + "%";
      d.style.top  = (-30 - Math.random()*220) + "px";
      d.style.background = colors[Math.floor(Math.random()*colors.length)];
      d.style.animationDelay = (Math.random()*0.25) + "s";
      d.style.animationDuration = (1.6 + Math.random()*1.1) + "s";
      conf.appendChild(d);
    }

    document.getElementById("celebrateOverlay").classList.add("show");
    sfxWin();
  }

  function closeCelebrate(){
    document.getElementById("celebrateOverlay").classList.remove("show");
    checkAllCompleted();
  }

  function checkAllCompleted(){
    const quizDone = (quizDoneCount() === data.length);
    const memDone  = (localStorage.getItem(DONE_MEMORY_KEY) === "1");
    const saladDone = (localStorage.getItem(DONE_SALAD_KEY) === "1");
    const bubDone  = (localStorage.getItem(DONE_BUBBLE_KEY) === "1");

    if(quizDone && memDone && saladDone && bubDone){
      if(localStorage.getItem(DONE_ALL_KEY) !== "1"){
        localStorage.setItem(DONE_ALL_KEY, "1");
        unlockNextLessonFlag();
        const T = UI[currentLang];
        celebrate(T.allDoneTitle, T.allDoneText, "🏆");
        playCheerYay();
      }
      return true;
    }
    return false;
  }

  function setLang(lang){
    currentLang = lang;
    const T = UI[lang];
    updateHeaderText();

    document.getElementById("tLearn").innerText = T.learn;
    document.getElementById("tQuiz").innerText = T.quiz;
    document.getElementById("tMemory").innerText = T.memory;
    document.getElementById("tSalad").innerText = T.salad;
    document.getElementById("tBubble").innerText = T.bubble;
    document.getElementById("listenBtnText").innerText = T.quizHint;
    document.getElementById("movesLabel").innerText = T.moves;

    document.getElementById("albumTitle").innerText = T.album;
    document.getElementById("closeAlbumBtn").innerText = T.close;
    document.getElementById("saladHint").innerText = T.saladHint;
    document.getElementById("memoryHintBtn").innerText = T.memoryHint;
    document.getElementById("saladListenText").innerText = T.listen;
    document.getElementById("bubbleHint").innerText = T.bubbleHint;

    renderLearn(true);
    loadQuiz();

    bubbleOrder = [];
    bubbleIdx = 0;

    if(document.getElementById("saladSection").style.display === "block") startSalad();
    if(document.getElementById("bubbleSection").style.display === "block") startBubbles();
  }

  function changeMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');

    document.getElementById('learnSection').style.display = 'none';
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('memorySection').style.display = 'none';
    document.getElementById('saladSection').style.display = 'none';
    document.getElementById('bubbleSection').style.display = 'none';

    stopBubbles();
    clearTimeout(saladNextTimer);

    if(mode === 'learn'){ document.getElementById('learnSection').style.display='grid'; renderLearn(true); }
    if(mode === 'quiz'){  document.getElementById('quizSection').style.display='block'; loadQuiz(); }
    if(mode === 'memory'){document.getElementById('memorySection').style.display='block'; initMemory(); }
    if(mode === 'salad'){ document.getElementById('saladSection').style.display='block'; startSalad(); }
    if(mode === 'bubble'){document.getElementById('bubbleSection').style.display='block'; startBubbles(); }
  }

  function audioPath(key){ return currentLang === "en" ? `en/${key}.mp3` : `a/${key}.mp3`; }

  let currentAudio = null;
  function stopAudio(){
    try{
      if(currentAudio){
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
    }catch(e){}
    currentAudio = null;
  }

  function playAudio(key, rate=1.0){
    stopAudio();
    const a = new Audio(audioPath(key));
    a.playbackRate = rate;
    currentAudio = a;
    a.play().catch(()=>{});
    return a;
  }

  function setStarForKey(key, value){
    const st = loadStars();
    st[key] = Math.max(0, Math.min(3, value));
    saveStars(st);

    if(st[key] > 0) markGlobalLearned(key);

    const el = document.getElementById("star_" + key);
    if(el) el.innerText = starText(st[key]);
  }

  function renderLearn(bindEvents){
    const st = loadStars();
    const container = document.getElementById('learnSection');
    container.innerHTML = '';

    data.forEach(item => {
      const s = st[item.key] || 0;
      const main = (currentLang === "en") ? item.en : item.uz;
      const sub  = (currentLang === "en") ? item.uz : item.en;

      const div = document.createElement('div');
      div.className = 'learn-card';
      div.innerHTML = `
        <div class="learn-emoji">${item.emoji}</div>
        <div class="learn-info">
          <div class="learn-main">${main}</div>
          <div class="learn-sub">${sub}</div>
          <div class="stars" id="star_${item.key}">${starText(s)}</div>
        </div>
        <button class="btn-audio" data-key="${item.key}">🔊</button>
      `;
      container.appendChild(div);
    });

    if(bindEvents){
      container.querySelectorAll('.btn-audio').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const key = btn.getAttribute('data-key');
          playAudio(key, 1.0);
          const current = (loadStars()[key] || 0);
          setStarForKey(key, current + 1);
        });
      });
    }
  }

  let currentQuizIdx = 0;

  function playCurrentQuizAudio(){
    const item = data[currentQuizIdx];
    playAudio(item.key, 1.0);
  }

  function loadQuiz(){
    updateProgress();
    const done = loadQuizDone();

    let safety = 0;
    while(done.includes(data[currentQuizIdx].key) && safety < 20){
      currentQuizIdx = (currentQuizIdx + 1) % data.length;
      safety++;
    }

    if(done.length === data.length){
      document.getElementById('qEmoji').innerText = "🏆";
      document.getElementById('qWordMain').innerText = (currentLang==="en") ? "Quiz completed!" : "Test tugadi!";
      document.getElementById('optionsBox').innerHTML =
        `<button class="option-btn" onclick="restartQuiz()">🔁 Restart</button>`;
      return;
    }

    const item = data[currentQuizIdx];
    document.getElementById('qEmoji').innerText = item.emoji;

    const qWord = (currentLang === "en") ? item.en : item.uz;
    document.getElementById('qWordMain').innerText = qWord;

    const correct = (currentLang === "en") ? item.uz : item.en;
    const pool = data.map(x => (currentLang === "en") ? x.uz : x.en);

    let choices = [correct];
    while(choices.length < 3) {
      const r = pool[Math.floor(Math.random()*pool.length)];
      if(!choices.includes(r)) choices.push(r);
    }
    choices.sort(() => Math.random() - 0.5);

    const box = document.getElementById('optionsBox');
    box.innerHTML = '';

    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = c;

      btn.onclick = () => {
        if(c === correct) {
          btn.style.background = 'var(--success)'; btn.style.color = 'white';

          const doneList = loadQuizDone();
          if(!doneList.includes(item.key)){
            doneList.push(item.key);
            saveQuizDone(doneList);
          }

          setStarForKey(item.key, 3);

          setTimeout(() => {
            currentQuizIdx = (currentQuizIdx + 1) % data.length;

            if(loadQuizDone().length === data.length){
              unlockSticker(1);
              const T = UI[currentLang];
              celebrate(T.doneQuizTitle, T.doneQuizText, "🐰");
              checkAllCompleted();
            }

            updateProgress();
            loadQuiz();
          }, 420);
        } else {
          btn.style.background = 'var(--error)'; btn.style.color = 'white';
          setTimeout(() => { btn.style.background = 'white'; btn.style.color = '#2d3436'; }, 600);
        }
      };

      box.appendChild(btn);
    });
  }

  function restartQuiz(){
    saveQuizDone([]);
    currentQuizIdx = 0;
    updateProgress();
    loadQuiz();
  }

  let flippedCards = [];
  let moves = 0;
  let matches = 0;

  function initMemory() {
    const grid = document.getElementById('memoryGrid');
    grid.innerHTML = '';
    moves = 0; matches = 0;
    flippedCards = [];
    document.getElementById('moves').innerText = moves;

    let cards = [];
    data.forEach(item => {
      const word = (currentLang === "en") ? item.en : item.uz;
      cards.push({ id: item.key, val: item.emoji });
      cards.push({ id: item.key, val: word });
    });
    cards.sort(() => Math.random() - 0.5);

    cards.forEach(c => {
      const div = document.createElement('div');
      div.className = 'memory-card';
      div.innerText = "❓";

      div.onclick = () => {
        if(flippedCards.length < 2 && !div.classList.contains('flipped') && !div.classList.contains('matched')) {
          div.classList.add('flipped');
          div.innerText = c.val;
          flippedCards.push({ div, id: c.id });

          if(flippedCards.length === 2) {
            moves++;
            document.getElementById('moves').innerText = moves;

            setTimeout(() => {
              if(flippedCards[0].id === flippedCards[1].id) {
                flippedCards.forEach(f => f.div.classList.add('matched'));
                matches++;
                if(matches === data.length) {
                  localStorage.setItem(DONE_MEMORY_KEY, "1");
                  unlockSticker(2);
                  const T = UI[currentLang];
                  celebrate(T.winMemoryTitle, T.winMemoryText, "🐻");
                  checkAllCompleted();
                }
              } else {
                flippedCards.forEach(f => {
                  f.div.classList.remove('flipped');
                  f.div.innerText = "❓";
                });
              }
              flippedCards = [];
            }, 800);
          }
        }
      };

      grid.appendChild(div);
    });
  }

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  /* ===== BUCHSTABENSALAT (Letter Salad) ===== */
  let saladOrder = [];
  let saladIdx = 0;
  let saladItem = null;
  let saladLetters = "";
  let saladPos = 0;
  let saladNextTimer = null;

  function saladCleanWord(word){
    return (word || "").replace(/[^\p{L}]/gu, "").toUpperCase();
  }

  function playSaladAudio(){
    if(!saladItem) return;
    playAudio(saladItem.key, 1.0);
  }

  function updateSaladScoreLine(){
    const el = document.getElementById("saladScoreLine");
    if(el) el.innerText = `⭐ ${saladIdx} / ${data.length}`;
  }

  function startSalad(){
    clearTimeout(saladNextTimer);
    saladOrder = shuffle(data.map(x=>x.key));
    saladIdx = 0;
    nextSaladWord();
  }

  function nextSaladWord(){
    updateSaladScoreLine();

    if(saladIdx >= saladOrder.length){
      finishSaladGame();
      return;
    }

    saladItem = data.find(x=>x.key===saladOrder[saladIdx]);
    const word = (currentLang === "en") ? saladItem.en : saladItem.uz;
    saladLetters = saladCleanWord(word);
    saladPos = 0;

    document.getElementById("saladEmoji").innerText = saladItem.emoji;

    const slots = document.getElementById("saladSlots");
    slots.innerHTML = "";
    for(let i=0; i<saladLetters.length; i++){
      const s = document.createElement("div");
      s.className = "salad-slot";
      slots.appendChild(s);
    }

    const tiles = document.getElementById("saladTiles");
    tiles.innerHTML = "";
    const letters = shuffle(saladLetters.split(""));
    letters.forEach(ch => {
      const t = document.createElement("button");
      t.className = "salad-tile";
      t.type = "button";
      t.innerText = ch;
      t.onclick = () => tapSaladTile(t, ch);
      tiles.appendChild(t);
    });
  }

  function tapSaladTile(tile, ch){
    if(tile.classList.contains("used")) return;

    const needed = saladLetters[saladPos];
    if(ch.toUpperCase() === needed){
      const slots = document.getElementById("saladSlots").children;
      slots[saladPos].innerText = ch;
      slots[saladPos].classList.add("filled");
      tile.classList.add("used");
      saladPos++;

      if(saladPos >= saladLetters.length){
        setStarForKey(saladItem.key, 3);
        saladIdx++;
        updateSaladScoreLine();
        saladNextTimer = setTimeout(nextSaladWord, 900);
      }
    } else {
      tile.classList.add("wrong");
      setTimeout(() => tile.classList.remove("wrong"), 450);
    }
  }

  function finishSaladGame(){
    localStorage.setItem(DONE_SALAD_KEY, "1");
    unlockSticker(3);
    const T = UI[currentLang];
    celebrate(T.winSaladTitle, T.winSaladText, "🦁");
    checkAllCompleted();
  }

  let bubbleInt = null;
  let bubbleOrder = [];
  let bubbleIdx = 0;
  let bubbleTarget = null;

  function stopBubbles(){
    if(bubbleInt){ clearInterval(bubbleInt); bubbleInt = null; }
  }

  function updateBubbleScoreLine(){
    const el = document.getElementById("bubbleScoreLine");
    if(el) el.innerText = `⭐ ${bubbleIdx} / ${data.length}`;
  }

  function finishBubbleGame(){
    localStorage.setItem(DONE_BUBBLE_KEY, "1");
    unlockSticker(4);
    const T = UI[currentLang];
    celebrate(T.winBubbleTitle, T.winBubbleText, "🐠");
    checkAllCompleted();
  }

  function startBubbles(){
    stopBubbles();

    if(bubbleOrder.length === 0){
      bubbleOrder = shuffle(data.map(x=>x.key));
      bubbleIdx = 0;
    }

    if(bubbleIdx >= data.length){
      finishBubbleGame();
      bubbleOrder = [];
      bubbleIdx = 0;
      updateBubbleScoreLine();
      return;
    }

    const key = bubbleOrder[bubbleIdx];
    bubbleTarget = data.find(x=>x.key===key);

    const taskWord = (currentLang === "en") ? bubbleTarget.en : bubbleTarget.uz;
    const T = UI[currentLang];
    document.getElementById('bubbleTask').innerText = T.bubbleTask + taskWord;

    playAudio(bubbleTarget.key, 1.0);

    const area = document.getElementById('bubbleArea');
    area.innerHTML = "";
    updateBubbleScoreLine();

    let bubbleSpawnN = 0;
    bubbleInt = setInterval(() => {
      const b = document.createElement('div');
      bubbleSpawnN++;
      const randomItem = (bubbleSpawnN % 3 === 0) ? bubbleTarget : data[Math.floor(Math.random() * data.length)];

      b.className = 'bubble';
      b.innerText = randomItem.emoji;
      b.style.left = (Math.random() * 70 + 10) + '%';

      b.onclick = () => {

        if(randomItem.key === bubbleTarget.key) {
          b.innerText = '⭐';
          b.style.background = '#2ed573';
          b.style.borderColor = '#fff';
          bubbleIdx++;
          stopBubbles();
          setTimeout(startBubbles, 500);
        } else {
          b.innerText = '💨';
          setTimeout(() => b.remove(), 150);
        }
      };

      area.appendChild(b);
      setTimeout(() => b.remove(), 4000);
    }, 1200);
  }

  function toggleAlbum() {
    const album = document.getElementById('albumOverlay');
    album.style.display = (album.style.display === 'flex') ? 'none' : 'flex';

    const earned = JSON.parse(localStorage.getItem(STICKERS_KEY) || "[]");
    earned.forEach(id => {
      const el = document.getElementById('stk_'+id);
      if(el) el.classList.add('unlocked');
    });
  }

  function unlockSticker(id) {
    let earned = JSON.parse(localStorage.getItem(STICKERS_KEY) || "[]");
    if(!earned.includes(id)) {
      earned.push(id);
      localStorage.setItem(STICKERS_KEY, JSON.stringify(earned));
    }
  }

  /* ===== INLINE HEADER FUNCTIONS ===== */
  function goHome() { window.location.href = 'index.html'; }

  function switchLang(lang) {
    currentLang = lang;
    document.getElementById('hdrUZ').classList.toggle('active', lang === 'uz');
    document.getElementById('hdrEN').classList.toggle('active', lang === 'en');
    setLang(lang);
  }

  window.setHeaderProgress = function({ learned, total } = {}) {
    const header = document.querySelector(".dono-header");
    if (!header) return;
    const t = total ?? Number(header.getAttribute("data-total") || 5);
    const l = Math.max(0, Math.min(Number(learned ?? 0), t));
    const pct = t ? (l / t) * 100 : 0;
    const mini = header.querySelector("#hdrMini");
    const fill = header.querySelector("#hdrFill");
    if (mini) mini.textContent = `${l} / ${t}`;
    if (fill) fill.style.width = pct + "%";
  };

  function initHeader() {
    document.getElementById('albumOverlay').style.display = 'none';
    updateHeaderText();
    updateProgress();
  }

  function updateHeaderText() {
    const hdrTitle = document.getElementById('hdrTitle');
    const hdrSub = document.getElementById('hdrSub');
    if (hdrTitle) hdrTitle.innerText = UI[currentLang].title;
    if (hdrSub) hdrSub.innerText = UI[currentLang].subtitle || '';
  }

  (function init(){
    initHeader();
    renderLearn(true);
    syncGlobalLearnedFromStars();
    updateProgress();
    checkAllCompleted();
  })();
</script>

</body>
</html>
