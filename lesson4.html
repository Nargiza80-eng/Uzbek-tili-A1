<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4-dars: Ranglar</title>

  <link rel="stylesheet" href="components/header.css">
  <script src="components/header.js" defer></script>

  <style>
    :root{
      --bg:#FFF3FB;
      --panel:#FFFFFF;
      --ink:#1F2937;
      --muted:#6B7280;

      --blue:#2F6BFF;
      --blueDark:#1E4ED8;

      --accent:#FF4D8D;
      --accent2:#22C55E;

      --yellow:#FACC15;
      --gold:#F59E0B;

      --good:#22C55E;
      --bad:#EF4444;

      --shadow:0 16px 34px rgba(0,0,0,0.10);
      --shadowSoft:0 10px 22px rgba(0,0,0,0.10);
      --rBig:25px;
      --r:22px;
      --pad:16px;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--ink);
      padding:12px;
    }
    .app{max-width:520px;margin:0 auto;}

    .top{
      background:var(--panel);
      border-radius:var(--rBig);
      box-shadow:var(--shadow);
      padding:var(--pad);
      overflow:hidden;
      position:relative;
    }

    .titleRow{
      display:grid;
      grid-template-columns:72px 1fr 72px;
      gap:10px;
      align-items:center;
    }
    .iconBox{
      width:64px;height:64px;
      display:flex;align-items:center;justify-content:center;
      background:transparent;border:none;cursor:pointer;
      user-select:none;font-size:48px;padding:0;
    }
    .iconBox:active{transform:scale(0.97);}
    .titleWrap{ text-align:center; min-width:0; }
    .title{
      margin:0;font-size:22px;font-weight:900;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sub{ margin-top:6px;color:var(--muted);font-weight:900;font-size:14px; }

    .track{
      margin:14px 4px 0;height:18px;background:#E5E7EB;
      border-radius:999px;overflow:hidden;
      box-shadow: inset 0 2px 0 rgba(0,0,0,0.06);
    }
    .fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,var(--accent2), #34D399);
      transition:width .35s ease;
    }
    .progMini{
      text-align:center;margin-top:10px;
      font-weight:900;font-size:20px;color:#111827;
    }

    .langRow{
      display:flex;justify-content:center;gap:18px;margin-top:12px;
    }
    .langBtn{
      width:140px;padding:12px 0;border:none;cursor:pointer;border-radius:999px;
      font-weight:1000;font-size:16px;box-shadow:var(--shadowSoft);
      background:#E5E7EB;color:var(--blueDark);
    }
    .langBtn.active{
      background:var(--blue);color:#fff;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.18), var(--shadowSoft);
    }

    .menuWrap{
      margin-top:14px;background:#F8ECFF;border-radius:var(--rBig);
      padding:12px;box-shadow:var(--shadowSoft);
    }
    .menu{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }
    .menuBtn{
      height:70px;border-radius:18px;border:none;cursor:pointer;
      font-weight:1000;font-size:20px;
      display:flex;align-items:center;justify-content:center;gap:14px;
      box-shadow:var(--shadowSoft);background:#fff;color:var(--blue);
      user-select:none;
    }
    .menuBtn.primary{
      background:var(--blue);color:#fff;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.18), var(--shadowSoft);
    }
    .menuBtn:active{transform:scale(0.98);}
    .menuEmoji{font-size:30px}

    .panel{
      margin-top:16px;background:#fff;border-radius:var(--rBig);
      box-shadow:var(--shadowSoft);padding:16px;display:none;
    }
    .panel.show{display:block;}
    .panelTitle{
      margin:0 0 10px;font-weight:1000;font-size:22px;color:#111827;
      display:flex;align-items:center;gap:10px;
    }

    .grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;
    }
    @media(max-width:560px){
      .grid{grid-template-columns:1fr;}
      .title{font-size:20px;}
      .menuBtn{font-size:18px;height:64px;}
      .langBtn{width:120px;}
      .iconBox{font-size:44px;}
    }
    @media screen and (max-width: 375px) {
      body { padding: 8px; }
      .menuBtn { font-size: 16px; height: 58px; }
      .menuEmoji { font-size: 24px; }
      .title { font-size: 18px; }
      .sub { font-size: 13px; }
      .iconBox { font-size: 40px; width: 56px; height: 56px; }
      .colorCircle { width: 60px; height: 60px; font-size: 32px; }
      .word { font-size: 20px; }
      .langBtn { width: 110px; font-size: 14px; padding: 10px 0; }
    }
    @media screen and (min-width: 414px) {
      .menuBtn { font-size: 18px; padding: 16px 12px; height: 74px; }
      .colorCircle { width: 74px; height: 74px; font-size: 40px; }
      .word { font-size: 24px; }
    }

    .card{
      background:#fff;border-radius:var(--rBig);box-shadow:var(--shadowSoft);
      padding:16px;position:relative;min-height:140px;overflow:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .colorCircle{
      width:70px;height:70px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:36px;box-shadow:0 6px 18px rgba(0,0,0,0.15);
      border:4px solid white;
    }
    .word{font-size:22px;font-weight:1000;margin-top:12px;}
    .stars{margin-top:10px;font-size:18px;font-weight:1000;letter-spacing:2px;color:var(--gold);min-height:22px;}
    .speaker{
      position:absolute;right:14px;top:14px;width:56px;height:56px;border-radius:50%;
      border:none;cursor:pointer;background:var(--yellow);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.14), var(--shadowSoft);
      display:flex;align-items:center;justify-content:center;font-size:24px;
    }
    .speaker:active{transform:scale(0.95);}

    .hint{ text-align:center;color:var(--muted);font-weight:900;margin:6px 0 0; }

    .matchingBox{display:flex;gap:12px;margin-top:14px;}
    .col{flex:1;display:flex;flex-direction:column;gap:10px;}
    .dragItem{
      padding:12px;background:#F8FAFC;border:2px solid #E5E7EB;border-radius:18px;text-align:center;
      cursor:grab;font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,0.06);user-select:none;
      font-size:20px;
    }
    .dropZone{
      padding:12px;border:2px dashed var(--blue);border-radius:18px;text-align:center;min-height:22px;font-weight:1000;
      background:#fff;transition:.2s;box-shadow:0 8px 18px rgba(0,0,0,0.06);user-select:none;
      font-size:16px;
    }
    .dropZone.over{background:#EEF2FF;}
    .dropZone.bad{background:#FEF2F2;border-color:#FECACA;}
    .dropZone.matched{background:var(--good)!important;color:#fff;border-color:var(--good)!important;}

    /* ====== BALLOON GAME STYLES ====== */
    #balloonArea{
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 320px;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFF8E7 100%);
      border-radius: var(--rBig);
      border: 6px solid white;
      overflow: hidden;
      margin-top: 10px;
      box-shadow: inset 0 4px 20px rgba(0,0,0,0.08);
    }
    .cloud{
      position: absolute;
      font-size: 40px;
      opacity: 0.6;
      pointer-events: none;
      animation: cloudFloat 8s ease-in-out infinite;
    }
    @keyframes cloudFloat {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(20px); }
    }
    .balloon{
      position: absolute;
      width: 72px;
      height: 90px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 1000;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      cursor: pointer;
      user-select: none;
      animation: balloonRise 3.5s linear forwards;
      box-shadow: inset -6px -6px 12px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.2);
      border: 3px solid rgba(255,255,255,0.4);
    }
    .balloon::after{
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 14px;
      background: rgba(0,0,0,0.3);
    }
    .balloon.popped{
      animation: popBurst 0.25s ease-out forwards !important;
      pointer-events: none;
    }
    @keyframes balloonRise {
      0% { transform: translateY(55vh) rotate(-3deg); }
      100% { transform: translateY(-120px) rotate(3deg); }
    }
    @keyframes popBurst {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
      100% { transform: scale(0); opacity: 0; }
    }
    .balloon-shine{
      position: absolute;
      top: 10px;
      left: 12px;
      width: 18px;
      height: 22px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
    }
    #balloonTask{
      text-align: center;
      font-size: 20px;
      font-weight: 1000;
      color: var(--ink);
      margin-bottom: 8px;
      padding: 10px 16px;
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadowSoft);
    }
    #balloonScore{
      text-align: center;
      margin-top: 10px;
      font-weight: 900;
      font-size: 18px;
      color: var(--muted);
    }

    /* ====== CELEBRATION OVERLAY ====== */
    .celebrate-overlay{
      display:none;
      position:fixed; inset:0;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      align-items:center; justify-content:center;
      padding: 16px;
    }
    .celebrate-overlay.show{ display:flex; }
    .celebrate-card{
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 30px;
      padding: 22px;
      text-align:center;
      box-shadow: 0 14px 0 rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      border: 6px solid #fff;
    }
    .celebrate-emoji{ font-size: 60px; }
    .celebrate-title{ font-size: 24px; font-weight: 800; margin-top: 6px; }
    .celebrate-text{ color:#374151; font-weight: 700; margin-top: 8px; font-size: 15px; }
    .celebrate-btn{
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border-radius: 18px;
      border: none;
      background: var(--good);
      color: white;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 6px 0 #09725b;
    }
    .celebrate-btn:active{ transform: translateY(3px); box-shadow: 0 3px 0 #09725b; }
    .confetti{
      position:absolute; inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .dot{
      position:absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      opacity: 0.95;
      animation: fall 2.2s linear forwards;
    }
    @keyframes fall{
      0%{ transform: translateY(-20px) rotate(0deg); }
      100%{ transform: translateY(560px) rotate(360deg); opacity: 0.9; }
    }

    .choiceRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;}
    .choiceBtn{
      padding:14px 18px;border:2px solid #E5E7EB;background:#fff;border-radius:20px;cursor:pointer;
      font-weight:1000;font-size:16px;box-shadow:0 8px 18px rgba(0,0,0,0.06);
      min-width:88px;text-align:center;
    }
    .choiceBtn.good{background:var(--good);color:#fff;border-color:var(--good);}
    .choiceBtn.bad{background:var(--bad);color:#fff;border-color:var(--bad);}

    .btnRow{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
    .btn{
      border:none;border-radius:18px;padding:14px 18px;font-weight:1000;cursor:pointer;box-shadow:var(--shadowSoft);
      min-width:190px;font-size:18px;
    }
    .btn.primary{
      background:var(--blue);color:#fff;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.18), var(--shadowSoft);
    }
    .btn.soft{
      background:#fff;color:var(--blueDark);border:2px solid #E5E7EB;
    }

    .badge{
      font-size:14px;font-weight:1000;padding:6px 12px;border-radius:999px;background:#EEF2FF;color:var(--blueDark);
    }
    .badge.done{background:#ECFDF5;color:var(--good);}

    .colorPreview{
      width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);border:6px solid white;
    }
  </style>
<base target="_blank">
</head>
<body>

<!-- CELEBRATION OVERLAY -->
<div class="celebrate-overlay" id="celebrateOverlay">
  <div class="celebrate-card">
    <div class="confetti" id="confetti"></div>
    <div class="celebrate-emoji" id="celebrateEmoji">🎉</div>
    <div class="celebrate-title" id="celebrateTitle">Barakalla!</div>
    <div class="celebrate-text" id="celebrateText">Zo'r!</div>
    <button class="celebrate-btn" onclick="closeCelebrate()">OK ✅</button>
  </div>
</div>

<div class="app">

  <div class="top">
    <div class="titleRow">
      <button class="iconBox" title="Bosh sahifa" onclick="goHome()">🏠</button>
      <div class="titleWrap">
        <h1 class="title" id="titleText">4-dars: Ranglar</h1>
        <div class="sub" id="progLabel">0 / 10 o'rganildi</div>
      </div>
      <button class="iconBox" title="Dars kitob" onclick="openSection('learn')">📖</button>
    </div>

    <div class="track"><div class="fill" id="progFill"></div></div>
    <div class="progMini" id="progMini">0 / 10</div>

    <div class="langRow">
      <button id="btn-uz" class="langBtn active" onclick="setLang('uz')">UZ</button>
      <button id="btn-en" class="langBtn" onclick="setLang('en')">EN</button>
    </div>

    <div class="menuWrap">
      <div class="menu">
        <button class="menuBtn primary" onclick="openSection('learn')"><span class="menuEmoji">📘</span><span id="menuLearn">O'rganish</span></button>
        <button class="menuBtn" onclick="openSection('match')"><span class="menuEmoji">🔗</span><span id="menuMatch">Juftini top</span></button>
        <button class="menuBtn" onclick="openSection('balloon')"><span class="menuEmoji">🎈</span><span id="menuBalloon">Pufakchalar</span></button>
        <button class="menuBtn" onclick="openSection('name')"><span class="menuEmoji">🔤</span><span id="menuName">Rangni tanla</span></button>
      </div>
    </div>
  </div>

  <!-- LEARN -->
  <div class="panel" id="panel-learn">
    <div class="panelTitle" id="panelTitleLearn">📘 O'rganish</div>
    <div class="grid" id="vocabGrid"></div>
  </div>

  <!-- MATCH -->
  <div class="panel" id="panel-match">
    <div class="panelTitle"><span id="panelTitleMatch">🔗 Juftini top</span> <span class="badge" id="g1Status">❓</span></div>
    <p class="hint" id="hintMatch">Rangni uning nomiga bog'lang</p>
    <div class="matchingBox">
      <div class="col" id="dragColors"></div>
      <div class="col" id="dropNames"></div>
    </div>
    <div class="btnRow">
      <button class="btn primary" onclick="initMatchingGame()" id="btnRefresh">🔄 Yangilash</button>
      <button class="btn soft" onclick="closePanels()" id="btnClose1">✖ Yopish</button>
    </div>
  </div>

  <!-- ====== BALLOON SPIEL ====== -->
  <div class="panel" id="panel-balloon">
    <div class="panelTitle"><span id="panelTitleBalloon">🎈 Shariklar</span> <span class="badge" id="gBalloonStatus">❓</span></div>
    <div id="balloonTask">Top: qizil</div>
    <div id="balloonArea">
      <div class="cloud" style="top:8%;left:8%;">☁️</div>
      <div class="cloud" style="top:15%;right:12%;animation-delay:-3s;">☁️</div>
      <div class="cloud" style="top:35%;left:65%;animation-delay:-5s;font-size:28px;">☁️</div>
    </div>
    <div id="balloonScore">⭐ 0 / 10</div>
    <div class="btnRow">
      <button class="btn primary" onclick="startBalloonGame()" id="btnBalloonStart">▶ Boshlash</button>
      <button class="btn soft" onclick="stopBalloonGame();closePanels();" id="btnCloseBalloon">✖ Yopish</button>
    </div>
  </div>

  <!-- NAME -->
  <div class="panel" id="panel-name">
    <div class="panelTitle"><span id="panelTitleName">🔤 Rangni tanla</span> <span class="badge" id="g4Status">❓</span></div>
    <p class="hint" id="nameTask">To'g'ri nomni tanlang</p>
    <div class="colorPreview" id="namePreview"></div>
    <div class="choiceRow" id="nameGrid"></div>
    <div id="nameProgress" style="text-align:center;margin-top:10px;font-weight:900;font-size:16px;color:var(--muted);">0 / 10</div>
    <div class="btnRow">
      <button class="btn primary" onclick="startNameGame()" id="btnStart2">▶ Boshlash</button>
      <button class="btn soft" onclick="closePanels()" id="btnClose3">✖ Yopish</button>
    </div>
  </div>

</div>

<script>
  const LESSON_ID = "lesson4_ranglar_v1";

  // ==========================================
  // UI-TEXT-SYSTEM (uz/en)
  // ==========================================
  const UI = {
    uz: {
      title: "4-dars: Ranglar",
      learned: "o'rganildi",
      menuLearn: "O'rganish",
      menuMatch: "Juftini top",
      menuBalloon: "Shariklar",
      menuName: "Rangni tanla",

      hintMatch: "Rangni uning nomiga bog'lang",

      balloonTaskPrefix: "Top: ",

      btnRefresh: "🔄 Yangilash",
      btnStart: "▶ Boshlash",
      btnClose: "✖ Yopish",
      badgeDone: "✅ Bajarildi",
      badgeUnknown: "❓",
      matchedPrefix: "✅ ",
      balloonStart: "▶ Boshlash",
      // Celebrations - alle 4 Spiele
      matchWinTitle: "Zo'r! 🔗",
      matchWinText: "Siz barcha juftlarni topdingiz!",
      matchWinEmoji: "🎉",
      balloonWinTitle: "Ajoyib! 🎈",
      balloonWinText: "Siz barcha 10 rangni topdingiz!",
      balloonWinEmoji: "🎉",
      nameWinTitle: "Barakalla! 🌟",
      nameWinText: "Siz barcha 10 rangni bilasiz!",
      nameWinEmoji: "🏆",
      learnWinTitle: "Ajoyib! 📘",
      learnWinText: "Siz barcha 10 rangni o'rganib oldingiz!",
      learnWinEmoji: "📚",
      allDoneTitle: "HAMMASI TUGADI! 🎉👏",
      allDoneText: "Siz 4-dars va hamma o'yinlarni tugatdingiz! YAY! 🎊",
      okBtn: "OK ✅"
    },
    en: {
      title: "Lesson 4: Colors",
      learned: "learned",
      menuLearn: "Learn",
      menuMatch: "Find the Pair",
      menuBalloon: "Balloons",
      menuName: "Pick the Name",
      panelLearn: "📘 Learn",
      panelMatch: "🔗 Find the Pair",
      panelBalloon: "🎈 Balloons",
      panelName: "🔤 Pick the Name",
      hintMatch: "Match the color to its name",
      hintName: "Pick the correct name",
      balloonTaskPrefix: "Tap: ",
      balloonScoreLabel: "⭐",
      balloonOf: " / 10",
      nameProgress: " / 10",
      btnRefresh: "🔄 Refresh",
      btnStart: "▶ Start",
      btnClose: "✖ Close",
      badgeDone: "✅ Done",
      badgeUnknown: "❓",
      matchedPrefix: "✅ ",
      balloonStart: "▶ Start",
      // Celebrations - all 4 games
      matchWinTitle: "Great! 🔗",
      matchWinText: "You matched all pairs!",
      matchWinEmoji: "🎉",
      balloonWinTitle: "Amazing! 🎈",
      balloonWinText: "You found all 10 colors!",
      balloonWinEmoji: "🎉",
      nameWinTitle: "Well Done! 🌟",
      nameWinText: "You know all 10 colors!",
      nameWinEmoji: "🏆",
      learnWinTitle: "Excellent! 📘",
      learnWinText: "You learned all 10 colors!",
      learnWinEmoji: "📚",
      allDoneTitle: "ALL DONE! 🎉👏",
      allDoneText: "You finished Lesson 4 and all games! YAY! 🎊",
      okBtn: "OK ✅"
    }
  };

  const items = [
    {k:"red",    hex:"#EF4444", emoji:"🔴", uz:"qizil",     en:"red"},
    {k:"yellow", hex:"#EAB308", emoji:"🟡", uz:"sariq",     en:"yellow"},
    {k:"green",  hex:"#22C55E", emoji:"🟢", uz:"yashil",    en:"green"},
    {k:"blue",   hex:"#3B82F6", emoji:"🔵", uz:"ko'k",      en:"blue"},
    {k:"pink",   hex:"#EC4899", emoji:"🩷", uz:"pushti",    en:"pink"},
    {k:"black",  hex:"#1F2937", emoji:"⚫", uz:"qora",      en:"black"},
    {k:"white",  hex:"#F3F4F6", emoji:"⚪", uz:"oq",        en:"white"},
    {k:"brown",  hex:"#92400E", emoji:"🟤", uz:"jigarrang", en:"brown"},
    {k:"orange", hex:"#F97316", emoji:"🟠", uz:"to'q sariq",en:"orange"},
    {k:"gray",   hex:"#9CA3AF", emoji:"⚪", uz:"kulrang",   en:"gray"},
  ];

  let state = { lang:"uz", stars:{}, learned:{}, games:{g1:false,gBalloon:false,g4:false} };

  function save(){ localStorage.setItem(LESSON_ID, JSON.stringify(state)); }
  function load(){
    const raw = localStorage.getItem(LESSON_ID);
    if(!raw) return;
    try{
      const s = JSON.parse(raw);
      state.lang = s.lang || "uz";
      state.stars = s.stars || {};
      state.learned = s.learned || {};
      state.games = s.games || {g1:false,gBalloon:false,g4:false};
      state.learnCelebrated = s.learnCelebrated || false;
    }catch(e){}
  }

  function goHome(){ window.location.href="index.html"; }

  function closePanels(){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function openSection(name){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
    const panel = document.getElementById("panel-"+name);
    if(panel) panel.classList.add("show");

    if(name==="match") initMatchingGame();
    if(name==="balloon") startBalloonGame();
    if(name==="name") startNameGame();

    panel?.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function T(key) {
    return (UI[state.lang] && UI[state.lang][key]) ? UI[state.lang][key] : UI.uz[key];
  }

  function updateAllTexts() {
    const learnedCount = Object.values(state.learned).filter(Boolean).length;

    document.getElementById("titleText").innerText  = T("title");
    document.getElementById("progLabel").innerText  = `${learnedCount} / 10 ${T("learned")}`;
    document.getElementById("progMini").innerText   = `${learnedCount} / 10`;

    document.getElementById("menuLearn").innerText    = T("menuLearn");
    document.getElementById("menuMatch").innerText    = T("menuMatch");
    document.getElementById("menuBalloon").innerText  = T("menuBalloon");
    document.getElementById("menuName").innerText     = T("menuName");

    document.getElementById("panelTitleLearn").innerText   = T("panelLearn");
    document.getElementById("panelTitleMatch").innerText   = T("panelMatch");
    document.getElementById("panelTitleBalloon").innerText = T("panelBalloon");
    document.getElementById("panelTitleName").innerText    = T("panelName");

    document.getElementById("hintMatch").innerText = T("hintMatch");
    document.getElementById("nameTask").innerText  = T("hintName");

    document.getElementById("btnRefresh").innerText       = T("btnRefresh");
    document.getElementById("btnStart2").innerText        = T("btnStart");
    document.getElementById("btnBalloonStart").innerText  = T("balloonStart");
    document.getElementById("btnClose1").innerText        = T("btnClose");
    document.getElementById("btnCloseBalloon").innerText  = T("btnClose");
    document.getElementById("btnClose3").innerText        = T("btnClose");

    updateBalloonTask();
    updateBadges();
  }

  function setLang(l){
    state.lang=l;
    document.getElementById("btn-uz").classList.toggle("active", l==="uz");
    document.getElementById("btn-en").classList.toggle("active", l==="en");
    save();
    updateAllTexts();
    renderVocab();
    if(document.getElementById("panel-match").classList.contains("show")) initMatchingGame();
    if(document.getElementById("panel-balloon").classList.contains("show")) { stopBalloonGame(); startBalloonGame(); }
    if(document.getElementById("panel-name").classList.contains("show")) startNameGame();
  }

  function starsText(n){
    n=Math.max(0, Math.min(3, n||0));
    return "★".repeat(n)+"☆".repeat(3-n);
  }

  function updateProgress(){
    const learnedCount = Object.values(state.learned).filter(Boolean).length;
    document.getElementById("progLabel").innerText = `${learnedCount} / 10 ${T("learned")}`;
    document.getElementById("progMini").innerText  = `${learnedCount} / 10`;
    document.getElementById("progFill").style.width = (learnedCount*10)+"%";
  }

  function updateBadges(){
    const setBadge = (id, done)=>{
      const el=document.getElementById(id);
      if(!el) return;
      el.classList.toggle("done", !!done);
      el.innerText = done ? T("badgeDone") : T("badgeUnknown");
    };
    setBadge("g1Status", state.games.g1);
    setBadge("gBalloonStatus", state.games.gBalloon);
    setBadge("g4Status", state.games.g4);
  }

  let audioCtx=null;
  function beepSuccess(){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type="triangle"; o.frequency.setValueAtTime(520,t);
      o.frequency.exponentialRampToValueAtTime(880,t+0.12);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }catch(e){}
  }
  function beepFail(){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type="sawtooth"; o.frequency.setValueAtTime(220,t);
      o.frequency.exponentialRampToValueAtTime(140,t+0.14);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }catch(e){}
  }

  function speakWord(key){
    const it=items.find(x=>x.k===key);
    if(!it) return;
    const text = (state.lang==="uz") ? it.uz : it.en;
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang = (state.lang==="uz") ? "uz-UZ" : "en-US";
      u.rate=0.95; u.pitch=1.05;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
    state.learned[key]=true;
    state.stars[key]=Math.min(3,(state.stars[key]||0)+1);
    beepSuccess();
    save();
    renderVocab();
    updateProgress();

    // Celebration wenn alle 10 Farben gelernt (noch nicht gezeigt)
    const learnedCount = Object.values(state.learned).filter(Boolean).length;
    if(learnedCount === 10 && !state.learnCelebrated){
      state.learnCelebrated = true;
      save();
      celebrate("learnWinTitle", "learnWinText", "learnWinEmoji");
    }
  }

  function renderVocab(){
    const grid=document.getElementById("vocabGrid");
    grid.innerHTML = items.map(it=>{
      const word=(state.lang==="uz") ? it.uz : it.en;
      const st=starsText(state.stars[it.k]||0);
      return `
        <div class="card">
          <div class="colorCircle" style="background:${it.hex}">${it.emoji}</div>
          <div class="word">${word}</div>
          <button class="speaker" onclick="speakWord('${it.k}')" aria-label="speak">🔊</button>
          <div class="stars">${st}</div>
        </div>
      `;
    }).join("");
  }

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  // ==========================================
  // JUFTINI TOP (Matching)
  // ==========================================
  let matchesCorrect=0, matchesTotal=0;
  function initMatchingGame(){
    const cCol=document.getElementById("dragColors");
    const nCol=document.getElementById("dropNames");
    if(!cCol || !nCol) return;
    cCol.innerHTML=""; nCol.innerHTML="";

    const pool = shuffle(items).slice(0,5);
    matchesCorrect=0; matchesTotal=pool.length;

    pool.forEach(it=>{
      const d=document.createElement("div");
      d.className="dragItem"; d.draggable=true; d.innerText=it.emoji; d.dataset.k=it.k;
      d.style.background = it.hex + "22";
      d.style.borderColor = it.hex;
      d.ondragstart=e=>e.dataTransfer.setData("text", it.k);
      cCol.appendChild(d);
    });

    shuffle(pool).forEach(it=>{
      const dz=document.createElement("div");
      dz.className="dropZone";
      dz.innerText = (state.lang==="uz") ? it.uz : it.en;
      dz.dataset.k=it.k;
      dz.ondragover=e=>{e.preventDefault(); dz.classList.add("over");};
      dz.ondrop=e=>{
        const k=e.dataTransfer.getData("text");
        if(k===dz.dataset.k){
          if(dz.classList.contains("matched")){ dz.classList.remove("over"); return; }
          dz.classList.add("matched");
          dz.innerText = T("matchedPrefix") + dz.innerText.replace(T("matchedPrefix"), "");
          matchesCorrect++; beepSuccess();
          if(matchesCorrect===matchesTotal){
            state.games.g1=true; save(); updateBadges();
            celebrate("matchWinTitle", "matchWinText", "matchWinEmoji");
          }
        }else{ dz.classList.add("bad"); beepFail(); setTimeout(()=>dz.classList.remove("bad"), 260); }
        dz.classList.remove("over");
      };
      nCol.appendChild(dz);
    });
  }

  // ==========================================
  // CELEBRATION OVERLAY
  // ==========================================
  function celebrate(titleKey, textKey, emojiKey){
    document.getElementById("celebrateEmoji").innerText = T(emojiKey);
    document.getElementById("celebrateTitle").innerText = T(titleKey);
    document.getElementById("celebrateText").innerText = T(textKey);

    const conf = document.getElementById("confetti");
    conf.innerHTML = "";
    const colors = ["#F59E0B","#EF4444","#10B981","#3B82F6","#A855F7","#F97316"];
    for(let i=0;i<75;i++){
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = (Math.random()*100) + "%";
      d.style.top  = (-30 - Math.random()*220) + "px";
      d.style.background = colors[Math.floor(Math.random()*colors.length)];
      d.style.animationDelay = (Math.random()*0.25) + "s";
      d.style.animationDuration = (1.6 + Math.random()*1.1) + "s";
      conf.appendChild(d);
    }
    document.getElementById("celebrateOverlay").classList.add("show");
    beepSuccess();
  }

  function closeCelebrate(){
    document.getElementById("celebrateOverlay").classList.remove("show");
  }

  // ==========================================
  // BALLOON SPIEL - Alle 10 Farben + Celebration
  // ==========================================
  let balloonInt = null;
  let balloonTarget = null;
  let balloonScore = 0;
  let balloonOrder = [];
  let balloonIdx = 0;

  function stopBalloonGame(){
    if(balloonInt){ clearInterval(balloonInt); balloonInt = null; }
    const area = document.getElementById("balloonArea");
    if(area){ area.querySelectorAll(".balloon").forEach(b=>b.remove()); }
  }

  function updateBalloonTask(){
    if(!balloonTarget) return;
    const word = (state.lang === "uz") ? balloonTarget.uz : balloonTarget.en;
    document.getElementById("balloonTask").innerText = T("balloonTaskPrefix") + word;
  }

  function updateBalloonScore(){
    document.getElementById("balloonScore").innerText = T("balloonScoreLabel") + " " + balloonScore + T("balloonOf");
  }

  function finishBalloonGame(){
    stopBalloonGame();
    state.games.gBalloon = true;
    save();
    updateBadges();
    celebrate("balloonWinTitle", "balloonWinText", "balloonWinEmoji");
  }

  function startBalloonGame(){
    stopBalloonGame();

    // Alle 10 Farben in zufaelliger Reihenfolge
    balloonOrder = shuffle(items.map(x=>x.k));
    balloonIdx = 0;
    balloonScore = 0;
    updateBalloonScore();

    balloonTarget = items.find(x=>x.k===balloonOrder[balloonIdx]);
    updateBalloonTask();

    document.getElementById("balloonArea").querySelectorAll(".balloon").forEach(b=>b.remove());

    // SCHNELLER: 650ms statt 1400ms, Ballons steigen in 3.5s
    balloonInt = setInterval(() => {
      const item = items[Math.floor(Math.random()*items.length)];

      const b = document.createElement("div");
      b.className = "balloon";
      b.style.background = item.hex;
      b.dataset.k = item.k;
      b.style.left = (Math.random() * 72 + 4) + "%";

      const shine = document.createElement("div");
      shine.className = "balloon-shine";
      b.appendChild(shine);

      b.style.animationDuration = (2.8 + Math.random() * 1.5) + "s";

      b.onpointerdown = () => {
        if(b.classList.contains("popped")) return;

        if(item.k === balloonTarget.k){
          b.classList.add("popped");
          b.innerHTML = "⭐";
          b.style.background = "var(--good)";
          b.style.borderColor = "var(--good)";
          beepSuccess();

          balloonIdx++;
          balloonScore++;
          updateBalloonScore();

          if(balloonIdx >= balloonOrder.length){
            finishBalloonGame();
          } else {
            balloonTarget = items.find(x=>x.k===balloonOrder[balloonIdx]);
            setTimeout(()=>updateBalloonTask(), 300);
          }
        } else {
          b.classList.add("popped");
          b.innerHTML = "💥";
          b.style.background = "var(--bad)";
          b.style.borderColor = "var(--bad)";
          beepFail();
        }
      };

      document.getElementById("balloonArea").appendChild(b);
      setTimeout(()=>{ if(b.parentNode) b.remove(); }, 5500);
    }, 650);
  }

  // ==========================================
  // PICK THE NAME - Alle 10 Farben + Celebration
  // ==========================================
  let nameOrder = [];
  let nameIdx = 0;

  function updateNameProgress(){
    document.getElementById("nameProgress").innerText = nameIdx + T("nameProgress");
  }

  function finishNameGame(){
    state.games.g4 = true;
    save();
    updateBadges();
    celebrate("nameWinTitle", "nameWinText", "nameWinEmoji");
  }

  function startNameGame(){
    const grid=document.getElementById("nameGrid");
    const task=document.getElementById("nameTask");
    const preview=document.getElementById("namePreview");
    if(!grid || !task || !preview) return;

    // Alle 10 Farben in zufaelliger Reihenfolge
    if(nameIdx === 0){
      nameOrder = shuffle(items.map(x=>x.k));
    }

    if(nameIdx >= nameOrder.length){
      // Alle fertig - neustarten
      nameIdx = 0;
      nameOrder = shuffle(items.map(x=>x.k));
    }

    updateNameProgress();
    grid.innerHTML="";
    task.innerText = T("hintName");

    const target = items.find(x=>x.k===nameOrder[nameIdx]);
    preview.style.background = target.hex;

    const opts = new Set([target.k]);
    while(opts.size < 4){ opts.add(items[Math.floor(Math.random()*items.length)].k); }

    shuffle([...opts]).forEach(optKey=>{
      const optItem = items.find(x=>x.k===optKey);
      const b=document.createElement("button");
      b.className="choiceBtn";
      b.innerText = (state.lang==="uz") ? optItem.uz : optItem.en;
      b.onclick=()=>{
        if(optKey===target.k){
          b.classList.add("good"); beepSuccess();
          nameIdx++;
          updateNameProgress();

          if(nameIdx >= nameOrder.length){
            grid.innerHTML="";
            preview.style.background = "#E5E7EB";
            finishNameGame();
          } else {
            setTimeout(()=>{
              if(document.getElementById("panel-name").classList.contains("show")){
                startNameGame();
              }
            }, 500);
          }
        }else{
          b.classList.add("bad"); beepFail();
          setTimeout(()=>b.classList.remove("bad"), 300);
        }
      };
      grid.appendChild(b);
    });
  }

  (function init(){
    load();
    document.getElementById("btn-uz").classList.toggle("active", state.lang==="uz");
    document.getElementById("btn-en").classList.toggle("active", state.lang==="en");
    updateAllTexts();
    renderVocab();
    updateProgress();
  })();
</script>
</body>
</html>
