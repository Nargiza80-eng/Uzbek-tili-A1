<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>2-dars: Sonlar (1–10)</title>

  <link rel="stylesheet" href="components/header.css">
  <script src="components/header.js" defer></script>

  <style>
    :root{
      --bg:#FFF6E8;
      --panel:#FFFFFF;
      --ink:#1F2937;
      --muted:#6B7280;
      --blue:#2F6BFF;
      --blueDark:#1E4ED8;
      --accent2:#22C55E;
      --yellow:#FACC15;
      --gold:#F59E0B;
      --good:#22C55E;
      --bad:#EF4444;
      --shadow:0 16px 34px rgba(0,0,0,0.10);
      --shadowSoft:0 10px 22px rgba(0,0,0,0.10);
      --rBig:30px;
      --r:22px;
    }

    *{box-sizing:border-box; touch-action:manipulation;}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 14px;
      -webkit-user-select:none;
      user-select:none;
    }
    .app{
      width:100%;
      max-width:520px;
      margin:0 auto;
    }

    .menuWrap{
      margin-top:14px;
      background:#F5F2E8;
      border-radius:var(--rBig);
      padding:14px;
      box-shadow:var(--shadowSoft);
    }
    .menu{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }
    .menuBtn{
      height:86px;
      border-radius:24px;
      border:none;
      cursor:pointer;
      font-weight:1000;
      font-size:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      box-shadow:var(--shadowSoft);
      background:#fff;
      color:var(--blue);
      position:relative;
    }
    .menuBtn.primary{
      background:var(--blue);
      color:#fff;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.18), var(--shadowSoft);
    }
    .menuBtn:active{transform:scale(0.98);}
    .menuEmoji{font-size:30px}

    @media(max-width:560px){
      .menuBtn{font-size:24px;height:82px;}
    }

    .panel{
      margin-top:16px;
      background:#fff;
      border-radius:var(--rBig);
      box-shadow:var(--shadowSoft);
      padding:16px;
      display:none;
    }
    .panel.show{display:block;}

    .panelTitle{
      margin:0 0 10px;
      font-weight:1000;
      font-size:22px;
      color:#111827;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .card{
      background:#fff;
      border-radius:var(--rBig);
      box-shadow:var(--shadowSoft);
      padding:14px;
      position:relative;
      min-height:160px;
      overflow:hidden;
    }
    .numCircle{
      width:54px;height:54px;
      border-radius:50%;
      background:#EEF2FF;
      color:var(--blueDark);
      display:flex;align-items:center;justify-content:center;
      font-weight:1000;
      font-size:22px;
    }
    .word{
      font-size:28px;
      font-weight:1000;
      margin-top:12px;
    }
    .stars{
      margin-top:10px;
      font-size:18px;
      font-weight:1000;
      letter-spacing:2px;
      color:var(--gold);
      min-height:22px;
    }
    .speaker{
      position:absolute;
      right:14px;
      top:54px;
      width:86px;height:86px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      background:var(--yellow);
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.14), var(--shadowSoft);
      display:flex;align-items:center;justify-content:center;
      font-size:34px;
    }
    .speaker:active{transform:scale(0.95);}

    .hint{
      text-align:center;
      color:var(--muted);
      font-weight:900;
      margin:6px 0 0;
    }

    /* DRAG & DROP MATCHING */
    .matchingBox{
      display:flex;
      gap:12px;
      margin-top:14px;
      min-height:300px;
    }
    .col{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .dragItem{
      padding:16px;
      background:#F8FAFC;
      border:3px solid #E5E7EB;
      border-radius:18px;
      text-align:center;
      cursor:grab;
      font-weight:1000;
      font-size:26px;
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      transition:all 0.2s;
      touch-action:none;
      position:relative;
      z-index:10;
    }
    .dragItem.dragging{
      opacity:0.8;
      transform:scale(1.05);
      z-index:1000;
      position:fixed;
      pointer-events:none;
      box-shadow:0 20px 40px rgba(0,0,0,0.3);
    }
    .dragItem.matched{
      background:var(--good);
      color:#fff;
      border-color:var(--good);
      opacity:0.5;
      cursor:default;
      pointer-events:none;
    }
    .dropZone{
      padding:16px;
      border:3px dashed var(--blue);
      border-radius:18px;
      text-align:center;
      min-height:60px;
      font-weight:1000;
      font-size:20px;
      background:#fff;
      transition:all 0.2s;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    .dropZone.drag-over{
      background:#EEF2FF;
      border-style:solid;
      border-width:4px;
      transform:scale(1.02);
    }
    .dropZone.matched{
      background:var(--good)!important;
      color:#fff;
      border-color:var(--good)!important;
      border-style:solid;
      pointer-events:none;
    }
    .dropZone.bad{
      animation:shake 0.5s;
      background:#FEF2F2;
    }

    @keyframes shake{
      0%,100%{transform:translateX(0);}
      20%,60%{transform:translateX(-10px);}
      40%,80%{transform:translateX(10px);}
    }

    /* Counting */
    #emojiArea{font-size:42px;letter-spacing:8px;margin:16px 0;text-align:center;min-height:64px;}
    .choiceRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;}
    .choiceBtn{
      padding:14px 22px;
      border:2px solid #E5E7EB;
      background:#fff;
      border-radius:18px;
      cursor:pointer;
      font-weight:1000;
      font-size:18px;
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      min-width:88px;
      text-align:center;
    }
    .choiceBtn.good{background:var(--good);color:#fff;border-color:var(--good);}
    .choiceBtn.bad{background:var(--bad);color:#fff;border-color:var(--bad);}

    /* Balloons */
    #balloonArea{
      position:relative;
      width:100%;
      height:350px;
      background:linear-gradient(#3b82f6, #0ea5ff);
      border-radius:30px;
      border:8px solid white;
      overflow:hidden;
      margin-top:10px;
    }
    .balloon{
      position:absolute;
      width:70px;
      height:90px;
      background:rgba(255,255,255,0.95);
      border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 4px 8px rgba(0,0,0,0.2);
      animation:floatUp 5s linear forwards;
      user-select:none;
      touch-action:manipulation;
    }
    .balloon::after{
      content:'';
      position:absolute;
      bottom:-15px;
      left:50%;
      width:2px;
      height:15px;
      background:rgba(255,255,255,0.6);
      transform:translateX(-50%);
    }
    @keyframes floatUp{
      0%{transform:translateY(400px);}
      100%{transform:translateY(-100px);}
    }
    .balloon.pop{
      animation:pop 0.3s forwards;
    }
    @keyframes pop{
      0%{transform:scale(1);}
      50%{transform:scale(1.3);}
      100%{transform:scale(0);opacity:0;}
    }

    .btnRow{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .btn{
      border:none;
      border-radius:18px;
      padding:14px 18px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:var(--shadowSoft);
      min-width:190px;
      font-size:18px;
    }
    .btn.primary{
      background:var(--blue);
      color:#fff;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.18), var(--shadowSoft);
    }
    .btn.soft{
      background:#fff;
      color:var(--blueDark);
      border:2px solid #E5E7EB;
    }

    .badge{
      font-size:14px;
      font-weight:1000;
      padding:6px 12px;
      border-radius:999px;
      background:#EEF2FF;
      color:var(--blueDark);
    }
    .badge.done{background:#ECFDF5;color:var(--good);}
  </style>
</head>

<body>

  <div id="lessonHeader"></div>

  <div class="app">

    <div class="menuWrap">
      <div class="menu">
        <button class="menuBtn primary" onclick="openSection('learn')">
          <span class="menuEmoji">📘</span><span id="btnLearn">O'rganish</span>
        </button>
        <button class="menuBtn" onclick="openSection('count')">
          <span class="menuEmoji">🍎</span><span id="btnCount">Sanab ko'r</span>
        </button>
        <button class="menuBtn" onclick="openSection('match')">
          <span class="menuEmoji">🔗</span><span id="btnMatch">Juftini top</span>
        </button>
        <button class="menuBtn" onclick="openSection('balloon')">
          <span class="menuEmoji">🎈</span><span id="btnBalloon">Shariklar</span>
        </button>
      </div>
    </div>

    <!-- O'rganish -->
    <div class="panel" id="panel-learn">
      <div class="panelTitle">📘 <span id="titleLearn">O'rganish</span></div>
      <div class="grid" id="vocabGrid"></div>
    </div>

    <!-- Sanab ko'r -->
    <div class="panel" id="panel-count">
      <div class="panelTitle">🍎 <span id="titleCount">Sanab ko'r</span> <span class="badge" id="g3Status">❓</span></div>
      <p id="hintCount" class="hint">Nechta olma bor?</p>
      <div id="emojiArea"></div>
      <div class="choiceRow" id="countChoices"></div>
      <div class="btnRow">
        <button class="btn primary" onclick="startCountingGame()"><span id="btnStart">Boshlash</span> ▶</button>
        <button class="btn soft" onclick="closePanels()"><span id="btnClose">Yopish</span> ✖</button>
      </div>
    </div>

    <!-- Juftini top - Drag & Drop -->
    <div class="panel" id="panel-match">
      <div class="panelTitle">🔗 <span id="titleMatch">Juftini top</span> <span class="badge" id="g1Status">❓</span></div>
      <p class="hint" id="hintDrag">Raqamni ushlab so'zga olib boring</p>
      <div class="matchingBox">
        <div class="col" id="dragNums"></div>
        <div class="col" id="dropWords"></div>
      </div>
      <div class="btnRow">
        <button class="btn primary" onclick="initMatchingGame()"><span id="btnNew">Yangilash</span> 🔄</button>
        <button class="btn soft" onclick="closePanels()"><span id="btnClose2">Yopish</span> ✖</button>
      </div>
    </div>

    <!-- Shariklar -->
    <div class="panel" id="panel-balloon">
      <div class="panelTitle">🎈 <span id="titleBalloon">Shariklar</span> <span class="badge" id="g4Status">❓</span></div>
      <p id="hintBalloon" class="hint">To'g'ri raqamni top!</p>
      <div id="balloonTask" class="hint" style="font-size:24px;color:var(--blue);margin-bottom:10px;">5</div>
      <div id="balloonArea"></div>
      <div class="btnRow">
        <button class="btn primary" onclick="startBalloonGame()"><span id="btnStart2">Boshlash</span> ▶</button>
        <button class="btn soft" onclick="closePanels()"><span id="btnClose3">Yopish</span> ✖</button>
      </div>
    </div>

  </div>

<script>
  const LESSON_ID = "lesson2_sonlar_v4";

  const items = [
    {k:"21", n:1, uz:"bir", en:"one"},
    {k:"22", n:2, uz:"ikki", en:"two"},
    {k:"23", n:3, uz:"uch", en:"three"},
    {k:"24", n:4, uz:"to'rt", en:"four"},
    {k:"25", n:5, uz:"besh", en:"five"},
    {k:"26", n:6, uz:"olti", en:"six"},
    {k:"27", n:7, uz:"yetti", en:"seven"},
    {k:"28", n:8, uz:"sakkiz", en:"eight"},
    {k:"29", n:9, uz:"to'qqiz", en:"nine"},
    {k:"30", n:10, uz:"o'n", en:"ten"},
  ];

  const UI = {
    uz: {
      learn: "O'rganish", count: "Sanab ko'r", match: "Juftini top", balloon: "Shariklar",
      titleLearn: "O'rganish", titleCount: "Sanab ko'r", titleMatch: "Juftini top", titleBalloon: "Shariklar",
      hintCount: "Nechta olma bor?", hintBalloon: "To'g'ri raqamni top!", hintDrag: "Raqamni ushlab so'zga olib boring",
      btnStart: "Boshlash", btnStart2: "Boshlash", btnClose: "Yopish", btnClose2: "Yopish", btnClose3: "Yopish", btnNew: "Yangilash",
      find: "Top:", wellDone: "Barakalla!"
    },
    en: {
      learn: "Learn", count: "Counting", match: "Matching", balloon: "Balloons",
      titleLearn: "Learn", titleCount: "Counting", titleMatch: "Matching", titleBalloon: "Balloons",
      hintCount: "How many apples?", hintBalloon: "Find the correct number!", hintDrag: "Drag number to word",
      btnStart: "Start", btnStart2: "Start", btnClose: "Close", btnClose2: "Close", btnClose3: "Close", btnNew: "New Game",
      find: "Find:", wellDone: "Well done!"
    }
  };

  let state = {
    lang: "uz",
    stars: {},
    learned: {},
    games: { g1:false, g3:false, g4:false }
  };

  let draggedElement = null;
  let touchOffsetX = 0;
  let touchOffsetY = 0;
  let matchesCorrect = 0;
  let matchesTotal = 0;
  let balloonInterval = null;

  function save(){ localStorage.setItem(LESSON_ID, JSON.stringify(state)); }
  function load(){
    const raw = localStorage.getItem(LESSON_ID);
    if(!raw) return;
    try{
      const s = JSON.parse(raw);
      state.lang = s.lang || "uz";
      state.stars = s.stars || {};
      state.learned = s.learned || {};
      state.games = s.games || {g1:false,g3:false,g4:false};
    }catch(e){}
  }

  function learnedCount(){
    return Object.values(state.learned).filter(Boolean).length;
  }

  function initHeader(){
    renderLessonHeader({
      mountId: "lessonHeader",
      title: state.lang === "uz" ? "2-dars: Sonlar" : "Lesson 2: Numbers",
      total: 10,
      learned: learnedCount(),
      lang: state.lang,
      homeHref: "index.html",
      onBookClick: () => openSection("learn"),
      onLang: (l) => setLang(l)
    });
  }

  function refreshHeader(){
    if (typeof updateHeaderProgress === "function") {
      updateHeaderProgress({ learned: learnedCount(), total: 10 });
    }
  }

  function setLang(l){
    state.lang = l;
    save();
    initHeader();
    updateUI();
    renderVocab();
    
    if(document.getElementById("panel-match").classList.contains("show")){
      initMatchingGame();
    }
    if(document.getElementById("panel-count").classList.contains("show")){
      startCountingGame();
    }
    if(document.getElementById("panel-balloon").classList.contains("show")){
      startBalloonGame();
    }
  }

  function updateUI(){
    const t = UI[state.lang];
    document.getElementById("btnLearn").innerText = t.learn;
    document.getElementById("btnCount").innerText = t.count;
    document.getElementById("btnMatch").innerText = t.match;
    document.getElementById("btnBalloon").innerText = t.balloon;
    document.getElementById("titleLearn").innerText = t.titleLearn;
    document.getElementById("titleCount").innerText = t.titleCount;
    document.getElementById("titleMatch").innerText = t.titleMatch;
    document.getElementById("titleBalloon").innerText = t.titleBalloon;
    document.getElementById("hintCount").innerText = t.hintCount;
    document.getElementById("hintBalloon").innerText = t.hintBalloon;
    document.getElementById("hintDrag").innerText = t.hintDrag;
    document.getElementById("btnStart").innerText = t.btnStart;
    document.getElementById("btnStart2").innerText = t.btnStart2;
    document.getElementById("btnClose").innerText = t.btnClose;
    document.getElementById("btnClose2").innerText = t.btnClose2;
    document.getElementById("btnClose3").innerText = t.btnClose3;
    document.getElementById("btnNew").innerText = t.btnNew;
  }

  function closePanels(){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
    stopBalloonGame();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function openSection(name){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
    stopBalloonGame();

    const panel = document.getElementById("panel-"+name);
    if(panel) panel.classList.add("show");

    if(name==="match"){ initMatchingGame(); }
    if(name==="count"){ startCountingGame(); }
    if(name==="balloon"){ startBalloonGame(); }

    panel?.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function starsText(n){
    n = Math.max(0, Math.min(3, n||0));
    return "★".repeat(n) + "☆".repeat(3-n);
  }

  function updateBadges(){
    const set = (id, done)=>{
      const el = document.getElementById(id);
      el.classList.toggle("done", !!done);
      el.innerText = done ? "✅" : "❓";
    };
    set("g1Status", state.games.g1);
    set("g3Status", state.games.g3);
    set("g4Status", state.games.g4);
  }

  let audioCtx=null;
  function beepSuccess(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type="triangle";
      o.frequency.setValueAtTime(520,t);
      o.frequency.exponentialRampToValueAtTime(880,t+0.12);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }catch(e){}
  }
  function beepFail(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type="sawtooth";
      o.frequency.setValueAtTime(220,t);
      o.frequency.exponentialRampToValueAtTime(140,t+0.14);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }catch(e){}
  }

  function speakWord(key){
    const it = items.find(x=>x.k===key);
    if(!it) return;

    const text = (state.lang==="uz") ? it.uz : it.en;
    const langCode = (state.lang==="uz") ? "uz-UZ" : "en-US";

    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = 0.9;
      u.pitch = 1.0;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}

    state.learned[key]=true;
    state.stars[key]=Math.min(3,(state.stars[key]||0)+1);
    beepSuccess();
    save();

    renderVocab();
    refreshHeader();
  }

  function renderVocab(){
    const grid = document.getElementById("vocabGrid");
    grid.innerHTML = items.map(it=>{
      const word = (state.lang==="uz") ? it.uz : it.en;
      const st = starsText(state.stars[it.k]||0);
      return `
        <div class="card">
          <div class="numCircle">${it.n}</div>
          <div class="word">${word}</div>
          <button class="speaker" onclick="speakWord('${it.k}')" aria-label="speak">🔊</button>
          <div class="stars">${st}</div>
        </div>
      `;
    }).join("");
  }

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  /* ==================== DRAG & DROP MATCHING ==================== */
  
  function initMatchingGame(){
    const nCol = document.getElementById("dragNums");
    const wCol = document.getElementById("dropWords");
    if(!nCol || !wCol) return;

    nCol.innerHTML = "";
    wCol.innerHTML = "";
    draggedElement = null;

    const pool = shuffle(items).slice(0,5);
    matchesCorrect = 0;
    matchesTotal = pool.length;

    // Erstelle Drop-Zonen (rechts)
    const shuffledWords = shuffle([...pool]);
    shuffledWords.forEach(it => {
      const dz = document.createElement("div");
      dz.className = "dropZone";
      dz.innerText = (state.lang === "uz") ? it.uz : it.en;
      dz.dataset.k = it.k;
      dz.dataset.matched = "false";
      
      // Desktop Drag Events
      dz.ondragenter = (e) => {
        e.preventDefault();
        if(dz.dataset.matched === "false") dz.classList.add("drag-over");
      };
      dz.ondragleave = () => dz.classList.remove("drag-over");
      dz.ondragover = (e) => e.preventDefault();
      dz.ondrop = (e) => handleDrop(e, dz);
      
      wCol.appendChild(dz);
    });

    // Erstelle Drag-Elemente (links)
    pool.forEach(it => {
      const d = document.createElement("div");
      d.className = "dragItem";
      d.innerText = it.n;
      d.dataset.k = it.k;
      d.draggable = true;
      
      // Desktop
      d.ondragstart = (e) => {
        draggedElement = d;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", it.k);
        setTimeout(() => d.style.opacity = "0.5", 0);
      };
      d.ondragend = () => {
        d.style.opacity = "1";
        draggedElement = null;
      };
      
      // Touch / Mobile
      d.ontouchstart = (e) => handleTouchStart(e, d);
      d.ontouchmove = (e) => handleTouchMove(e, d);
      d.ontouchend = (e) => handleTouchEnd(e, d);
      
      nCol.appendChild(d);
    });
  }

  function handleDrop(e, dropZone) {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    
    if(dropZone.dataset.matched === "true") return;
    
    const draggedKey = e.dataTransfer.getData("text/plain");
    checkMatch(draggedKey, dropZone);
  }

  function checkMatch(key, dropZone) {
    if(key === dropZone.dataset.k) {
      // Richtig!
      dropZone.dataset.matched = "true";
      dropZone.classList.add("matched");
      dropZone.innerText = "✅ " + dropZone.innerText;
      
      // Finde und markiere das Drag-Element
      const dragEl = document.querySelector(`.dragItem[data-k="${key}"]`);
      if(dragEl) dragEl.classList.add("matched");
      
      matchesCorrect++;
      beepSuccess();
      
      if(matchesCorrect === matchesTotal) {
        state.games.g1 = true;
        save();
        updateBadges();
        setTimeout(() => alert(UI[state.lang].wellDone + "! 🎉"), 300);
      }
    } else {
      // Falsch!
      dropZone.classList.add("bad");
      beepFail();
      setTimeout(() => dropZone.classList.remove("bad"), 500);
    }
  }

  /* ==================== TOUCH HANDLER ==================== */
  
  function handleTouchStart(e, elem) {
    const touch = e.touches[0];
    const rect = elem.getBoundingClientRect();
    touchOffsetX = touch.clientX - rect.left;
    touchOffsetY = touch.clientY - rect.top;
    
    elem.classList.add("dragging");
    draggedElement = elem;
    
    // Positioniere Element unter Finger
    moveAt(touch.clientX, touch.clientY, elem);
  }

  function handleTouchMove(e, elem) {
    e.preventDefault(); // Verhindere Scrollen
    const touch = e.touches[0];
    moveAt(touch.clientX, touch.clientY, elem);
    
    // Visuelles Feedback für Drop-Zonen
    const dropZones = document.querySelectorAll(".dropZone");
    dropZones.forEach(dz => {
      if(dz.dataset.matched === "true") return;
      if(isOverElement(touch.clientX, touch.clientY, dz)) {
        dz.classList.add("drag-over");
      } else {
        dz.classList.remove("drag-over");
      }
    });
  }

  function handleTouchEnd(e, elem) {
    elem.classList.remove("dragging");
    elem.style.position = "";
    elem.style.left = "";
    elem.style.top = "";
    elem.style.width = "";
    elem.style.zIndex = "";
    
    const touch = e.changedTouches[0];
    const dropZones = document.querySelectorAll(".dropZone");
    
    let dropped = false;
    dropZones.forEach(dz => {
      dz.classList.remove("drag-over");
      if(!dropped && dz.dataset.matched === "false" && isOverElement(touch.clientX, touch.clientY, dz)) {
        checkMatch(elem.dataset.k, dz);
        dropped = true;
      }
    });
    
    draggedElement = null;
  }

  function moveAt(x, y, elem) {
    elem.style.position = "fixed";
    elem.style.left = (x - touchOffsetX) + "px";
    elem.style.top = (y - touchOffsetY) + "px";
    elem.style.width = elem.offsetWidth + "px";
    elem.style.zIndex = "1000";
  }

  function isOverElement(x, y, elem) {
    const rect = elem.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  /* ==================== COUNTING GAME ==================== */
  
  function startCountingGame(){
    const area=document.getElementById("emojiArea");
    const choices=document.getElementById("countChoices");
    if(!area || !choices) return;

    choices.innerHTML="";
    const target=Math.floor(Math.random()*10)+1;
    area.innerText="🍎".repeat(target);

    const opts=new Set([target]);
    while(opts.size<4) opts.add(Math.floor(Math.random()*10)+1);

    shuffle([...opts]).forEach(opt=>{
      const b=document.createElement("button");
      b.className="choiceBtn";
      b.innerText=opt;

      b.onclick=()=>{
        if(opt===target){
          b.classList.add("good");
          beepSuccess();
          state.games.g3=true;
          save();
          updateBadges();
          setTimeout(startCountingGame, 750);
        }else{
          b.classList.add("bad");
          beepFail();
          setTimeout(()=>b.classList.remove("bad"), 240);
        }
      };
      choices.appendChild(b);
    });
  }

  /* ==================== BALLOON GAME ==================== */
  
  function stopBalloonGame(){
    if(balloonInterval){
      clearInterval(balloonInterval);
      balloonInterval = null;
    }
  }

  function startBalloonGame(){
    stopBalloonGame();
    const area = document.getElementById("balloonArea");
    const task = document.getElementById("balloonTask");
    if(!area || !task) return;

    area.innerHTML = "";
    let balloonScore = 0;
    const balloonNeeded = 5;
    
    const targetItem = items[Math.floor(Math.random() * items.length)];
    let currentTarget = targetItem.n;
    task.innerText = UI[state.lang].find + " " + 
                     ((state.lang === "uz") ? targetItem.uz : targetItem.en);

    balloonInterval = setInterval(() => {
      const b = document.createElement("div");
      b.className = "balloon";
      
      const randomItem = items[Math.floor(Math.random() * items.length)];
      b.innerText = randomItem.n;
      b.dataset.n = randomItem.n;
      
      b.style.left = (Math.random() * 75 + 5) + '%';
      b.style.animationDuration = (4 + Math.random() * 2) + 's';

      b.onclick = () => {
        if(parseInt(b.dataset.n) === currentTarget){
          b.classList.add("pop");
          beepSuccess();
          balloonScore++;
          
          if(balloonScore >= balloonNeeded){
            stopBalloonGame();
            state.games.g4 = true;
            save();
            updateBadges();
            task.innerText = "🎉 " + UI[state.lang].wellDone + "!";
          } else {
            const newTarget = items[Math.floor(Math.random() * items.length)];
            currentTarget = newTarget.n;
            task.innerText = UI[state.lang].find + " " + 
                             ((state.lang === "uz") ? newTarget.uz : newTarget.en);
          }
        } else {
          beepFail();
          b.style.background = "#ffcccc";
        }
      };

      area.appendChild(b);
      setTimeout(() => b.remove(), 6000);
    }, 1400);
  }

  /* ==================== INIT ==================== */
  
  document.addEventListener("DOMContentLoaded", () => {
    load();
    updateUI();
    initHeader();
    renderVocab();
    updateBadges();
    refreshHeader();
  });
</script>
