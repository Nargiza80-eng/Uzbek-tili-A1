<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>2-dars: Sonlar (1–10)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ===== HEADER (animiert - INLINE) ===== */
    .dono-header {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 14px 0 rgba(0,0,0,0.08);
      border: 4px solid #fff;
      overflow: hidden;
      position: relative;
    }
    .dono-header .content {
      position: relative;
      z-index: 2;
      padding: 14px;
    }
    .dono-header .top-row {
      display: grid;
      grid-template-columns: 88px 1fr 88px;
      align-items: center;
      gap: 10px;
    }
    .dono-header .topIcon {
      width: 82px;
      height: 82px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 62px;
      line-height: 1;
      user-select: none;
      text-decoration: none;
    }
    .dono-header .topIcon:active { transform: translateY(2px) scale(0.98); }
    .dono-header .titleWrap {
      min-width: 0;
      text-align: center;
    }
    .dono-header .title {
      margin: 0;
      font-size: 34px;
      font-weight: 1000;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1f2937;
    }
    .dono-header .sub {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 1000;
      color: rgba(31,41,55,0.65);
    }
    .dono-header .progress-track {
      height: 18px;
      background: rgba(255,255,255,0.65);
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 4px 0;
      box-shadow: inset 0 2px 0 rgba(0,0,0,0.06);
      border: 2px solid rgba(255,255,255,0.7);
    }
    .dono-header .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #34d399);
      transition: width 0.45s ease;
    }
    .dono-header .mini {
      text-align: center;
      margin-top: 10px;
      font-size: 20px;
      font-weight: 1000;
      color: #111827;
    }
    .dono-header .langRow {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
    }
    .dono-header .langBtn {
      width: 118px;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 1000;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: rgba(255,255,255,0.70);
      color: #1e4ed8;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }
    .dono-header .langBtn.active {
      background: #2f6bff;
      color: #fff;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.10);
    }
    .dono-header .sky {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 214, 102, 0.78) 0%, rgba(255, 214, 102, 0.0) 58%),
        linear-gradient(180deg, #7DD3FC 0%, #A5F3FC 45%, #FFF6E8 100%);
    }
    .dono-header .sun {
      position: absolute;
      left: -30px;
      top: -35px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFF7C2 0%, #FFD400 45%, #FFB300 100%);
      box-shadow: 0 18px 35px rgba(255,179,0,0.35);
      animation: sunBob 4s ease-in-out infinite;
    }
    @keyframes sunBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(6px) rotate(1.5deg); }
    }
    .dono-header .sun::before {
      content: "";
      position: absolute;
      inset: -58px;
      border-radius: 50%;
      background: repeating-conic-gradient(from -10deg, rgba(255,214,0,0.0) 0deg 10deg, rgba(255,214,0,0.32) 10deg 14deg);
      opacity: 0.65;
      animation: raysSpin 18s linear infinite;
    }
    @keyframes raysSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .dono-header .cloud {
      position: absolute;
      width: 170px;
      height: 58px;
      background: rgba(255,255,255,0.90);
      border-radius: 999px;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.08));
    }
    .dono-header .cloud::before,
    .dono-header .cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.90);
      border-radius: 50%;
    }
    .dono-header .cloud::before {
      width: 74px; height: 74px;
      left: 18px; top: -30px;
    }
    .dono-header .cloud::after {
      width: 96px; height: 96px;
      left: 62px; top: -44px;
    }
    .dono-header .c1 { top: 22px; left: 120px; opacity: 0.95; animation: cloudMove1 70s linear infinite; }
    .dono-header .c2 { top: 78px; left:  20px; opacity: 0.85; transform: scale(0.9);  animation: cloudMove2 95s linear infinite; }
    .dono-header .c3 { top: 45px; left: 420px; opacity: 0.80; transform: scale(1.05); animation: cloudMove3 120s linear infinite; }
    @keyframes cloudMove1 { from { transform: translateX(-320px); } to { transform: translateX(1400px); } }
    @keyframes cloudMove2 { from { transform: translateX(1200px) scale(0.9); } to { transform: translateX(-340px) scale(0.9); } }
    @keyframes cloudMove3 { from { transform: translateX(-640px) scale(1.05); } to { transform: translateX(1000px) scale(1.05); } }
    .dono-header .sparkle {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.25);
      animation: twinkle 3.2s ease-in-out infinite;
    }
    .dono-header .s1 { top: 26px; right: 120px; animation-delay: 0.2s; }
    .dono-header .s2 { top: 60px; right:  70px; animation-delay: 1.1s; }
    .dono-header .s3 { top: 34px; right: 180px; animation-delay: 1.9s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50%     { transform: scale(1.15); opacity: 1; }
    }
    @media (max-width: 560px) {
      .dono-header { max-width: 520px; border-radius: 26px; }
      .dono-header .title { font-size: 30px; }
      .dono-header .topIcon { width: 74px; height: 74px; font-size: 58px; }
      .dono-header .top-row { grid-template-columns: 78px 1fr 78px; }
      .dono-header .langBtn { width: 108px; padding: 9px 0; font-size: 15px; }
    }

    :root{
      --bg:#eaf6ff;
      --bg2:#fff2cc;
      --primary:#0066ff;
      --success:#00c853;
      --error:#ff2d55;
      --sun:#ffcc00;
      --shadowSoft:#cfe3ff;
      --shadowBtn:#b8c2cc;
      --radius:25px;
    }

    *{box-sizing:border-box; touch-action:manipulation; font-style:normal; margin:0; padding:0;}
    body{
      margin:0;
      font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Quicksand', sans-serif;
      background:linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%, #fff 100%);
      color:#2d3436;
      padding:12px;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    .app{
      width:100%;
      max-width:520px;
      margin:0 auto;
      overflow-x:hidden;
    }

    /* ===== MENÜ BUTTONS (wie Lesson 1: 3 oben, 2 unten) ===== */
    .mode-nav{
      display:flex;
      gap:10px;
      margin-top:14px;
      margin-bottom:14px;
      width:100%;
      max-width:520px;
      flex-wrap:wrap;
    }
    .mode-btn{
      flex:1;
      padding:14px 10px;
      border-radius:18px;
      border:none;
      background:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 5px 0 var(--shadowBtn);
      font-size:15px;
      min-width:140px;
      white-space:nowrap;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      transition:all 0.15s ease;
    }
    .mode-btn.active{
      background:var(--primary);
      color:#fff;
      box-shadow:0 5px 0 #0047b3;
    }
    .mode-btn:active{
      transform:translateY(3px);
      box-shadow:0 2px 0 var(--shadowBtn);
    }
    .mode-btn.active:active{
      transform:translateY(3px);
      box-shadow:0 2px 0 #0047b3;
    }
    .mode-ico{font-size:28px; line-height:1;}

    /* ===== CELEBRATION OVERLAY ===== */
    .celebrate-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      z-index:2000;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .celebrate-overlay.show{display:flex;}
    .celebrate-card{
      width:100%;
      max-width:420px;
      background:#fff;
      border-radius:30px;
      padding:32px 24px;
      text-align:center;
      box-shadow:0 14px 0 rgba(0,0,0,0.12);
      position:relative;
      overflow:hidden;
    }
    .celebrate-emoji{font-size:64px; margin-bottom:8px;}
    .celebrate-title{font-size:26px; font-weight:900; color:#1F2937;}
    .celebrate-text{color:#6B7280; font-weight:700; margin-top:10px; font-size:16px;}
    .celebrate-btn{
      margin-top:20px;
      width:100%;
      padding:14px;
      border-radius:18px;
      border:none;
      background:#22C55E;
      color:#fff;
      font-weight:900;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 6px 0 #09725b;
    }
    .celebrate-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #09725b;}
    .confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
    .confetti-dot{
      position:absolute;
      width:10px; height:10px;
      border-radius:50%;
      animation:fall 2.2s linear forwards;
    }
    @keyframes fall{
      0%{transform:translateY(-20px) rotate(0deg);}
      100%{transform:translateY(560px) rotate(360deg); opacity:0.9;}
    }

    @media(max-width:360px){
      .mode-btn{font-size:13px; padding:12px 6px; gap:6px; min-width:100px;}
      .mode-ico{font-size:22px;}
      .mode-nav{gap:8px;}
    }

    .panel{
      margin-top:16px;
      display:none;
    }
    .panel.show{display:block;}

    /* LERN-KARTEN */
    .learn-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }
    .learn-card{
      background:#fff;
      border-radius:var(--radius);
      padding:20px;
      display:flex;
      align-items:center;
      gap:16px;
      box-shadow:0 8px 0 var(--shadowSoft);
      border:3px solid #fff;
    }
    .numCircle{
      width:70px;
      height:70px;
      border-radius:50%;
      background:#EEF2FF;
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:32px;
      flex-shrink:0;
      box-shadow:0 4px 0 #dbe4ff;
    }
    .numEmoji{
      font-size:20px;
      margin-left:4px;
    }
    .learn-info{
      text-align:left;
      flex:1;
      min-width:0;
    }
    .learn-main{
      font-weight:800;
      font-size:22px;
      color:#2d3436;
      word-break:break-word;
    }
    .learn-sub{
      color:#636e72;
      font-size:14px;
      margin-top:4px;
      word-break:break-word;
    }
    .stars{
      margin-top:10px;
      font-weight:800;
      color:#f39c12;
      font-size:18px;
    }
    .btn-audio{
      background:var(--sun);
      border:none;
      width:70px;
      height:70px;
      border-radius:50%;
      font-size:28px;
      cursor:pointer;
      box-shadow:0 6px 0 #cc7a00;
      flex-shrink:0;
    }
    .btn-audio:active{
      transform:translateY(3px);
      box-shadow:0 3px 0 #cc7a00;
    }

    @media(max-width:375px){
      .numCircle{width:60px;height:60px;font-size:28px;}
      .numEmoji{font-size:16px;}
      .learn-main{font-size:20px;}
      .learn-sub{font-size:13px;}
      .btn-audio{width:60px;height:60px;font-size:24px;}
      .mode-btn{font-size:13px; min-width:140px; padding:12px 8px;}
      .mode-ico{font-size:24px;}
    }

    @media(min-width:414px){
      .mode-btn{font-size:16px; padding:16px 12px;}
      .learn-main{font-size:24px;}
    }

    /* Matching */
    .matchingBox{
      display:flex;
      gap:12px;
      margin-top:14px;
      min-height:300px;
    }
    .col{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }
    .dragItem{
      padding:16px;
      background:#F8FAFC;
      border:3px solid #E5E7EB;
      border-radius:18px;
      text-align:center;
      cursor:grab;
      font-weight:900;
      font-size:clamp(20px, 5vw, 28px);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      touch-action:none;
      position:relative;
      word-break:break-word;
    }
    .dragItem.dragging{
      position:fixed;
      z-index:1000;
      opacity:0.9;
      transform:scale(1.1);
      box-shadow:0 20px 40px rgba(0,0,0,0.3);
    }
    .dragItem.matched{
      background:var(--success);
      color:#fff;
      border-color:var(--success);
      opacity:0.5;
      pointer-events:none;
    }
    .dragEmoji{
      font-size:16px;
      margin-left:4px;
    }
    .dropZone{
      padding:16px;
      border:3px dashed var(--primary);
      border-radius:18px;
      text-align:center;
      min-height:60px;
      font-weight:900;
      font-size:clamp(16px, 4.5vw, 20px);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      word-break:break-word;
    }
    .dropZone.drag-over{
      background:#EEF2FF;
      border-style:solid;
      border-width:4px;
    }
    .dropZone.matched{
      background:var(--success)!important;
      color:#fff;
      border-color:var(--success)!important;
    }
    .dropZone.bad{
      animation:shake 0.5s;
      background:#FEF2F2;
    }

    @keyframes shake{
      0%,100%{transform:translateX(0);}
      20%,60%{transform:translateX(-10px);}
      40%,80%{transform:translateX(10px);}
    }

    /* Counting */
    .quiz-card{
      background:#fff;
      border-radius:30px;
      padding:28px;
      box-shadow:0 10px 0 var(--shadowSoft);
      text-align:center;
    }
    .quiz-emoji{
      font-size:clamp(50px, 15vw, 80px);
      margin:10px 0;
      word-break:break-all;
    }
    .choiceRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-top:20px;
    }
    .choiceBtn{
      padding:16px 24px;
      border:3px solid #E5E7EB;
      background:#fff;
      border-radius:20px;
      cursor:pointer;
      font-weight:900;
      font-size:20px;
      box-shadow:0 8px 0 #E5E7EB;
      min-width:80px;
    }
    .choiceBtn:active{
      transform:translateY(4px);
      box-shadow:0 4px 0 #E5E7EB;
    }
    .choiceBtn.good{
      background:var(--success);
      color:#fff;
      border-color:var(--success);
      box-shadow:0 4px 0 #09725b;
    }
    .choiceBtn.bad{
      background:var(--error);
      color:#fff;
      border-color:var(--error);
    }
    .option-btn{
      padding:12px 20px;
      border:3px solid #f39c12;
      background:var(--sun);
      border-radius:18px;
      cursor:pointer;
      font-weight:900;
      font-size:18px;
      box-shadow:0 6px 0 #cc7a00;
      margin:8px 0;
    }
    .option-btn:active{
      transform:translateY(3px);
      box-shadow:0 3px 0 #cc7a00;
    }

    /* Balloons */
    #balloonArea{
      position:relative;
      width:100%;
      height:350px;
      background:linear-gradient(#3b82f6, #0ea5ff);
      border-radius:30px;
      border:8px solid #fff;
      overflow:hidden;
      margin-top:10px;
    }
    .balloon{
      position:absolute;
      width:clamp(50px, 15vw, 70px);
      height:clamp(65px, 20vw, 90px);
      background:rgba(255,255,255,0.95);
      border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(20px, 6vw, 28px);
      font-weight:900;
      cursor:pointer;
      box-shadow:0 4px 8px rgba(0,0,0,0.2);
      animation:floatUp 4s linear forwards;
    }
    .balloon::after{
      content:'';
      position:absolute;
      bottom:-15px;
      left:50%;
      width:2px;
      height:15px;
      background:rgba(255,255,255,0.6);
      transform:translateX(-50%);
    }
    @keyframes floatUp{
      0%{transform:translateY(400px);}
      100%{transform:translateY(-100px);}
    }
    .balloon.pop{
      animation:pop 0.3s forwards;
    }
    @keyframes pop{
      0%{transform:scale(1);}
      50%{transform:scale(1.3);}
      100%{transform:scale(0);opacity:0;}
    }

    .btnRow{
      margin-top:20px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .btn{
      border:none;
      border-radius:20px;
      padding:16px 24px;
      font-weight:900;
      cursor:pointer;
      font-size:clamp(16px, 4vw, 18px);
      box-shadow:0 8px 0 var(--shadowBtn);
      word-break:break-word;
    }
    .btn:active{
      transform:translateY(4px);
      box-shadow:0 4px 0 var(--shadowBtn);
    }
    .btn.primary{
      background:var(--primary);
      color:#fff;
      box-shadow:0 8px 0 #0047b3;
    }
    .btn.primary:active{
      box-shadow:0 4px 0 #0047b3;
    }
    .btn.soft{
      background:#fff;
      color:var(--primary);
      border:3px solid #E5E7EB;
    }

    .hint{
      text-align:center;
      color:#636e72;
      font-weight:700;
      font-size:clamp(16px, 4.5vw, 18px);
      margin:10px 0;
      word-break:break-word;
    }
    #balloonTask{
      font-size:clamp(20px, 6vw, 26px);
      color:var(--primary);
      font-weight:900;
      word-break:break-word;
    }

    .badge{
      font-size:14px;
      font-weight:900;
      padding:6px 12px;
      border-radius:999px;
      background:#EEF2FF;
      color:var(--primary);
      margin-left:10px;
    }
    .badge.done{background:#ECFDF5;color:var(--success);}

    /* --- STICKER ALBUM (wie lesson1) --- */
    .album-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 3000; justify-content: center; align-items: center;
    }
    .album-content {
      background: white; padding: 26px; border-radius: 30px; text-align: center;
      width: 85%; max-width: 420px;
    }
    .sticker-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px;
    }
    .sticker-slot {
      width: 60px; height: 60px; background: #eee; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; margin: 0 auto;
      opacity: 0.35; filter: grayscale(1);
      border: 2px dashed #bbb;
    }
    .sticker-slot.unlocked {
      opacity: 1; filter: none; background: #fff9e6; border: 3px solid #f59e0b;
    }
  </style>
<base target="_blank">
</head>

<body>

  <!-- CELEBRATION OVERLAY -->
  <div class="celebrate-overlay" id="celebrateOverlay">
    <div class="celebrate-card">
      <div class="confetti" id="confetti"></div>
      <div class="celebrate-emoji" id="celebrateEmoji">🎉</div>
      <div class="celebrate-title" id="celebrateTitle">Barakalla!</div>
      <div class="celebrate-text" id="celebrateText">Zo'r!</div>
      <button class="celebrate-btn" onclick="closeCelebrate()">OK ✅</button>
    </div>
  </div>


  <!-- Album Overlay (wie lesson1, vom Header-Buch-Button) -->
  <div id="albumOverlay" class="album-overlay" onclick="toggleAlbum()">
    <div class="album-content" onclick="event.stopPropagation()">
      <h3 id="albumTitle" style="margin-top:0;">Mening Stikerlarim</h3>
      <div class="sticker-grid">
        <div id="stk_1" class="sticker-slot">🐣</div>
        <div id="stk_2" class="sticker-slot">🦊</div>
        <div id="stk_3" class="sticker-slot">🦋</div>
        <div id="stk_4" class="sticker-slot">🐢</div>
      </div>
      <br>
      <button class="btn primary" onclick="toggleAlbum()" id="closeAlbumBtn" style="width:100%;">Yopish</button>
    </div>
  </div>

  <!-- HEADER (wie Lesson 3/4 – direkt im HTML, kein header.js) -->
  <div class="dono-header" data-total="10" data-lang="uz">
    <div class="sky">

  /* ===== CELEBRATION ===== */

      "memWinEmoji":"🎉", "connWinEmoji":"🎉",

    const textText  = (UI[state.lang] && UI[state.lang][textKey])  ? UI[state.lang][textKey]  : textKey;

      const d = document.createElement("div");

    document.getElementById("celebrateOverlay").classList.remove("show");

  function starsText(n){
    n = Math.max(0, Math.min(3, n||0));
    return "★".repeat(n) + "☆".repeat(3-n);
  }

  function updateBadges(){
    const set = (id, done)=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.toggle("done", !!done);
      el.innerText = done ? "✅" : "❓";
    };
    set("g1Status", state.games.g1);
    set("g4Status", state.games.g4);
    set("g5Status", quizDone.length >= items.length);
  }

  /* ===== AUDIO ===== */
  function resumeAudio(){
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function beepSuccess(){
    try{
      resumeAudio();
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type="triangle";
      o.frequency.setValueAtTime(520,t);
      o.frequency.exponentialRampToValueAtTime(880,t+0.12);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }catch(e){}
  }

  function beepFail(){
    try{
      resumeAudio();
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type="sawtooth";
      o.frequency.setValueAtTime(220,t);
      o.frequency.exponentialRampToValueAtTime(140,t+0.14);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }catch(e){}
  }

  // ===== AUDIO MIT ECHTEN MP3 DATEIEN =====
  // Pfade: audio/lesson2/uz/bir.mp3, audio/lesson2/en/one.mp3
  // WICHTIG: Dateinamen muessen EXAKT mit GitHub uebereinstimmen!
  // Deine UZ-Dateien: un.mp3 (nicht on.mp3), turt.mp3 (nicht tort.mp3), tuqqiz.mp3

  // Mapping von Wort zu MP3-Dateiname (exakt wie auf GitHub)
  const UZ_AUDIO_MAP = {
    "bir": "bir", "ikki": "ikki", "uch": "uch",
    "to'rt": "turt", "besh": "besh", "olti": "olti",
    "yetti": "yetti", "sakkiz": "sakkiz",
    "to'qqiz": "tuqqiz", "o'n": "un"
  };
  const EN_AUDIO_MAP = {
    "one": "one", "two": "two", "three": "three",
    "four": "four", "five": "five", "six": "six",
    "seven": "seven", "eight": "eight",
    "nine": "nine", "ten": "ten"
  };

  function sanitizeForFilename(word){
    return word.toLowerCase().replace(/['']/g, "").replace(/\s+/g, "_");
  }

  // Versuche verschiedene Basis-URLs (lokal zuerst, dann GitHub)
  const AUDIO_BASE_URLS = [
    "",                          // Lokal (relativer Pfad)
    "https://nargiza80-eng.github.io/Uzbek-tili-A1"  // GitHub Pages
  ];

  const audioCache = {};

  function buildAudioPath(key){
    const it = items.find(x=>x.k===key);
    if(!it) return null;
    const text = getWord(it);
    const langFolder = (state.lang==="uz") ? "uz" : "en";
    // Exaktes Mapping verwenden (damit Apostrophe korrekt behandelt werden)
    const map = (state.lang==="uz") ? UZ_AUDIO_MAP : EN_AUDIO_MAP;
    const fileName = map[text] || sanitizeForFilename(text);
    return `audio/lesson2/${langFolder}/${fileName}.mp3`;
  }

  function tryPlayAudio(path, attemptIndex, fallbackText){
    if(attemptIndex >= AUDIO_BASE_URLS.length){
      // Alle URLs versucht - Fallback auf SpeechSynthesis
      console.log("Alle Audio-URLs fehlgeschlagen, verwende SpeechSynthesis");
      if(fallbackText) fallbackSpeak(fallbackText);
      return;
    }

    const baseUrl = AUDIO_BASE_URLS[attemptIndex];
    const fullPath = baseUrl ? (baseUrl + "/" + path) : path;

    let audio = audioCache[fullPath];
    if(!audio){
      audio = new Audio(fullPath);
      audioCache[fullPath] = audio;
    }
    audio.currentTime = 0;

    const playPromise = audio.play();
    if(playPromise !== undefined){
      playPromise.then(function(){
        // Erfolg! Echte MP3 wird abgespielt
        console.log("Audio playing:", fullPath);
      }).catch(function(err){
        // Fehler - naechste URL versuchen
        console.log("Audio not found at:", fullPath, "- trying next...");
        tryPlayAudio(path, attemptIndex + 1, fallbackText);
      });
    }
  }

  function speakWord(key){
    const it = items.find(x=>x.k===key);
    if(!it) return;

    const text = getWord(it);
    const path = buildAudioPath(key);
    if(path) tryPlayAudio(path, 0, text);

    state.learned[key]=true;
    state.stars[key]=Math.min(3,(state.stars[key]||0)+1);
    save();

    renderVocab();
    updateHeader();
  }

  function fallbackSpeak(text){
    try{
      const langCode = (state.lang==="uz") ? "uz-UZ" : "en-US";
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function speakTask(text){
    try{
      if(!text) return;
      const clean = String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu, '').trim();
      if(!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = (state.lang === "uz") ? "uz-UZ" : "en-US";
      u.rate = 0.95; u.pitch = 1.05;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function announceTargetWord(it){
    if(!it) return;
    const path = buildAudioPath(it.k);
    if(path) tryPlayAudio(path, 0, getWord(it));
    else speakTask(getWord(it));
  }


  /* ===== LERN-KARTEN ===== */
  function renderVocab(){
    const grid = document.getElementById("vocabGrid");

    grid.innerHTML = items.map(it=>{
      const mainWord = getWord(it);
      const subWord = getSubWord(it);
      const st = starsText(state.stars[it.k]||0);

      return `
        <div class="learn-card">
          <div class="numCircle">
            ${it.n}<span class="numEmoji">${it.emoji}</span>
          </div>
          <div class="learn-info">
            <div class="learn-main">${mainWord}</div>
            <div class="learn-sub">${subWord}</div>
            <div class="stars">${st}</div>
          </div>
          <button class="btn-audio" onclick="speakWord('${it.k}')">🔊</button>
        </div>
      `;
    }).join("");
  }

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  /* ===== MATCHING GAME ===== */
  function initMatchingGame(){
    const nCol = document.getElementById("dragNums");
    const wCol = document.getElementById("dropWords");
    if(!nCol || !wCol) return;

    nCol.innerHTML = "";
    wCol.innerHTML = "";
    draggedElement = null;

    const pool = shuffle(items).slice(0,5);
    matchesCorrect = 0;
    matchesTotal = pool.length;

    const shuffledWords = shuffle([...pool]);
    shuffledWords.forEach(it => {
      const dz = document.createElement("div");
      dz.className = "dropZone";
      dz.innerText = getWord(it);
      dz.dataset.k = it.k;
      dz.dataset.matched = "false";

      dz.ondragenter = (e) => {
        e.preventDefault();
        if(dz.dataset.matched === "false") dz.classList.add("drag-over");
      };
      dz.ondragleave = () => dz.classList.remove("drag-over");
      dz.ondragover = (e) => e.preventDefault();
      dz.ondrop = (e) => handleDrop(e, dz);

      wCol.appendChild(dz);
    });

    pool.forEach(it => {
      const d = document.createElement("div");
      d.className = "dragItem";
      d.innerHTML = `${it.n}<span class="dragEmoji">${it.emoji}</span>`;
      d.dataset.k = it.k;
      d.draggable = true;

      d.ondragstart = (e) => {
        draggedElement = d;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", it.k);
        setTimeout(() => d.style.opacity = "0.5", 0);
      };
      d.ondragend = () => {
        d.style.opacity = "1";
        draggedElement = null;
      };

      d.ontouchstart = (e) => handleTouchStart(e, d);
      d.ontouchmove = (e) => handleTouchMove(e, d);
      d.ontouchend = (e) => handleTouchEnd(e, d);

      nCol.appendChild(d);
    });
  }

  function handleDrop(e, dropZone) {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    if(dropZone.dataset.matched === "true") return;

    const draggedKey = e.dataTransfer.getData("text/plain");
    checkMatch(draggedKey, dropZone);
  }

  function checkMatch(key, dropZone) {
    if(key === dropZone.dataset.k) {
      dropZone.dataset.matched = "true";
      dropZone.classList.add("matched");
      dropZone.innerText = "✅ " + dropZone.innerText;

      const dragEl = document.querySelector(`.dragItem[data-k="${key}"]`);
      if(dragEl) dragEl.classList.add("matched");

      matchesCorrect++;

      if(matchesCorrect === matchesTotal) {
        state.games.g1 = true;
        save();
        updateBadges();
        unlockSticker(2);
        setTimeout(() => celebrate("winMatchTitle", "winMatchText", "wellDoneEmoji"), 300);
      }
    } else {
      dropZone.classList.add("bad");
      setTimeout(() => dropZone.classList.remove("bad"), 500);
    }
  }

  /* Touch Handler */
  function handleTouchStart(e, elem) {
    const touch = e.touches[0];
    const rect = elem.getBoundingClientRect();
    touchOffsetX = touch.clientX - rect.left;
    touchOffsetY = touch.clientY - rect.top;

    elem.classList.add("dragging");
    draggedElement = elem;
    moveAt(touch.clientX, touch.clientY, elem);
  }

  function handleTouchMove(e, elem) {
    e.preventDefault();
    const touch = e.touches[0];
    moveAt(touch.clientX, touch.clientY, elem);

    document.querySelectorAll(".dropZone").forEach(dz => {
      if(dz.dataset.matched === "true") return;
      if(isOver(touch.clientX, touch.clientY, dz)) {
        dz.classList.add("drag-over");
      } else {
        dz.classList.remove("drag-over");
      }
    });
  }

  function handleTouchEnd(e, elem) {
    elem.classList.remove("dragging");
    elem.style.position = "";
    elem.style.left = "";
    elem.style.top = "";
    elem.style.width = "";

    const touch = e.changedTouches[0];
    let dropped = false;

    document.querySelectorAll(".dropZone").forEach(dz => {
      dz.classList.remove("drag-over");
      if(!dropped && dz.dataset.matched === "false" && isOver(touch.clientX, touch.clientY, dz)) {
        checkMatch(elem.dataset.k, dz);
        dropped = true;
      }
    });

    draggedElement = null;
  }

  function moveAt(x, y, elem) {
    elem.style.position = "fixed";
    elem.style.left = (x - touchOffsetX) + "px";
    elem.style.top = (y - touchOffsetY) + "px";
    elem.style.width = elem.offsetWidth + "px";
  }

  function isOver(x, y, elem) {
    const rect = elem.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  /* ===== COUNTING GAME ===== */
  let countStreak = 0;
  const COUNT_WIN = 5;

  function startCountingGame(){
    const area = document.getElementById("emojiArea");
    const choices = document.getElementById("countChoices");
    const hintEl = document.getElementById("hintCount");
    if(!area || !choices) return;

    if(countStreak >= COUNT_WIN){
      countStreak = 0;
      unlockSticker(1);
      celebrate("winCountTitle", "winCountText", "wellDoneEmoji");
      return;
    }

    choices.innerHTML = "";
    if(hintEl) hintEl.innerHTML = UI[state.lang].hintCount + " <span style='color:var(--success)'>[" + countStreak + "/" + COUNT_WIN + "]</span>";
    const target = Math.floor(Math.random() * 10) + 1;
    area.innerText = "🍎".repeat(target);

    const opts = new Set([target]);
    while(opts.size < 4) opts.add(Math.floor(Math.random() * 10) + 1);

    shuffle([...opts]).forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "choiceBtn";
      btn.innerText = opt;
      btn.onclick = () => {
        if(opt === target){
          btn.classList.add("good");
          countStreak++;
          state.games.g3 = true;
          save();
          updateBadges();
          if(countStreak >= COUNT_WIN){
            setTimeout(startCountingGame, 500);
          } else {
            setTimeout(startCountingGame, 750);
          }
        } else {
          btn.classList.add("bad");
          countStreak = 0;
          setTimeout(() => btn.classList.remove("bad"), 240);
        }
      };
      choices.appendChild(btn);
    });
  }

  /* ===== BALLOON GAME ===== */
  function stopBalloonGame(){
    if(balloonInterval){
      clearInterval(balloonInterval);
      balloonInterval = null;
    }
  }

  function startBalloonGame(){
    stopBalloonGame();
    const area = document.getElementById("balloonArea");
    const task = document.getElementById("balloonTask");
    if(!area || !task) return;

    area.innerHTML = "";
    let balloonScore = 0;
    const needed = 5;

    const targetItem = items[Math.floor(Math.random() * items.length)];
    let currentTarget = targetItem.n;

    const targetWord = getWord(targetItem);
    task.innerText = UI[state.lang].find + " " + targetWord;
    setTimeout(()=>announceTargetWord(targetItem), 400);

    balloonInterval = setInterval(() => {
      const b = document.createElement("div");
      b.className = "balloon";

      // 60% chance for target number to appear (faster finding)
      let chosenItem;
      if(Math.random() < 0.6){
        chosenItem = items.find(x => x.n === currentTarget) || items[Math.floor(Math.random() * items.length)];
      } else {
        chosenItem = items[Math.floor(Math.random() * items.length)];
      }
      b.innerText = chosenItem.n;
      b.dataset.n = chosenItem.n;

      b.style.left = (Math.random() * 70 + 5) + '%';
      b.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
      b.style.pointerEvents = "auto";

      // Better click/touch handling
      const handleTap = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if(b.dataset.popped) return;
        b.dataset.popped = "true";

        if(parseInt(b.dataset.n) === currentTarget){
          b.classList.add("pop");
          b.innerText = "⭐";
          b.style.background = "#2ed573";
          b.style.borderColor = "#fff";
          balloonScore++;

          if(balloonScore >= needed){
            stopBalloonGame();
            state.games.g4 = true;
            save();
            updateBadges();
            unlockSticker(3);
            celebrate("winBalloonTitle", "winBalloonText", "wellDoneEmoji");
          } else {
            const newTarget = items[Math.floor(Math.random() * items.length)];
            currentTarget = newTarget.n;
            const newWord = getWord(newTarget);
            task.innerText = UI[state.lang].find + " " + newWord;
            announceTargetWord(newTarget);
          }
        } else {
          b.style.background = "#ffcccc";
          b.innerText = "💨";
          setTimeout(() => { if(b.parentNode) b.remove(); }, 150);
        }
      };

      b.addEventListener("click", handleTap);
      b.addEventListener("touchstart", handleTap, {passive: false});
      b.addEventListener("pointerdown", handleTap);

      area.appendChild(b);
      setTimeout(() => { if(b.parentNode && !b.dataset.popped) b.remove(); }, 4500);
    }, 700);
  }

  /* ===== QUIZ GAME ===== */
  let quizCurrentIndex = 0;
  let quizDone = [];
  const QUIZ_DONE_KEY = "lesson2_quiz_done_v1";

  function loadQuizDone(){
    try { return JSON.parse(localStorage.getItem(QUIZ_DONE_KEY) || "[]"); }
    catch { return []; }
  }
  function saveQuizDone(arr){ localStorage.setItem(QUIZ_DONE_KEY, JSON.stringify(arr)); }

  function playCurrentQuizAudio(){
    const item = items[quizCurrentIndex];
    if(!item) return;

    // Audio passend zum angezeigten Frage-Wort abspielen (andere Sprache)
    const qLang = (state.lang === "uz") ? "en" : "uz";
    const text = (qLang === "uz") ? item.uz : item.en;
    const map = (qLang === "uz") ? UZ_AUDIO_MAP : EN_AUDIO_MAP;
    const fileName = map[text] || sanitizeForFilename(text);
    const path = `audio/lesson2/${qLang}/${fileName}.mp3`;
    tryPlayAudio(path, 0, text);
  }

  function startQuizGame(){
    quizDone = loadQuizDone();
    quizCurrentIndex = 0;

    // Find first not-done item
    while(quizCurrentIndex < items.length && quizDone.includes(items[quizCurrentIndex].k)){
      quizCurrentIndex++;
    }

    if(quizCurrentIndex >= items.length){
      // All done - show completion
      const T = UI[state.lang];
      unlockSticker(4);
      celebrate("quizWinTitle", "quizWinText", "wellDoneEmoji");
      document.getElementById("quizChoices").innerHTML =
        '<button class="btn primary" onclick="resetQuiz()">🔁 ' + (state.lang==="uz"?"Qayta boshlash":"Restart") + '</button>';
      return;
    }

    renderQuizQuestion();
  }

  function renderQuizQuestion(){
    const item = items[quizCurrentIndex];
    const T = UI[state.lang];

    // Show emoji and ask for the word
    document.getElementById("quizEmoji").innerText = item.emoji;

    // Question: show emoji, ask for the OTHER language word
    const questionWord = state.lang === "uz" ? item.uz : item.en;
    const askForWord = state.lang === "uz" ? item.en : item.uz;
    document.getElementById("quizQuestion").innerText = item.n + " - " + askForWord;

    // Create 3 choices: correct + 2 random wrong
    const correct = getWord(item);  // the word in current language
    const allWords = items.map(x => getWord(x));
    const wrongChoices = shuffle(allWords.filter(w => w !== correct)).slice(0, 2);
    const choices = shuffle([correct, ...wrongChoices]);

    const box = document.getElementById("quizChoices");
    box.innerHTML = "";

    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "choiceBtn";
      btn.innerText = choice;
      btn.onclick = () => {
        if(choice === correct){
          btn.classList.add("good");

          // Mark as learned
          state.learned[item.k] = true;
          state.stars[item.k] = Math.min(3, (state.stars[item.k] || 0) + 1);

          // Add to quiz done
          if(!quizDone.includes(item.k)){
            quizDone.push(item.k);
            saveQuizDone(quizDone);
          }

          save();
          updateHeader();
          renderVocab();

          setTimeout(() => {
            quizCurrentIndex++;
            startQuizGame();
          }, 500);
        } else {
          btn.classList.add("bad");
          setTimeout(() => btn.classList.remove("bad"), 600);
        }
      };
      box.appendChild(btn);
    });
  }

  function resetQuiz(){
    saveQuizDone([]);
    quizCurrentIndex = 0;
    startQuizGame();
  }

  /* ===== STICKER ALBUM (wie lesson1) ===== */
  const STICKERS_KEY = "lesson2_stickers_v1";

  function toggleAlbum() {
    const album = document.getElementById('albumOverlay');
    album.style.display = (album.style.display === 'flex') ? 'none' : 'flex';

    const earned = JSON.parse(localStorage.getItem(STICKERS_KEY) || "[]");
    earned.forEach(id => {
      const el = document.getElementById('stk_' + id);
      if(el) el.classList.add('unlocked');
    });
  }

  function unlockSticker(id) {
    let earned = JSON.parse(localStorage.getItem(STICKERS_KEY) || "[]");
    if(!earned.includes(id)) {
      earned.push(id);
      localStorage.setItem(STICKERS_KEY, JSON.stringify(earned));
    }
  }

  /* ===== INIT ===== */
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('albumOverlay').style.display = 'none';
    load();
    updateUI();
    updateHeader();
    renderVocab();
    updateBadges();
    openSection('learn');
  });
</script>
